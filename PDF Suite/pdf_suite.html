<style>
  /* ---------- Tool picker ---------- */
  .nav-toggle { display: none; }
  .tool-items .tool-item .ph { width: 1.125rem; }

  /* ---------- Shared bits ---------- */
  .pdf-live { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  fieldset.form-group { border: 0; padding: 0; margin-left: 0; margin-right: 0; min-width: 0; }

  .num { font-variant-numeric: tabular-nums; }
  .field-note { margin: 4px 0 0; }

  /* ---------- File cards (multi-file tools) ---------- */
  .file-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin: 0 0 12px;
  }
  .file-toolbar .summary { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .file-toolbar .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .file-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin: 0 0 16px;
  }
  .file-card {
    position: relative;
    display: flex; flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);

  .file-card.drop-target, .page-card.drop-target { border-color: var(--accent); background: var(--accent-tint); }
  .file-card.chosen, .page-card.chosen { border-color: var(--accent); box-shadow: var(--shadow); }
  .file-card:focus-within { border-color: var(--accent); }
  .file-card .thumb {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: var(--radius);
    background: var(--surface-2);

    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .file-card .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; pointer-events: none; }
  .file-card .thumb .ph { font-size: 2rem; }
  .file-card .thumb .spinner { position: absolute; }
  .file-card .index, .page-card .index {
    position: absolute; top: 6px; left: 6px;
    min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 11px;

    font-family: var(--font-mono); font-size: 0.6875rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .file-card .name {

  .page-card .thumb {

  .page-card .index { top: 4px; left: 4px; }
  .page-card .src { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--text-faint); text-align: center; margin-top: 6px; }
  .page-card .card-actions { margin-top: 6px; justify-content: center; }

  /* ---------- Previews and outputs ---------- */
  .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin: 16px 0 0; }
  .preview-grid img { width: 100%; border-radius: var(--radius); border: 1px solid var(--border); display: block; background: #fff; }

  .batch-list li:last-child { border-bottom: 0; }
  .batch-list .fn { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }

  body.page-dragover .drop-zone, body.page-dragover .drop-more { border-style: solid; border-color: var(--accent); background: var(--accent-tint); }

  /* ---------- Settings beside a live preview ---------- */
  .with-preview { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }

  .pv { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); padding: 12px; }

  /* Position grid for the watermark */
  .pos-grid { display: grid; grid-template-columns: repeat(3, 34px); gap: 4px; }
  .pos-grid label { margin: 0; position: relative; }
  .pos-grid input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .pos-grid span {

  .pos-grid span::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); }
  .pos-grid input:checked + span { border-color: var(--accent); background: var(--accent-tint); }
  .pos-grid input:checked + span::after { background: var(--accent); }
  .pos-grid input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pos-grid.disabled { opacity: 0.45; pointer-events: none; }

  /* ---------- Password fields ---------- */
  .pw-field { position: relative; }

  .owner-pw code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; word-break: break-all; }

  /* ---------- Before and after viewer ---------- */
  .cmp-viewer {

    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;

  }
  .cmp-viewer canvas { display: block; width: 100%; height: auto; }
  .cmp-viewer .cmp-before { position: absolute; inset: 0; }
  .cmp-viewer .cmp-before canvas { height: 100%; }
  .cmp-divider {
    position: absolute; top: 0; bottom: 0; width: 44px; margin-left: -22px;

  }
  .cmp-divider::before { content: ''; position: absolute; top: 0; bottom: 0; left: 21px; width: 2px; background: var(--accent); }
  .cmp-divider .knob {
    position: relative; width: 34px; height: 34px; border-radius: 50%;

  }
  .cmp-divider:focus-visible .knob { outline: 3px solid var(--accent-tint); outline-offset: 2px; }

  /* ---------- Page viewer (sign, redact) ---------- */
  .doc-view { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 0 0 16px; }
  .doc-page {

  }

  .doc-overlay { position: absolute; inset: 0; }

  .doc-page-label { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--text-faint); margin: 0 0 12px; font-variant-numeric: tabular-nums; }

  @media (max-width: 900px) {

      width: 100%; min-height: 44px; margin: 0; white-space: normal; line-height: 1.25;
      background: var(--surface); border: 1px solid var(--border);
    }
    #toolList .tool-items .tool-item.active { background: var(--accent-tint); border-color: var(--accent); }
    .page-grid.compact { max-height: 360px; }

  }
  @media (pointer: coarse) {
    .card-actions .icon-btn { width: 44px; height: 44px; min-height: 44px; }
    /* Four 44px buttons do not fit one row on a phone card: arrows on top, rotate and remove below. */
    .page-card .card-actions { display: grid; grid-template-columns: repeat(2, 44px); justify-content: center; gap: 4px 10px; }
    .page-card .card-actions > :nth-child(1) { order: 1; }
    .page-card .card-actions > :nth-child(4) { order: 2; }
    .page-card .card-actions > :nth-child(2) { order: 3; }
    .page-card .card-actions > :nth-child(3) { order: 4; }
    .placement .pl-del, .rbox .rb-del { width: 36px; height: 36px; top: -18px; right: -18px; }
    .placement .pl-resize { width: 28px; height: 28px; right: -14px; bottom: -14px; }
    .pos-grid { grid-template-columns: repeat(3, 44px); }
    .pos-grid span { width: 44px; height: 44px; }
    .pw-field .pw-eye { width: 44px; height: 44px; min-height: 44px; right: 0; }
    .pw-field input { padding-right: 50px; }
  }
</style>

<body data-sw-path="../sw.js">

<header class="tool-header">
  <a class="back" href="../index.html"><i class="ph ph-arrow-left" aria-hidden="true"></i> <span>All tools</span></a>
  <h1><i class="ph ph-file-pdf" aria-hidden="true"></i> PDF Suite</h1>
  <div class="header-actions">
    <button class="icon-btn" type="button" id="themeToggle" aria-label="Toggle theme"></button>
    <a class="icon-btn" href="https://github.com/RehmozAyub/tools-for-everyone" aria-label="Source on GitHub"><i class="ph ph-github-logo" aria-hidden="true"></i></a>
  </div>
</header>

<div class="tool-layout has-subtool-nav">
  <nav class="subtool-nav" id="toolList" aria-label="PDF tools"></nav>

  <main class="tool-main" id="main">
    <p class="tool-intro">Merge, split, compress, sign, organize, redact and protect PDFs. Drop files anywhere on the page.</p>
    <div id="toolContent"></div>
    <div id="pdfLive" class="pdf-live" aria-live="polite"></div>
  </main>
</div>

<footer class="tool-footer">
  <span>Made with ❤️ by <a href="https://github.com/RehmozAyub">RehmozAyub</a></span>
  <a href="https://github.com/RehmozAyub/tools-for-everyone">Source on GitHub</a>
  <button class="link-btn" type="button" onclick="sharePage()">Share</button>
</footer>

<script>
/* =====================================================================
   Tool registry
   mode: 'order'  many files, order matters (merge, images to PDF)
         'batch'  many files, each handled on its own, one ZIP back
         'single' one file at a time
   ===================================================================== */
const TOOLS = [
  { id:'merge',         icon:'link-simple',     name:'Merge PDFs',       short:'Merge',          mode:'order',  accept:'pdf',   go:'Merge now' },
  { id:'split',         icon:'scissors',        name:'Split a PDF',      short:'Split',          mode:'single', accept:'pdf',   go:'Split now' },
  { id:'organize',      icon:'squares-four',    name:'Organize pages',   short:'Organize pages', mode:'single', accept:'pdf',   go:'Apply changes' },
  { id:'compress',      icon:'arrows-in-simple',name:'Compress a PDF',   short:'Compress',       mode:'batch',  accept:'pdf',   go:'Compress now', many:'Compress {n} files' },
  { id:'extract_text',  icon:'text-align-left', name:'Extract text',     short:'Extract text',   mode:'single', accept:'pdf',   go:'Extract text' },
  { id:'pdf_to_images', icon:'image',           name:'PDF to images',    short:'PDF to images',  mode:'single', accept:'pdf',   go:'Convert to images' },
  { id:'images_to_pdf', icon:'file-arrow-up',   name:'Images to PDF',    short:'Images to PDF',  mode:'order',  accept:'image', go:'Create PDF' },
  { id:'rotate',        icon:'arrow-clockwise', name:'Rotate pages',     short:'Rotate',         mode:'batch',  accept:'pdf',   go:'Rotate', many:'Rotate {n} files' },
  { id:'watermark',     icon:'drop',            name:'Add watermark',    short:'Watermark',      mode:'batch',  accept:'pdf',   go:'Add watermark', many:'Watermark {n} files' },
  { id:'page_numbers',  icon:'hash',            name:'Page numbers',     short:'Page numbers',   mode:'batch',  accept:'pdf',   go:'Add page numbers', many:'Number {n} files' },
  { id:'metadata',      icon:'tag',             name:'Edit metadata',    short:'Edit metadata',  mode:'single', accept:'pdf',   go:'Save metadata' },
  { id:'sign',          icon:'signature',       name:'Sign a PDF',       short:'Sign',           mode:'single', accept:'pdf',   go:'Save signed PDF' },
  { id:'redact',        icon:'eye-slash',       name:'Redact a PDF',     short:'Redact',         mode:'single', accept:'pdf',   go:'Redact and save' },
  { id:'ocr',           icon:'scan',            name:'Make scans searchable', short:'OCR',       mode:'single', accept:'pdf',   go:'Recognise text' },
  { id:'protect',       icon:'lock',            name:'Protect a PDF',    short:'Protect',        mode:'batch',  accept:'pdf',   go:'Protect', many:'Protect {n} files' },
  { id:'unlock',        icon:'lock-open',       name:'Unlock a PDF',     short:'Unlock',         mode:'batch',  accept:'pdf',   go:'Unlock', many:'Unlock {n} files' },
];
const TOOL_BY_ID = Object.fromEntries(TOOLS.map(t => [t.id, t]));
const TOOL_IDS = TOOLS.map(t => t.id);

/* Libraries loaded only when a tool first needs them. */
const LIB = {
  sortable: 'https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js',
  tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  tesseractWorker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  tesseractCore: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
  tessdata: lang => `https://cdn.jsdelivr.net/npm/@tesseract.js-data/${lang}@1.0.0/4.0.0_best_int`,
  scriptFont: 'https://cdn.jsdelivr.net/npm/@fontsource/dancing-script@5.1.0/files/dancing-script-latin-400-normal.woff2',
};

/* Start-up reads the hash itself: the shell is deferred and not ready yet. */
let currentTool = (() => { const h = location.hash.slice(1); return TOOL_BY_ID[h] ? h : 'merge'; })();

/* Files chosen for each tool. Each entry:
   { uid, name, size, type, bytes (Uint8Array), pages (number|null), encrypted (bool), thumb (dataURL|null), error (string|null) } */
const store = {};
let uidCounter = 0;

/* Typed settings survive switching between sub-tools during a visit. */
const formMemory = {};

/* Work to undo when leaving the current sub-tool (observers, open pdf.js documents). */
let teardowns = [];
function onTeardown(fn) { teardowns.push(fn); }
function teardownTool() { const fns = teardowns; teardowns = []; fns.forEach(fn => { try { fn(); } catch (e) {} }); }

const $ = id => document.getElementById(id);

/* =====================================================================
   Shell integration, every call guarded so the page works without it
   ===================================================================== */
function tfe() { return window.TFE || null; }
function markDirty(on) {
  try {
    if (on) { tfe() && tfe().setDirty && tfe().setDirty(true); return; }
    const anything = Object.values(store).some(a => a && a.length);
    if (!anything && tfe() && tfe().setDirty) tfe().setDirty(false);
  } catch (e) {}
}
function startJob(label) {
  let done = null;
  try { done = tfe() && tfe().job ? tfe().job(label) : null; } catch (e) {}
  let called = false;
  return () => { if (called) return; called = true; try { done && done(); } catch (e) {} };
}
function announce(text) {
  if (!text) return;
  try { if (tfe() && tfe().announce) { tfe().announce(text); return; } } catch (e) {}
  const live = $('pdfLive');
  if (live) { live.textContent = ''; setTimeout(() => { live.textContent = text; }, 30); }
}
function toast(msg, kind, opts) { if (typeof showToast === 'function') showToast(msg, kind, opts); }
function prefs() { try { return tfe() && tfe().prefs ? tfe().prefs('pdf') : null; } catch (e) { return null; } }
function bindPrefs() {
  const p = prefs(); const c = $('toolContent');
  if (!p || !p.bindForm || !c) return;
  try { p.bindForm(c, { onRestore: () => { applyFormMemory(currentTool); refreshAfterRestore(); } }); } catch (e) {}
}
function setSubtoolMeta(id) {
  const t = TOOL_BY_ID[id];
  try {
    if (tfe() && tfe().subtool && tfe().subtool.set) { tfe().subtool.set(id, t.name); return; }
  } catch (e) {}
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  document.title = `${t.name} - PDF Suite | Tools for Everyone`;
}

/* =====================================================================
   Navigation
   ===================================================================== */
function initToolList() {
  const nav = $('toolList');
  const cur = TOOL_BY_ID[currentTool];
  nav.innerHTML = `<button class="nav-toggle" type="button" id="navToggle" aria-expanded="false" aria-controls="toolItems">
      <span class="nav-current"><i class="ph ph-${cur.icon}" aria-hidden="true" id="navCurIcon"></i> <span id="navCurName">${cur.name}</span></span>
      <span class="nav-all"><i class="ph ph-dots-nine" aria-hidden="true"></i> All PDF tools <i class="ph ph-caret-down caret" aria-hidden="true"></i></span>
    </button>
    <div class="tool-items" id="toolItems">${TOOLS.map(t =>
      `<button class="tool-item${t.id === currentTool ? ' active' : ''}" type="button" data-tool="${t.id}"${t.id === currentTool ? ' aria-current="page"' : ''}><i class="ph ph-${t.icon}" aria-hidden="true"></i> ${t.name}</button>`).join('')}</div>`;
  $('navToggle').addEventListener('click', () => setNavOpen(!nav.classList.contains('open')));
  $('toolItems').addEventListener('click', e => {
    const b = e.target.closest('.tool-item'); if (!b) return;
    selectTool(b.dataset.tool);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && nav.classList.contains('open')) { setNavOpen(false); $('navToggle').focus(); }
  });
}
function setNavOpen(open) {
  const nav = $('toolList'); nav.classList.toggle('open', open);
  $('navToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
}

function selectTool(id, opts = {}) {
  if (!TOOL_BY_ID[id]) return;
  const wasOpen = $('toolList').classList.contains('open');
  saveFormMemory();
  teardownTool();
  currentTool = id;
  document.querySelectorAll('#toolItems .tool-item').forEach(b => {
    const on = b.dataset.tool === id;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const t = TOOL_BY_ID[id];
  $('navCurName').textContent = t.name;
  $('navCurIcon').className = 'ph ph-' + t.icon;
  setNavOpen(false);
  renderTool();
  setSubtoolMeta(id);
  if (wasOpen || opts.focus) { const h = document.querySelector('#toolContent h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: false }); } }
}

/* =====================================================================
   Markup helpers
   ===================================================================== */
function dropZoneHTML(id, label, hint) {
  const t = TOOL_BY_ID[id];
  const accept = t.accept === 'pdf' ? '.pdf,application/pdf' : 'image/*';
  const many = t.mode !== 'single';
  return `<div class="drop-zone" id="dz-${id}" role="button" tabindex="0" aria-label="${label}" onclick="document.getElementById('fi-${id}').click()">
    <i class="ph ph-upload-simple" aria-hidden="true"></i>
    <p class="dz-title">Drop ${many ? 'files' : 'a file'} here or browse</p>
    <p class="dz-hint">${hint}</p>
    <input type="file" id="fi-${id}" accept="${accept}" ${many ? 'multiple' : ''}>
  </div><div id="files-${id}"></div>`;
}

function info(text) {
  return `<p class="tool-info"><i class="ph ph-info" aria-hidden="true"></i> <span>${text}</span></p>`;
}

/* The primary action sits in an .action-bar that stays hidden until a file is in. */
function actionBar(toolId, icon, extra, opts = {}) {
  const t = TOOL_BY_ID[toolId];
  const type = opts.submit ? 'submit' : 'button';
  const click = opts.submit ? '' : ` onclick="runTool('${toolId}', this)"`;
  return `<div class="action-bar hidden" id="ab-${toolId}">
      <button class="btn btn-primary" type="${type}" id="go-${toolId}"${click}><i class="ph ph-${icon}" aria-hidden="true"></i> <span class="go-label">${t.go}</span></button>${extra || ''}
    </div><div id="prog-${toolId}"></div><div id="res-${toolId}"></div>`;
}

function radioGroup(legend, name, options, checked, id) {
  return `<fieldset class="form-group"${id ? ` id="${id}"` : ''}><legend>${legend}</legend><div class="radio-group">${options.map(([v, l]) =>
    `<label><input type="radio" name="${name}" value="${v}"${v === checked ? ' checked' : ''}><span>${l}</span></label>`).join('')}</div></fieldset>`;
}

function pwField(id, label, placeholder, autocomplete) {
  return `<div class="form-group"><label for="${id}">${label}</label><div class="pw-field">
      <input type="password" id="${id}" placeholder="${placeholder}" autocomplete="${autocomplete}" data-no-remember spellcheck="false" autocapitalize="off">
      <button class="icon-btn pw-eye" type="button" data-for="${id}" aria-label="Show password" aria-pressed="false"><i class="ph ph-eye" aria-hidden="true"></i></button>
    </div></div>`;
}

function renderTool() {

    case 'merge': html = `<h2>Merge PDFs</h2>${info('Combine several PDFs into one. Drag the cards to set the order, add more files at any time.')}

      ${actionBar('merge', 'link-simple')}`; break;

    case 'split': html = `<h2>Split a PDF</h2>${info('Cut a PDF into separate files, or pull chosen pages into a new one.')}
      ${dropZoneHTML('split', 'Choose a PDF to split', 'PDF, one file')}
      ${radioGroup('Mode', 'splitMode', [['all', 'Every page, one file each'], ['ranges', 'One file per range'], ['extract', 'Chosen pages into one file'], ['every', 'Every N pages'], ['size', 'Files of about X MB']], 'all')}
      <div id="splitRangeGroup" class="hidden">
        <div class="form-group"><label for="splitRange">Pages or ranges, separated by commas</label>
        <input type="text" id="splitRange" placeholder="1-3, 5, 8-" data-no-remember autocomplete="off">

        <div id="splitGrid"></div>

      <div class="form-group hidden" id="splitSizeGroup"><label for="splitSize">Largest size of each file, in MB</label><input type="number" id="splitSize" value="5" min="0.1" step="0.1" inputmode="decimal">
        <p class="muted small field-note">Each part is measured as it is built. A single page larger than this stays in a file of its own.</p></div>
      ${actionBar('split', 'scissors')}`; break;

    case 'organize': html = `<h2>Organize pages</h2>${info('Drag pages into a new order, rotate them, or remove the ones you do not need. Click pages to select several, Shift-click for a run.')}
      ${dropZoneHTML('organize', 'Choose a PDF to reorganize', 'PDF, one file')}<div id="pageGrid"></div>
      ${actionBar('organize', 'squares-four')}`; break;

    case 'compress': html = `<h2>Compress a PDF</h2>${info('Make PDFs smaller. Smart shrinks the pictures inside and keeps text selectable. The image levels redraw each page as a picture for much smaller files.')}
      ${dropZoneHTML('compress', 'Choose PDFs to compress', 'PDF, one file or many')}

    case 'pdf_to_images': html = `<h2>PDF to images</h2>${info('Turn pages into images.')}

      ${actionBar('pdf_to_images', 'image')}`; break;

    case 'images_to_pdf': html = `<h2>Images to PDF</h2>${info('Put images together into one PDF, one image per page. Drag the cards to set the order.')}
      ${dropZoneHTML('images_to_pdf', 'Choose images to convert', 'PNG, JPG, WebP, GIF, BMP, any number of files')}
      <div class="form-row">
      <div class="form-group"><label for="i2pSize">Page size</label><select id="i2pSize"><option value="fit">Same as each image</option><option value="a4">A4</option><option value="letter">Letter</option></select></div>
