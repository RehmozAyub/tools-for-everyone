      ${dropZoneHTML('metadata', 'Choose a PDF to edit', 'PDF, one file')}<div id="metaFields"></div>
      ${actionBar('metadata', 'tag', `<button class="btn btn-ghost" type="button" onclick="clearMetadataFields()"><i class="ph ph-eraser" aria-hidden="true"></i> Clear all fields</button>`)}`; break;

    case 'sign': html = `<h2>Sign a PDF</h2>${info('Draw, type or upload your signature, then click a page to place it. Add your initials and the date the same way.')}
      ${dropZoneHTML('sign', 'Choose a PDF to sign', 'PDF, one file')}
      ${signMakerHTML()}
      <div id="signStage" class="hidden">
        <div class="stamp-choice">${radioGroup('Click a page to add', 'signStamp', [['signature', 'Signature'], ['initials', 'Initials'], ['date', 'Date']], 'signature')}
          <div class="form-group" style="margin:0"><label for="signDate">Date</label><input type="date" id="signDate" data-no-remember></div></div>
        <p class="muted small sign-hint" id="signHint">Click a page to place your signature. Drag it to move, pull the corner to resize, or press Delete to remove it.</p>
        <div id="docView"></div>
      </div>
      ${actionBar('sign', 'signature')}`; break;

    case 'redact': html = `<h2>Redact a PDF</h2>${info('Black out text and pictures for good. Drag boxes over what should go, or find words to box them automatically.')}
      ${dropZoneHTML('redact', 'Choose a PDF to redact', 'PDF, one file')}
      <div id="redactStage" class="hidden">
        <div class="redact-bar">
          <div class="form-group"><label for="redFind">Find text to black out</label><input type="search" id="redFind" placeholder="A name, a number, an email" data-no-remember autocomplete="off"></div>
          <button class="btn" type="button" id="redFindBtn"><i class="ph ph-magnifying-glass" aria-hidden="true"></i> Box every match</button>
          <button class="btn" type="button" id="redDrawBtn" aria-pressed="true"><i class="ph ph-selection" aria-hidden="true"></i> Drawing boxes</button>
          <button class="btn btn-ghost" type="button" id="redClearBtn"><i class="ph ph-broom" aria-hidden="true"></i> Clear boxes</button>
        </div>
        <p class="muted small" id="redSummary">Drag on a page to draw a box.</p>
        <div class="warning-msg"><i class="ph ph-warning" aria-hidden="true"></i> <span>Redacted pages become images, so their text can no longer be selected.</span></div>
        <div id="docView"></div>
      </div>
      ${actionBar('redact', 'eye-slash')}`; break;

    case 'ocr': html = `<h2>Make scans searchable</h2>${info('Recognise the text in a scanned PDF and add an invisible text layer, so you can search, select and copy it. The pages look exactly as before.')}
      ${dropZoneHTML('ocr', 'Choose a scanned PDF', 'PDF, one file')}
      <div class="form-row">
      <div class="form-group"><label for="ocrLang">Language of the text</label><select id="ocrLang">
        <option value="eng">English</option><option value="deu">German</option><option value="fra">French</option><option value="spa">Spanish</option>
        <option value="ara">Arabic</option><option value="urd">Urdu</option><option value="hin">Hindi</option><option value="chi_sim">Chinese, simplified</option></select></div>
      <div class="form-group"><label for="ocrPages">Pages, or leave empty for all of them</label><input type="text" id="ocrPages" placeholder="1-3" data-no-remember autocomplete="off"></div></div>
      <p class="muted small" id="ocrLangNote"></p>
      <p class="muted small">The first run downloads the recognition engine and the language data, about 5 to 15 MB. They stay cached for next time.</p>
      ${actionBar('ocr', 'scan')}`; break;

    case 'protect': html = `<h2>Protect a PDF</h2>${info('Encrypt PDFs with AES so they ask for a password before they open, and choose what readers may do.')}
      ${dropZoneHTML('protect', 'Choose PDFs to protect', 'PDF, one file or many')}
      <form id="protectForm" novalidate autocomplete="off">
      <div class="form-row">${pwField('protectPw', 'Password to open the file', 'Choose a password', 'new-password')}${pwField('protectPw2', 'Confirm password', 'Type it again', 'new-password')}</div>
      <p class="muted small field-note" style="margin-bottom:16px">Keep this password safe. It cannot be recovered.</p>
      ${pwField('protectOwnerPw', 'Owner password, optional', 'Leave empty for a random one', 'new-password')}
      <p class="muted small field-note" style="margin:-8px 0 16px">The owner password guards the restrictions below. Leave it empty and a long random one is made, so nobody can lift them.</p>
      <fieldset class="form-group"><legend>Readers may</legend>
      <div class="checks">
        <label class="checkbox-label"><input type="checkbox" id="permPrint" checked> Print</label>
        <label class="checkbox-label"><input type="checkbox" id="permCopy" checked> Copy text and images</label>
        <label class="checkbox-label"><input type="checkbox" id="permModify"> Change the document</label>
        <label class="checkbox-label"><input type="checkbox" id="permAnnotate"> Add notes and fill forms</label>
      </div></fieldset>
      <div class="form-group"><label for="protectAlgo">Encryption</label><select id="protectAlgo"><option value="AES-256">AES-256, strongest</option><option value="AES-128">AES-128, for older readers</option></select></div>
      ${actionBar('protect', 'lock', '', { submit: true })}
      </form>`; break;

    case 'unlock': html = `<h2>Unlock a PDF</h2>${info('Remove the password from PDFs you know the password for. The copy you download opens without asking.')}
      ${dropZoneHTML('unlock', 'Choose protected PDFs', 'PDF, one file or many')}
      <form id="unlockForm" novalidate autocomplete="off">
      ${pwField('unlockPw', 'Password', 'The password the file uses now', 'off')}
      ${actionBar('unlock', 'lock-open', '', { submit: true })}
      </form>`; break;

    default: html = '<p>Pick a tool from the list.</p>';
  }
  c.innerHTML = html;
  setupDropZone();
  setupControls();
  bindPrefs();
  applyFormMemory(currentTool);
  refreshAfterRestore();
  renderFiles(currentTool);
  onToolShown(currentTool);
}

function previewBox(toolId, pickerId) {
  return `<div class="pv hidden" id="pv-${toolId}" aria-label="Preview">
    <div class="pv-head"><span class="pv-title">Preview</span><label for="${pickerId}">Page <input type="number" id="${pickerId}" min="1" value="1" data-no-remember inputmode="numeric"></label></div>
    <div class="pv-stage"><span class="spinner" aria-hidden="true"></span></div>
    <p class="pv-note muted small" aria-live="polite"></p></div>`;
}

/* ---------- Form memory between sub-tools ---------- */
function saveFormMemory() {
  const c = $('toolContent'); if (!c) return;
  const m = {};
  c.querySelectorAll('input[id], select[id], textarea[id]').forEach(el => {
    if (el.type === 'password' || el.type === 'file' || el.type === 'radio' || el.type === 'hidden' || el.hasAttribute('data-no-memory')) return;
    m[el.id] = el.type === 'checkbox' ? el.checked : el.value;
  });
  c.querySelectorAll('input[type="radio"]:checked').forEach(r => { m['radio:' + r.name] = r.value; });
  formMemory[currentTool] = m;
}
function applyFormMemory(toolId) {
  const m = formMemory[toolId]; const c = $('toolContent');
  if (!m || !c) return;
  for (const [k, v] of Object.entries(m)) {
    if (k.startsWith('radio:')) {
      const r = c.querySelector(`input[type="radio"][name="${k.slice(6)}"][value="${CSS.escape(String(v))}"]`);
      if (r && !r.checked) { r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true })); }
      continue;
    }
    const el = document.getElementById(k);
    if (!el || !c.contains(el)) continue;
    if (el.type === 'checkbox') { if (el.checked !== v) { el.checked = v; el.dispatchEvent(new Event('change', { bubbles: true })); } }
    else if (el.value !== v) { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); }
  }
}

/* Keeps labels and visibility in step with restored values. */
function refreshAfterRestore() {
  const p2i = $('p2iScale'); if (p2i) $('p2iScaleVal').textContent = p2i.value + 'x, about ' + Math.round(p2i.value * 72) + ' dpi';
  const op = $('wmOpacity'); if (op) $('wmOpVal').textContent = Math.round(op.value * 100) + '%';
  const sc = $('wmImgScale'); if (sc) $('wmImgScaleVal').textContent = sc.value + '%';
  if ($('cmpHint')) updateCompressHint();
  if (document.querySelector('input[name="splitMode"]')) updateSplitMode();
  if ($('wmTextGroup')) updateWatermarkMode();
  if ($('ocrLang')) updateOcrNote();
}
function updateOcrNote() {
  const n = $('ocrLangNote'); if (!n) return;
  n.textContent = ['eng', 'deu', 'fra', 'spa'].includes($('ocrLang').value)
    ? 'You get a searchable PDF, plus the text to copy or save.'
    : 'For this language you get the recognised text to copy or save. The searchable PDF layer works for English, German, French and Spanish.';
}

function radioValue(name) { const r = document.querySelector(`input[name="${name}"]:checked`); return r ? r.value : null; }

function setupControls() {
  const c = $('toolContent');
  const p2iScale = $('p2iScale');
  if (p2iScale) p2iScale.addEventListener('input', refreshAfterRestore);
  const wmOp = $('wmOpacity'); if (wmOp) wmOp.addEventListener('input', refreshAfterRestore);
  const wmSc = $('wmImgScale'); if (wmSc) wmSc.addEventListener('input', refreshAfterRestore);
  document.querySelectorAll('input[name="splitMode"]').forEach(r => r.addEventListener('change', updateSplitMode));
  const sr = $('splitRange'); if (sr) sr.addEventListener('input', syncSplitFromText);
  document.querySelectorAll('input[name="cmpLevel"]').forEach(r => r.addEventListener('change', updateCompressHint));
  document.querySelectorAll('input[name="wmType"], #wmLayout').forEach(r => r.addEventListener('change', updateWatermarkMode));
  const ocrLang = $('ocrLang');
  if (ocrLang) ocrLang.addEventListener('change', updateOcrNote);
  const wmImg = $('wmImage'); if (wmImg) wmImg.addEventListener('change', () => loadWatermarkImage(wmImg.files[0]));
  if (currentTool === 'watermark' || currentTool === 'page_numbers') {
    const picker = $(currentTool === 'watermark' ? 'wmPvPage' : 'pnPvPage');
    c.addEventListener('input', e => { if (e.target === picker) schedulePreviewPage(); else schedulePreview(); });
    c.addEventListener('change', e => { if (e.target !== picker) schedulePreview(); });
  }
  /* Show and hide for password fields. */
  c.querySelectorAll('.pw-eye').forEach(b => b.addEventListener('click', () => {
    const input = $(b.dataset.for); if (!input) return;
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    b.setAttribute('aria-pressed', show ? 'true' : 'false');
    b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    b.innerHTML = `<i class="ph ${show ? 'ph-eye-slash' : 'ph-eye'}" aria-hidden="true"></i>`;
  }));
  /* Enter in a password field submits the form. */
  ['protectForm', 'unlockForm'].forEach(fid => {
    const f = $(fid); if (!f) return;
    f.addEventListener('submit', e => { e.preventDefault(); const btn = $('go-' + currentTool); if (btn && !btn.disabled) runTool(currentTool, btn); });
  });
  if (currentTool === 'sign') setupSignControls();
  if (currentTool === 'redact') setupRedactControls();
}

/* Hooks that run when a sub-tool is shown again or its files change. */
function onToolShown(toolId) {
  const files = readyFiles(toolId);
  if (!files.length) return;
  if (toolId === 'metadata') loadMetadataFields();
  if (toolId === 'organize') { if (pageState && pageStateUid === files[0].uid) renderPageGrid(); else loadPageGrid(); }
  if (toolId === 'split') loadSplitGrid();
  if (toolId === 'watermark' || toolId === 'page_numbers') loadPreview(toolId);
  if (toolId === 'sign') loadSignView();
  if (toolId === 'redact') loadRedactView();
}

function runTool(toolId, btn) {
  const fn = {
    merge: doMerge, split: doSplit, organize: doOrganize, compress: doCompress, extract_text: doExtractText,
    pdf_to_images: doPdfToImages, images_to_pdf: doImagesToPdf, rotate: doRotate, watermark: doWatermark,
    page_numbers: doPageNumbers, metadata: doMetadata, protect: doProtect, unlock: doUnlock,
    sign: doSign, redact: doRedact, ocr: doOcr,
  }[toolId];
  if (fn) fn(btn);
}

/* =====================================================================
   File intake
   ===================================================================== */
function setupDropZone() {
  const dz = document.querySelector('#toolContent .drop-zone');
  if (!dz) return;
  const id = dz.id.replace('dz-', '');
  const fi = $('fi-' + id);
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation(); dz.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files.length) addFiles(id, e.dataTransfer.files);
  });
  fi.addEventListener('change', () => { if (fi.files.length) addFiles(id, fi.files); fi.value = ''; });
}

/* Dropping anywhere on the page feeds the current tool. Reorder drags carry no
   files, so they pass through untouched. */
let pageDragDepth = 0;
document.addEventListener('dragenter', e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  pageDragDepth++; document.body.classList.add('page-dragover');
});
document.addEventListener('dragleave', e => {
  if (!document.body.classList.contains('page-dragover')) return;
  pageDragDepth = Math.max(0, pageDragDepth - 1);
  if (pageDragDepth === 0) document.body.classList.remove('page-dragover');
});
document.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => {
  pageDragDepth = 0; document.body.classList.remove('page-dragover');
  if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  e.preventDefault();
  addFiles(currentTool, e.dataTransfer.files);
});

function acceptsFile(tool, f) {
  if (tool.accept === 'pdf') return f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
  return /^image\//.test(f.type) || /\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name);
}

function resetToolState(toolId) {
  if (toolId === 'organize') { pageState = null; pageStateUid = null; pageSel.clear(); }
  if (toolId === 'split') { splitSel.clear(); }
  if (toolId === 'sign') { signState.uid = null; signState.placements = []; }
  if (toolId === 'redact') { redState.uid = null; redState.boxes = []; }
  if (toolId === 'watermark' || toolId === 'page_numbers') closePreviewPdf();
  if (toolId === 'sign' || toolId === 'redact') closeDocView();
}

async function addFiles(toolId, fileList) {
  const tool = TOOL_BY_ID[toolId];
  const incoming = Array.from(fileList);
  const good = incoming.filter(f => acceptsFile(tool, f));
  const rejected = incoming.length - good.length;
  if (rejected) toast(rejected === 1 ? 'One file was skipped, it is not a ' + (tool.accept === 'pdf' ? 'PDF' : 'supported image') + '.'
                                     : rejected + ' files were skipped, they are not ' + (tool.accept === 'pdf' ? 'PDFs' : 'supported images') + '.', 'error');
  if (!good.length) return;

  if (tool.mode === 'single') {
    if (good.length > 1) toast(`${tool.short} takes one file at a time, so only ${good[0].name} was used.`, 'info', { duration: 6000 });
    store[toolId] = [];
    resetToolState(toolId);
  }
  if (!store[toolId]) store[toolId] = [];
  const take = tool.mode === 'single' ? [good[0]] : good;

  clearResult(toolId);
  const entries = take.map(f => ({ uid: ++uidCounter, file: f, name: f.name, size: f.size, type: f.type || guessType(f.name), bytes: null, pages: null, encrypted: false, thumb: null, error: null, loading: true }));
  store[toolId].push(...entries);
  markDirty(true);
  renderFiles(toolId);
  for (const entry of entries) {
    try {
      entry.bytes = new Uint8Array(await entry.file.arrayBuffer());
      if (tool.accept === 'pdf') await inspectPdf(entry);
      else entry.thumb = URL.createObjectURL(new Blob([entry.bytes], { type: entry.type }));
    } catch (e) {
      entry.error = friendlyError(e);
    }
    entry.loading = false;
    delete entry.file;
    renderFiles(toolId);
  }
  announce(entries.length === 1 ? `${entries[0].name} added.` : `${entries.length} files added.`);
  if (toolId === currentTool) {
    if (toolId === 'watermark' || toolId === 'page_numbers') closePreviewPdf();
    onToolShown(toolId);
  }
}

function guessType(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  return ({ png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp', gif:'image/gif', bmp:'image/bmp', svg:'image/svg+xml', pdf:'application/pdf' })[ext] || '';
}

async function inspectPdf(entry) {
  const doc = await PDFLib.PDFDocument.load(entry.bytes, { ignoreEncryption: true, updateMetadata: false });
  entry.pages = doc.getPageCount();
  entry.encrypted = !!doc.isEncrypted;
  if (!entry.encrypted) {
    try { entry.thumb = await renderPdfThumb(entry.bytes, 0, 220); } catch (e) { entry.thumb = null; }
  }
}

function readyFiles(toolId) { return (store[toolId] || []).filter(f => !f.loading && !f.error && f.bytes); }

function removeFile(toolId, uid) {
  store[toolId] = (store[toolId] || []).filter(f => f.uid !== uid);
  if (TOOL_BY_ID[toolId].mode === 'single' || !store[toolId].length) resetToolState(toolId);
  afterFilesChanged(toolId);
}

function clearFiles(toolId) {
  store[toolId] = [];
  resetToolState(toolId);
  afterFilesChanged(toolId);
  markDirty(false);
}

function afterFilesChanged(toolId) {
  clearResult(toolId);
  if (toolId !== currentTool) return;
  const clearIds = { organize: 'pageGrid', metadata: 'metaFields', split: 'splitGrid', sign: 'docView', redact: 'docView' };
  if (!(store[toolId] || []).length && clearIds[toolId]) { const el = $(clearIds[toolId]); if (el) el.innerHTML = ''; }
  renderFiles(toolId);
  if ((store[toolId] || []).length) onToolShown(toolId);
  else markDirty(false);
}

function moveFile(toolId, from, to) {
  const arr = store[toolId];
  if (!arr || from === to || from < 0 || to < 0 || from >= arr.length || to >= arr.length) return;
  const [item] = arr.splice(from, 1);
  arr.splice(to, 0, item);
  clearResult(toolId);
  renderFiles(toolId);
}

function sortFiles(toolId, how) {
  const arr = store[toolId]; if (!arr) return;
  if (how === 'name') arr.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
  if (how === 'reverse') arr.reverse();
  clearResult(toolId);
  renderFiles(toolId);
}

function clearResult(toolId) {
  const el = $('res-' + toolId); if (el) el.innerHTML = '';
  const p = $('prog-' + toolId); if (p) clearProgress(p);
}

/* ---------- Rendering the file area ---------- */
function updateActionBar(toolId) {
  const ab = $('ab-' + toolId); if (!ab) return;
  const files = store[toolId] || [];
  const has = files.length > 0;
  ab.classList.toggle('hidden', !has);
  ab.classList.toggle('is-sticky', has);
  const t = TOOL_BY_ID[toolId];
  const btn = $('go-' + toolId);
  if (btn && t.many && btn.getAttribute('aria-busy') !== 'true') {
    const lbl = btn.querySelector('.go-label');
    if (lbl) lbl.textContent = files.length > 1 ? t.many.replace('{n}', files.length) : t.go;
  }
  const wrap = $(toolId === 'watermark' ? 'wmWrap' : toolId === 'page_numbers' ? 'pnWrap' : '');
  if (wrap) wrap.classList.toggle('has-file', has);
  const stage = $(toolId === 'sign' ? 'signStage' : toolId === 'redact' ? 'redactStage' : '');
  if (stage) stage.classList.toggle('hidden', !readyFiles(toolId).some(f => !f.encrypted));
}

function renderFiles(toolId) {
  if (toolId !== currentTool) return;
  const tool = TOOL_BY_ID[toolId];
  const host = $('files-' + toolId);
  const dz = $('dz-' + toolId);
  if (!host || !dz) return;
  const files = store[toolId] || [];
  updateActionBar(toolId);

  if (!files.length) { host.innerHTML = ''; dz.classList.remove('hidden'); return; }
  dz.classList.add('hidden');

  if (tool.mode !== 'single') {
    const ordered = tool.mode === 'order';
    const totalPages = files.reduce((n, f) => n + (f.pages || 0), 0);
    const totalSize = files.reduce((n, f) => n + f.size, 0);
    const summary = tool.accept === 'pdf'
      ? `${plural(files.length, 'file', 'files')} · ${plural(totalPages, 'page', 'pages')} · ${fmtSize(totalSize)}`
      : `${plural(files.length, 'image', 'images')} · ${fmtSize(totalSize)}`;
    let html = `<div class="file-toolbar"><span class="summary">${summary}</span><div class="actions">
      <button class="btn btn-sm" type="button" onclick="document.getElementById('fi-${toolId}').click()"><i class="ph ph-plus" aria-hidden="true"></i> Add more</button>
      ${ordered ? `<button class="btn btn-sm" type="button" onclick="sortFiles('${toolId}','name')"><i class="ph ph-sort-ascending" aria-hidden="true"></i> Sort A to Z</button>
      <button class="btn btn-sm" type="button" onclick="sortFiles('${toolId}','reverse')"><i class="ph ph-arrows-down-up" aria-hidden="true"></i> Reverse</button>` : ''}
      <button class="btn btn-sm" type="button" onclick="clearFiles('${toolId}')"><i class="ph ph-x" aria-hidden="true"></i> Clear</button>
    </div></div><div class="file-cards${ordered ? ' reorderable' : ''}" id="cards-${toolId}">`;
    files.forEach((f, i) => {
      const meta = f.loading ? 'Reading...' : f.error ? 'Could not read' : tool.accept === 'pdf'
        ? `${plural(f.pages || 0, 'page', 'pages')} · ${fmtSize(f.size)}` : fmtSize(f.size);
      const thumb = f.loading ? '<span class="spinner" aria-hidden="true"></span>'
        : f.thumb ? `<img src="${f.thumb}" alt="">`
        : `<i class="ph ${tool.accept === 'pdf' ? 'ph-file-pdf' : 'ph-image'}" aria-hidden="true"></i>`;
      const lockOk = toolId === 'unlock';
      const warn = f.error ? `<span class="warn" title="${escapeHTML(f.error)}"><i class="ph ph-warning" aria-hidden="true"></i></span>`
        : f.encrypted && !lockOk ? `<span class="warn" title="Password protected. Unlock it first."><i class="ph ph-lock" aria-hidden="true"></i></span>` : '';
      html += `<div class="file-card" data-index="${i}" data-uid="${f.uid}"${ordered ? ' title="Drag to reorder"' : ''}>
        <div class="thumb">${thumb}${ordered ? `<span class="index">${i + 1}</span>` : ''}${warn}</div>
        <div class="name" title="${escapeHTML(f.name)}">${escapeHTML(f.name)}</div>
        <div class="meta">${meta}</div>
        <div class="card-actions"${ordered ? '' : ' style="justify-content:flex-end"'}>
          ${ordered ? `<button class="icon-btn" type="button" aria-label="Move ${escapeHTML(f.name)} earlier" onclick="moveFile('${toolId}',${i},${i - 1})" ${i === 0 ? 'disabled' : ''}><i class="ph ph-arrow-left" aria-hidden="true"></i></button>` : ''}
          <button class="icon-btn danger" type="button" aria-label="Remove ${escapeHTML(f.name)}" onclick="removeFile('${toolId}',${f.uid})"><i class="ph ph-trash" aria-hidden="true"></i></button>
          ${ordered ? `<button class="icon-btn" type="button" aria-label="Move ${escapeHTML(f.name)} later" onclick="moveFile('${toolId}',${i},${i + 1})" ${i === files.length - 1 ? 'disabled' : ''}><i class="ph ph-arrow-right" aria-hidden="true"></i></button>` : ''}
        </div>
      </div>`;
    });
    html += `<div class="drop-more" role="button" tabindex="0" aria-label="Add more files" onclick="document.getElementById('fi-${toolId}').click()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">
      <i class="ph ph-plus" aria-hidden="true"></i><span>Add more</span></div></div>`;
    host.innerHTML = html;
    if (ordered) initSortable($('cards-' + toolId), '.file-card', (from, to) => moveFile(toolId, from, to));
  } else {
    const f = files[0];
    const meta = f.loading ? 'Reading...' : f.error ? escapeHTML(f.error)
      : `${plural(f.pages || 0, 'page', 'pages')} · ${fmtSize(f.size)}` + (f.encrypted ? ' · <span class="lock"><i class="ph ph-lock" aria-hidden="true"></i> password protected</span>' : '');
    const thumb = f.loading ? '<span class="spinner" aria-hidden="true"></span>' : f.thumb ? `<img src="${f.thumb}" alt="">` : `<i class="ph ${f.encrypted ? 'ph-lock' : 'ph-file-pdf'}" aria-hidden="true"></i>`;
    host.innerHTML = `<div class="single-card">
      <div class="thumb">${thumb}</div>
      <div class="details"><div class="name" title="${escapeHTML(f.name)}">${escapeHTML(f.name)}</div><div class="meta">${meta}</div></div>
      <div class="actions">
        <button class="btn btn-sm" type="button" onclick="document.getElementById('fi-${toolId}').click()"><i class="ph ph-swap" aria-hidden="true"></i> Change</button>
        <button class="icon-btn" type="button" aria-label="Remove file" onclick="removeFile('${toolId}',${f.uid})"><i class="ph ph-x" aria-hidden="true"></i></button>
      </div></div>`;
  }
}

/* ---------- Drag to reorder: SortableJS handles mouse, touch and long-press ---------- */
const scriptLoads = {};
function loadScript(src) {
  if (scriptLoads[src]) return scriptLoads[src];
  scriptLoads[src] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => res();
    s.onerror = () => { delete scriptLoads[src]; s.remove(); rej(new UserError('A part of this tool could not be downloaded. Check your connection and try again.')); };
    document.head.appendChild(s);
  });
  return scriptLoads[src];
}
function loadSortable() { return window.Sortable ? Promise.resolve(window.Sortable) : loadScript(LIB.sortable).then(() => window.Sortable); }

function initSortable(container, selector, onMove) {
  if (!container) return;
  loadSortable().then(S => {
    if (!container.isConnected || !S) throw new Error('gone');
    S.create(container, {
      draggable: selector,
      animation: 150,
      delay: 200, delayOnTouchOnly: true, touchStartThreshold: 6,
      filter: 'button, input, .drop-more', preventOnFilter: false,
      ghostClass: 'dragging', chosenClass: 'chosen',
      onEnd: ev => { if (ev.oldDraggableIndex !== ev.newDraggableIndex && ev.oldDraggableIndex != null) onMove(ev.oldDraggableIndex, ev.newDraggableIndex); },
    });
  }).catch(() => { if (container.isConnected) initNativeSortable(container, selector, onMove); });
}

/* Fallback when SortableJS cannot load: native drag for mouse users.
   The arrow buttons on every card still work everywhere. */
function initNativeSortable(container, selector, onMove) {
  let dragIdx = null;
  container.querySelectorAll(selector).forEach(card => {
    card.setAttribute('draggable', 'true');
    card.addEventListener('dragstart', e => {
      dragIdx = +card.dataset.index;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(dragIdx)); } catch (err) {}
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      container.querySelectorAll('.drop-target').forEach(c => c.classList.remove('drop-target'));
      dragIdx = null;
    });
    card.addEventListener('dragover', e => {
      if (dragIdx === null) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      container.querySelectorAll('.drop-target').forEach(c => { if (c !== card) c.classList.remove('drop-target'); });
      card.classList.add('drop-target');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drop-target'));
    card.addEventListener('drop', e => {
      if (dragIdx === null) return;
      e.preventDefault(); e.stopPropagation();
      const to = +card.dataset.index;
      const from = dragIdx; dragIdx = null;
      if (from !== to) onMove(from, to);
    });
  });
}

/* =====================================================================
   PDF helpers
   ===================================================================== */
/* pdf.js transfers the buffer it is given to its worker, which detaches it.
   Always hand it a copy so the stored bytes survive for the next run. */
function pdfjsData(bytes) { return bytes.slice(); }

async function openPdfjs(bytes, password) {
  const params = { data: pdfjsData(bytes) };
  if (password !== undefined) params.password = password;
  return pdfjsLib.getDocument(params).promise;
}

async function renderPageToCanvas(page, scale) {
  const vp = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
  /* The print intent renders in one go rather than in animation-frame slices,
     so it also finishes in background tabs. */
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp, intent: 'print' }).promise;
  return canvas;
}

async function renderPdfThumb(bytes, pageIndex, targetWidth) {
  const pdf = await openPdfjs(bytes);
  try {
    const page = await pdf.getPage(pageIndex + 1);
    const w = page.getViewport({ scale: 1 }).width;
    const canvas = await renderPageToCanvas(page, targetWidth / w);
    return canvas.toDataURL('image/jpeg', 0.82);
  } finally { pdf.destroy(); }
}

/* Page thumbnails, shared by Organize and Split. Rendered once per file, in the
   background, and only while someone is watching. */
const thumbState = {};
function watchThumbs(entry, fn) {
  const s = thumbState[entry.uid] || (thumbState[entry.uid] = { urls: [], listeners: new Set(), running: false });
  s.listeners.add(fn);
  s.urls.forEach((u, i) => { if (u) fn(i, u); });
  if (!s.running && s.urls.filter(Boolean).length < (entry.pages || 0)) runThumbs(entry, s);
  const stop = () => s.listeners.delete(fn);
  onTeardown(stop);
  return stop;
}
async function runThumbs(entry, s) {
  s.running = true;
  try {
    const pdf = await openPdfjs(entry.bytes);
    try {
      for (let i = 0; i < pdf.numPages; i++) {
        if (s.urls[i]) continue;
        if (!s.listeners.size) break;
        const page = await pdf.getPage(i + 1);
        const w = page.getViewport({ scale: 1 }).width;
        const canvas = await renderPageToCanvas(page, 180 / w);
        s.urls[i] = canvas.toDataURL('image/jpeg', 0.8);
        s.listeners.forEach(fn => { try { fn(i, s.urls[i]); } catch (e) {} });
      }
    } finally { pdf.destroy(); }
  } catch (e) { /* thumbnails are a nicety, the tools work without them */ }
  s.running = false;
}

/* Visual page geometry. W and H are the page as a reader sees it (after /Rotate,
   within the crop box). toUser maps a visual point, origin bottom-left and y up,
   into the page's own coordinate space. Anything drawn must also turn by R. */
function pageGeom(page) {
  const cb = page.getCropBox();
  const R = ((Math.round((page.getRotation().angle || 0) / 90) * 90) % 360 + 360) % 360;
  const W = R % 180 ? cb.height : cb.width, H = R % 180 ? cb.width : cb.height;
  return {
    cb, R, W, H,
    toUser(vx, vy) {
      let ux, uy;
      if (R === 0) { ux = vx; uy = vy; }
      else if (R === 90) { ux = cb.width - vy; uy = vx; }
      else if (R === 180) { ux = cb.width - vx; uy = cb.height - vy; }
      else { ux = vy; uy = cb.height - vx; }
      return { x: cb.x + ux, y: cb.y + uy };
    },
  };
}

/* Messages written for the user are shown as they are. Library errors are
   translated into plain language. */
class UserError extends Error {}

function friendlyError(e) {
  if (e instanceof UserError) return e.message;
  const m = (e && e.message) || String(e);
  if ((e && e.name === 'PasswordException') || /is encrypted|ignoreEncryption|No password given|Incorrect Password/i.test(m))
    return 'This PDF is password protected. Unlock it first, then come back.';
  if (/WinAnsi cannot encode|cannot encode "/i.test(m))
    return 'Some of those characters cannot be written with the built-in PDF font. Use plain letters and numbers here, or try the text again.';
  if (/No PDF header|Invalid PDF|Failed to parse|trailer|xref|not a PDF|reading 'Pages'|reading 'Kids'|Expected instance of/i.test(m)) return 'This file could not be read as a PDF. It may be damaged.';
  if (/out of memory|Array buffer allocation|allocation failed/i.test(m)) return 'This file is too large to handle in the browser at these settings. Try a lower quality or fewer pages.';
  return m;
}

/* Load a PDF for editing. Encrypted files are refused with a clear message. */
async function loadForEdit(entry) {
  if (entry.encrypted) throw new UserError('This PDF is password protected. Unlock it first, then come back.');
  return PDFLib.PDFDocument.load(entry.bytes, { ignoreEncryption: false });
}

function requireFile(toolId, btn, message) {
  const all = store[toolId] || [];
  const files = readyFiles(toolId);
  if (!files.length) {
    if (all.some(f => f.loading)) showInlineError(btn, 'The file is still being read, one moment.');
    else if (all.length) showInlineError(btn, all.length === 1 ? 'That file could not be read. Choose another one.' : 'None of those files could be read. Choose others.');
    else showInlineError(btn, message || 'Choose a PDF first.');
    return null;
  }
  if (all.some(f => f.loading)) { showInlineError(btn, 'Some files are still being read, one moment.'); return null; }
  return files;
}

function parsePageRanges(str, total) {
  /* Returns an array of [start, end] zero-based inclusive ranges, in input order. */
  const out = [];
  for (const part of String(str || '').split(',')) {
    const t = part.trim(); if (!t) continue;
    const m = t.match(/^(\d+)?\s*[-–]\s*(\d+)?$/);
    if (m) {
      let a = m[1] ? parseInt(m[1]) : 1, b = m[2] ? parseInt(m[2]) : total;
      if (a > b) [a, b] = [b, a];
      a = Math.max(1, a); b = Math.min(total, b);
      if (a <= b) out.push([a - 1, b - 1]);
    } else {
      const n = parseInt(t); if (n >= 1 && n <= total) out.push([n - 1, n - 1]);
    }
  }
  return out;
}

function rangesToPages(ranges) {
  const pages = []; const seen = new Set();
  for (const [a, b] of ranges) for (let i = a; i <= b; i++) if (!seen.has(i)) { seen.add(i); pages.push(i); }
  return pages;
}

/* 0-based page indices from a range box; empty means every page. */
function pagesFromBox(value, total) {
  if (!String(value || '').trim()) return Array.from({ length: total }, (_, i) => i);
  const pages = rangesToPages(parsePageRanges(value, total));
  if (!pages.length) throw new UserError('Those page numbers do not match any page in this file.');
  return pages;
}

/* Sorted page indices as a compact range string, "1-3, 5". */
function pagesToRangeText(indices) {
  const s = [...indices].sort((a, b) => a - b);
  const parts = [];
  for (let i = 0; i < s.length; i++) {
    let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
    parts.push(i === j ? String(s[i] + 1) : `${s[i] + 1}-${s[j] + 1}`);
    i = j;
  }
  return parts.join(', ');
}

function baseName(name) { return String(name || 'document').replace(/\.[^.]+$/, '') || 'document'; }
function outputName(original, suffix, ext) { return `${baseName(original)}-${suffix}.${ext || 'pdf'}`; }
function uniqueName(used, name) {
  if (!used.has(name)) { used.add(name); return name; }
  const m = name.match(/^(.*?)(\.[^.]+)?$/);
  for (let i = 2; ; i++) { const n = `${m[1]}-${i}${m[2] || ''}`; if (!used.has(n)) { used.add(n); return n; } }
}
function pdfFile(bytes, name) { return new File([bytes], name, { type: 'application/pdf' }); }

/* =====================================================================
   UI helpers
   ===================================================================== */
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

function fmtSize(bytes) {
  try { if (tfe() && tfe().formatBytes) return tfe().formatBytes(bytes); } catch (e) {}
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

const outputs = {};
function keepOutput(key, blob) { outputs[key] = blob; return key; }
function downloadOutput(key, name) { const b = outputs[key]; if (b) downloadBlob(b, name); }
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* Shows a result, hooks up "Continue with" for PDF outputs, then scrolls it into
   view, focuses the download and announces it. */
function showResult(toolId, html, opts = {}) {
  const el = $('res-' + toolId); if (!el) return;
  el.innerHTML = html;
  const panel = el.querySelector('.result');
  if (!panel) return;
  if (opts.file) {
    const body = panel.querySelector('.result-body') || panel;
    try { if (tfe() && tfe().continueWith) tfe().continueWith(body, opts.file); } catch (e) {}
  }
  markDirty(true);
  revealPanel(panel);
}

function revealPanel(panel) {
  try { if (tfe() && tfe().revealResult) { tfe().revealResult(panel); return; } } catch (e) {}
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { panel.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { panel.scrollIntoView(); }
  const dl = panel.querySelector('.btn-download');
  if (dl) dl.focus({ preventScroll: true });
  else { panel.setAttribute('tabindex', '-1'); panel.focus({ preventScroll: true }); }
  const h = panel.querySelector('h2');
  announce(h ? h.textContent + ' ready.' : 'Result ready.');
}

function resultPanel(title, actions, body) {
  return `<div class="result">
    <div class="result-head"><h2>${title}</h2><div class="result-actions">${actions || ''}</div></div>
    <div class="result-body">${body || ''}</div>
  </div>`;
}

function downloadBtn(key, fileName, label) {
  return `<button class="btn btn-sm btn-download" type="button" onclick="downloadOutput('${key}','${escapeHTML(fileName).replace(/'/g, '&#39;')}')"><i class="ph ph-download-simple" aria-hidden="true"></i> ${label}</button>`;
}

function startOverBtn(toolId) {
  return `<button class="btn btn-sm" type="button" onclick="clearFiles('${toolId}')"><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i> Start over</button>`;
}

function showError(toolId, message) {
  const el = $('res-' + toolId); if (!el) return;
  el.innerHTML = `<div class="error-msg" role="alert"><i class="ph ph-warning-circle" aria-hidden="true"></i> <span>${escapeHTML(message)}</span></div>`;
  try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {}
}

function progress(toolId, pct, label) { const el = $('prog-' + toolId); if (el) setProgress(el, pct, label); }
function progressDone(toolId) { const el = $('prog-' + toolId); if (el) clearProgress(el); }

function escapeHTML(str) { const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function hexToRgb01(hex) {
  const h = /^#?([0-9a-f]{6})$/i.exec(hex || '') ? hex.replace('#', '') : '666666';
  return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
}
function canvasToBytes(canvas, type, quality) {
  return new Promise((res, rej) => canvas.toBlob(b => b ? b.arrayBuffer().then(a => res(new Uint8Array(a)), rej) : rej(new Error('Could not encode the image.')), type, quality));
}
function dataUrlToBytes(url) {
  const b64 = url.split(',')[1] || ''; const bin = atob(b64);
  const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
const nextFrame = () => new Promise(r => setTimeout(r, 0));

/* Runs a tool over one file or many. One file gives one PDF, several give one ZIP.
   work(entry, onProgress) returns { bytes, note, name? }. */
async function runBatch(toolId, btn, files, o) {
  setBusy(btn, true, o.busy);
  clearResult(toolId);
  const done = startJob(o.job || o.busy);
  try {
    if (files.length === 1) {
      const f = files[0];
      const out = await o.work(f, (p, l) => progress(toolId, p, l || o.busy));
      const name = out.name || outputName(f.name, o.suffix);
      if (o.single) { o.single(f, out, name); return; }
      const key = keepOutput(toolId, new Blob([out.bytes], { type: 'application/pdf' }));
      showResult(toolId, resultPanel(o.title, downloadBtn(key, name, 'Download PDF') + startOverBtn(toolId),
        `<p class="muted small">${out.note}</p>${out.extra || ''}`), { file: pdfFile(out.bytes, name) });
      return;
    }
    const zip = new JSZip(); const used = new Set(); const rows = []; const failed = [];
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const at = (p, l) => progress(toolId, ((i + (p || 0) / 100) / files.length) * 100, `${f.name}, ${i + 1} of ${files.length}${l ? ': ' + l : ''}`);
      at(0);
      try {
        const out = await o.work(f, at);
        const name = uniqueName(used, out.name || outputName(f.name, o.suffix));
        zip.file(name, out.bytes);
        rows.push({ f, name, out });
      } catch (e) { failed.push({ f, msg: friendlyError(e) }); }
      await nextFrame();
    }
    if (!rows.length) throw new UserError(failed.length === 1 ? failed[0].msg : `None of the files worked. ${failed[0].f.name}: ${failed[0].msg}`);
    progress(toolId, 100, 'Zipping');
    const blob = await zip.generateAsync({ type: 'blob' });
    const key = keepOutput(toolId, blob);
    const zipName = `${baseName(files[0].name)}-and-${files.length - 1}-more-${o.suffix}.zip`;
    const list = rows.map(r => `<li><span class="fn" title="${escapeHTML(r.name)}">${escapeHTML(r.name)}</span><span class="nt">${r.out.short || fmtSize(r.out.bytes.length)}</span></li>`).join('')
      + failed.map(r => `<li><span class="fn" title="${escapeHTML(r.f.name)}">${escapeHTML(r.f.name)}</span><span class="nt bad">${escapeHTML(r.msg)}</span></li>`).join('');
    showResult(toolId, resultPanel(o.titleMany || o.title, downloadBtn(key, zipName, 'Download ZIP') + startOverBtn(toolId),
      `<p class="muted small">${plural(rows.length, 'file', 'files')} in one ZIP, ${fmtSize(blob.size)}.${failed.length ? ` ${plural(failed.length, 'file was', 'files were')} skipped, see below.` : ''}${o.manyNote ? ' ' + o.manyNote : ''}</p><ul class="batch-list">${list}</ul>`));
  } catch (e) { showError(toolId, friendlyError(e)); }
  finally { setBusy(btn, false); progressDone(toolId); updateActionBar(toolId); done(); }
}


/* =====================================================================
   Merge
   ===================================================================== */
async function doMerge(btn) {
  const files = requireFile('merge', btn, 'Choose at least two PDFs first.');
  if (!files) return;
  if (files.length < 2) { showInlineError(btn, 'Add at least one more PDF to merge.'); return; }
  const locked = files.find(f => f.encrypted);
  if (locked) { showInlineError(btn, `"${locked.name}" is password protected. Unlock it first, then come back.`); return; }
  setBusy(btn, true, 'Merging...');
  clearResult('merge');
  const done = startJob('Merging PDFs');
  try {
    const merged = await PDFLib.PDFDocument.create();
    let n = 0;
    for (const f of files) {
      progress('merge', (n / files.length) * 100, `Adding ${f.name}`);
      const src = await loadForEdit(f);
      const pages = await merged.copyPages(src, src.getPageIndices());
      pages.forEach(p => merged.addPage(p));
      n++;
    }
    progress('merge', 100, 'Saving');
    const bytes = await merged.save();
    const name = outputName(files[0].name, 'merged');
    const key = keepOutput('merge', new Blob([bytes], { type: 'application/pdf' }));
    showResult('merge', resultPanel('Merged PDF', downloadBtn(key, name, 'Download merged PDF') + startOverBtn('merge'),
      `<p class="muted small">${plural(files.length, 'file', 'files')} in the order shown above, ${plural(merged.getPageCount(), 'page', 'pages')}, ${fmtSize(bytes.length)}.</p>`),
      { file: pdfFile(bytes, name) });
  } catch (e) { showError('merge', friendlyError(e)); }
  finally { setBusy(btn, false); progressDone('merge'); done(); }
}

/* =====================================================================
   Split
   ===================================================================== */
const splitSel = new Set();
let splitLastClick = null;
let splitThumbStop = null;

function updateSplitMode() {
  const mode = radioValue('splitMode') || 'all';
  const g = $('splitRangeGroup'); if (!g) return;
  g.classList.toggle('hidden', !(mode === 'ranges' || mode === 'extract'));
  $('splitEveryGroup').classList.toggle('hidden', mode !== 'every');
  $('splitSizeGroup').classList.toggle('hidden', mode !== 'size');
  if (!g.classList.contains('hidden')) loadSplitGrid();
}

function loadSplitGrid() {
  const host = $('splitGrid'); const f = readyFiles('split')[0];
  if (!host) return;
  if (!f || f.encrypted || $('splitRangeGroup').classList.contains('hidden')) { host.innerHTML = ''; return; }
  const total = f.pages || 0;
  let html = `<div class="page-toolbar"><span class="summary" id="splitSelSummary"></span><div class="actions">
      <button class="btn btn-sm" type="button" onclick="splitSelect('all')"><i class="ph ph-selection-all" aria-hidden="true"></i> Select all</button>
      <button class="btn btn-sm" type="button" onclick="splitSelect('none')"><i class="ph ph-x" aria-hidden="true"></i> Select none</button></div></div>
    <div class="page-grid compact" id="splitCards" role="listbox" aria-multiselectable="true" aria-label="Pages to split out">`;
  for (let i = 0; i < total; i++) {
    html += `<div class="page-card${splitSel.has(i) ? ' selected' : ''}" data-i="${i}" role="option" tabindex="0" aria-selected="${splitSel.has(i)}" aria-label="Page ${i + 1}">
      <div class="thumb"><span class="spinner" aria-hidden="true"></span></div><span class="index">${i + 1}</span><span class="tick"><i class="ph ph-check" aria-hidden="true"></i></span></div>`;
  }
  host.innerHTML = html + '</div>';
  updateSplitSummary();
  const cards = $('splitCards');
  cards.addEventListener('click', e => {
    const card = e.target.closest('.page-card'); if (!card) return;
    splitClick(+card.dataset.i, e.shiftKey);
  });
  cards.addEventListener('keydown', e => {
    const card = e.target.closest('.page-card'); if (!card) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); splitClick(+card.dataset.i, e.shiftKey); }
  });
  if (splitThumbStop) splitThumbStop();
  splitThumbStop = watchThumbs(f, (i, url) => {
    const t = host.querySelector(`.page-card[data-i="${i}"] .thumb`);
    if (t) t.innerHTML = `<img src="${url}" alt="">`;
  });
}

function splitClick(i, shift) {
  if (shift && splitLastClick !== null) {
    const [a, b] = splitLastClick < i ? [splitLastClick, i] : [i, splitLastClick];
    for (let k = a; k <= b; k++) splitSel.add(k);
  } else if (splitSel.has(i)) splitSel.delete(i);
  else splitSel.add(i);
  splitLastClick = i;
  $('splitRange').value = pagesToRangeText(splitSel);
  paintSplitSelection();
  clearResult('split');
}

function splitSelect(what) {
  const f = readyFiles('split')[0]; if (!f) return;
  splitSel.clear();
  if (what === 'all') for (let i = 0; i < (f.pages || 0); i++) splitSel.add(i);
  $('splitRange').value = pagesToRangeText(splitSel);
  paintSplitSelection();
}

function syncSplitFromText() {
  const f = readyFiles('split')[0]; if (!f) return;
  splitSel.clear();
  rangesToPages(parsePageRanges($('splitRange').value, f.pages || 0)).forEach(i => splitSel.add(i));
  paintSplitSelection();
}

function paintSplitSelection() {
  document.querySelectorAll('#splitCards .page-card').forEach(c => {
    const on = splitSel.has(+c.dataset.i);
    c.classList.toggle('selected', on); c.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  updateSplitSummary();
}
function updateSplitSummary() {
  const s = $('splitSelSummary'); const f = readyFiles('split')[0];
  if (s && f) s.textContent = `${plural(splitSel.size, 'page', 'pages')} selected of ${f.pages}`;
}

async function doSplit(btn) {
  const files = requireFile('split', btn); if (!files) return;
  const f = files[0];
  const mode = radioValue('splitMode') || 'all';
  const rangeStr = $('splitRange').value;
  if ((mode === 'ranges' || mode === 'extract') && !rangeStr.trim()) { showInlineError(btn, 'Pick pages below or type the pages you want.'); return; }
  const every = parseInt($('splitEvery').value);
  if (mode === 'every' && !(every >= 1)) { showInlineError(btn, 'Type how many pages go in each file.'); return; }
  const mb = parseFloat($('splitSize').value);
  if (mode === 'size' && !(mb > 0)) { showInlineError(btn, 'Type the largest size for each file, in MB.'); return; }
  setBusy(btn, true, 'Splitting...');
  clearResult('split');
  const done = startJob('Splitting a PDF');
  try {
    const src = await loadForEdit(f);
    const total = src.getPageCount();
    const base = baseName(f.name);
    const pad = String(total).length;
    const num = n => String(n).padStart(pad, '0');
    const build = async pages => { const d = await PDFLib.PDFDocument.create(); (await d.copyPages(src, pages)).forEach(p => d.addPage(p)); return d.save({ useObjectStreams: true }); };

    if (mode === 'extract') {
      const pages = rangesToPages(parsePageRanges(rangeStr, total));
      if (!pages.length) throw new UserError('That range does not match any page in this file.');
      const bytes = await build(pages);
      const name = outputName(f.name, 'pages');
      const key = keepOutput('split', new Blob([bytes], { type: 'application/pdf' }));
      showResult('split', resultPanel('Extracted pages', downloadBtn(key, name, 'Download PDF') + startOverBtn('split'),
        `<p class="muted small">${plural(pages.length, 'page', 'pages')} in one file: ${pagesToRangeText(pages)}. ${fmtSize(bytes.length)}.</p>`), { file: pdfFile(bytes, name) });
      return;
    }

    let groups;
    const range = (a, b) => Array.from({ length: b - a + 1 }, (_, k) => a + k);
    const nameFor = pages => pages.length === 1 ? `${base}-page-${num(pages[0] + 1)}.pdf` : `${base}-pages-${num(pages[0] + 1)}-${num(pages[pages.length - 1] + 1)}.pdf`;
    let prebuilt = null;
    if (mode === 'all') groups = Array.from({ length: total }, (_, i) => [i]);
    else if (mode === 'ranges') {
      const ranges = parsePageRanges(rangeStr, total);
      if (!ranges.length) throw new UserError('That range does not match any page in this file.');
      groups = ranges.map(([a, b]) => range(a, b));
    } else if (mode === 'every') {
      groups = [];
      for (let a = 0; a < total; a += every) groups.push(range(a, Math.min(total - 1, a + every - 1)));
    } else {
      /* Greedy by measured size: for each part, find the most pages that still fit
         by doubling and then halving the guess, saving each candidate to measure it. */
      const target = mb * 1024 * 1024;
      groups = []; prebuilt = [];
      let s = 0, part = 1;
      const cache = new Map();
      const measure = async count => {
        const k = s + ':' + count; if (cache.has(k)) return cache.get(k);
        progress('split', (s / total) * 100, `Measuring part ${part}`);
        const bytes = await build(range(s, s + count - 1)); cache.set(k, bytes); return bytes;
      };
      while (s < total) {
        let good = 1, goodBytes = await measure(1), hi = null, probe = 2;
        if (goodBytes.length <= target) {
          while (s + probe <= total) {
            const b = await measure(probe);
            if (b.length <= target) { good = probe; goodBytes = b; probe *= 2; } else { hi = probe; break; }
          }
          if (hi === null) {
            const rest = total - s;
            if (rest > good) { const b = await measure(rest); if (b.length <= target) { good = rest; goodBytes = b; } else hi = rest; }
          }
          if (hi !== null) {
            while (hi - good > 1) {
              const mid = (good + hi) >> 1; const b = await measure(mid);
              if (b.length <= target) { good = mid; goodBytes = b; } else hi = mid;
            }
          }
        }
        groups.push(range(s, s + good - 1)); prebuilt.push(goodBytes);
        cache.clear(); s += good; part++;
        await nextFrame();
      }
    }
    const zip = new JSZip();
    const sizes = [];
    for (let i = 0; i < groups.length; i++) {
      const name = mode === 'size' || mode === 'every' ? `${base}-part-${String(i + 1).padStart(String(groups.length).length, '0')}.pdf` : nameFor(groups[i]);
      progress('split', (i / groups.length) * 100, `Writing ${name}`);
      const bytes = prebuilt ? prebuilt[i] : await build(groups[i]);
      sizes.push(bytes.length);
      zip.file(name, bytes);
    }
    progress('split', 100, 'Zipping');
    const blob = await zip.generateAsync({ type: 'blob' });
    const key = keepOutput('split', blob);
    let extra = '';
    if (mode === 'size') {
      const over = sizes.filter(b => b > mb * 1024 * 1024).length;
      extra = ` Largest part ${fmtSize(Math.max(...sizes))}.${over ? ` ${plural(over, 'part holds', 'parts hold')} a single page that is bigger than ${mb} MB on its own.` : ''}`;
    }
    showResult('split', resultPanel('Split PDF', downloadBtn(key, `${base}-split.zip`, 'Download ZIP') + startOverBtn('split'),
      `<p class="muted small">${plural(groups.length, 'PDF', 'PDFs')} in a ZIP, ${fmtSize(blob.size)}.${extra}</p>`));
  } catch (e) { showError('split', friendlyError(e)); }
  finally { setBusy(btn, false); progressDone('split'); done(); }
}

/* =====================================================================
   Organize pages
   ===================================================================== */
/* [{ key, src, rot, removed }] in the current order. */
let pageState = null;
let pageStateUid = null;
const pageSel = new Set();
let pageLastClick = null;
let pageKeyCounter = 0;
let orgThumbStop = null;

function loadPageGrid() {
  const f = readyFiles('organize')[0];
  const grid = $('pageGrid');
  if (!f || !grid) return;
  if (f.encrypted) { grid.innerHTML = `<div class="error-msg"><i class="ph ph-lock" aria-hidden="true"></i> <span>This PDF is password protected. Unlock it first, then come back.</span></div>`; return; }
  const total = f.pages || 0;
  pageState = Array.from({ length: total }, (_, i) => ({ key: ++pageKeyCounter, src: i, rot: 0, removed: false }));
  pageStateUid = f.uid;
  pageSel.clear(); pageLastClick = null;
  renderPageGrid();
}

function renderPageGrid() {
  const grid = $('pageGrid');
  const f = readyFiles('organize')[0];
  if (!grid || !pageState || !f) return;
  const kept = pageState.filter(p => !p.removed).length;
  const selCount = pageState.filter(p => pageSel.has(p.key)).length;
  const selAllRemoved = selCount && pageState.filter(p => pageSel.has(p.key)).every(p => p.removed);
  let html = `<div class="page-toolbar"><span class="summary">${plural(kept, 'page', 'pages')} kept of ${pageState.length}. Drag to reorder.</span><div class="actions">
    <button class="btn btn-sm" type="button" onclick="pageAction('reverse')"><i class="ph ph-arrows-down-up" aria-hidden="true"></i> Reverse</button>
    <button class="btn btn-sm" type="button" onclick="pageAction('rotateAll')"><i class="ph ph-arrow-clockwise" aria-hidden="true"></i> Rotate all</button>
    <button class="btn btn-sm" type="button" onclick="pageAction('selectAll')"><i class="ph ph-selection-all" aria-hidden="true"></i> Select all</button>
    <button class="btn btn-sm" type="button" onclick="pageAction('reset')"><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i> Reset</button>
  </div></div>`;
  if (selCount) html += `<div class="select-bar" role="region" aria-label="Selected pages"><span class="count">${plural(selCount, 'page', 'pages')} selected</span>
    <button class="btn btn-sm" type="button" onclick="pageAction('rotateSel')"><i class="ph ph-arrow-clockwise" aria-hidden="true"></i> Rotate selected</button>
    <button class="btn btn-sm" type="button" onclick="pageAction('${selAllRemoved ? 'restoreSel' : 'removeSel'}')"><i class="ph ${selAllRemoved ? 'ph-arrow-u-up-left' : 'ph-trash'}" aria-hidden="true"></i> ${selAllRemoved ? 'Restore selected' : 'Remove selected'}</button>
    <button class="btn btn-sm btn-ghost" type="button" onclick="pageAction('clearSel')"><i class="ph ph-x" aria-hidden="true"></i> Clear selection</button></div>`;
  html += `<div class="page-grid" id="pageCards" role="listbox" aria-multiselectable="true" aria-label="Pages. Click to select, Shift-click to select a run.">`;
  const thumbs = (thumbState[f.uid] && thumbState[f.uid].urls) || [];
  pageState.forEach((p, i) => {
    const sel = pageSel.has(p.key);
    const thumb = thumbs[p.src] ? `<img src="${thumbs[p.src]}" alt="" style="transform:rotate(${p.rot}deg)">` : '<span class="spinner" aria-hidden="true"></span>';
    html += `<div class="page-card${p.removed ? ' removed' : ''}${sel ? ' selected' : ''}" data-index="${i}" data-src="${p.src}" data-key="${p.key}" role="option" tabindex="0" aria-selected="${sel}" aria-label="Page ${p.src + 1}${p.removed ? ', removed' : ''}${p.rot ? ', rotated ' + p.rot + ' degrees' : ''}" title="Drag to reorder, click to select">
      <div class="thumb">${thumb}</div><span class="index">${p.removed ? '–' : i + 1}</span><span class="tick"><i class="ph ph-check" aria-hidden="true"></i></span>
      <div class="src">was page ${p.src + 1}${p.rot ? ' · ' + p.rot + '°' : ''}</div>
      <div class="card-actions">
        <button class="icon-btn" type="button" aria-label="Move page ${p.src + 1} earlier" onclick="movePage(${i},${i - 1})" ${i === 0 ? 'disabled' : ''}><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
        <button class="icon-btn" type="button" aria-label="Rotate page ${p.src + 1}" onclick="rotatePage(${i})" ${p.removed ? 'disabled' : ''}><i class="ph ph-arrow-clockwise" aria-hidden="true"></i></button>
        <button class="icon-btn${p.removed ? '' : ' danger'}" type="button" aria-label="${p.removed ? 'Restore' : 'Remove'} page ${p.src + 1}" onclick="togglePage(${i})"><i class="ph ${p.removed ? 'ph-arrow-u-up-left' : 'ph-trash'}" aria-hidden="true"></i></button>
        <button class="icon-btn" type="button" aria-label="Move page ${p.src + 1} later" onclick="movePage(${i},${i + 1})" ${i === pageState.length - 1 ? 'disabled' : ''}><i class="ph ph-arrow-right" aria-hidden="true"></i></button>
      </div></div>`;
  });
  html += '</div>';
  const focusedKey = document.activeElement && document.activeElement.closest && document.activeElement.closest('#pageCards .page-card') ? document.activeElement.closest('.page-card').dataset.key : null;
  grid.innerHTML = html;
  if (focusedKey) { const el = grid.querySelector(`.page-card[data-key="${focusedKey}"]`); if (el) el.focus({ preventScroll: true }); }
  const cards = $('pageCards');
  cards.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    const card = e.target.closest('.page-card'); if (!card) return;
    pageClick(+card.dataset.index, e.shiftKey);
  });
  cards.addEventListener('keydown', e => {
    if (e.target.closest('button')) return;
    const card = e.target.closest('.page-card'); if (!card) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pageClick(+card.dataset.index, e.shiftKey); }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); togglePage(+card.dataset.index); }
  });
  initSortable(cards, '.page-card', movePage);
  if (orgThumbStop) orgThumbStop();
  orgThumbStop = watchThumbs(f, (i, url) => {
    const holder = grid.querySelector(`.page-card[data-src="${i}"] .thumb`);
    const p = pageState && pageState.find(q => q.src === i);
    if (holder && p && !holder.querySelector('img')) holder.innerHTML = `<img src="${url}" alt="" style="transform:rotate(${p.rot}deg)">`;
  });
}

function pageClick(i, shift) {
  if (!pageState) return;
  if (shift && pageLastClick !== null) {
    const [a, b] = pageLastClick < i ? [pageLastClick, i] : [i, pageLastClick];
    for (let k = a; k <= b; k++) pageSel.add(pageState[k].key);
  } else {
    const key = pageState[i].key;
    if (pageSel.has(key)) pageSel.delete(key); else pageSel.add(key);
  }
  pageLastClick = i;
  renderPageGrid();
}

function movePage(from, to) {
  if (!pageState || from === to || to < 0 || to >= pageState.length) return;
  const [item] = pageState.splice(from, 1); pageState.splice(to, 0, item);
  pageLastClick = null;
  clearResult('organize'); renderPageGrid();
}
function rotatePage(i) { if (!pageState) return; pageState[i].rot = (pageState[i].rot + 90) % 360; clearResult('organize'); renderPageGrid(); }
function togglePage(i) { if (!pageState) return; pageState[i].removed = !pageState[i].removed; clearResult('organize'); renderPageGrid(); }
function pageAction(what) {
  if (!pageState) return;
  const sel = p => pageSel.has(p.key);
  if (what === 'reverse') pageState.reverse();
  if (what === 'rotateAll') pageState.forEach(p => { if (!p.removed) p.rot = (p.rot + 90) % 360; });
  if (what === 'rotateSel') pageState.forEach(p => { if (sel(p) && !p.removed) p.rot = (p.rot + 90) % 360; });
  if (what === 'removeSel') { const n = pageState.filter(sel).length; pageState.forEach(p => { if (sel(p)) p.removed = true; }); pageSel.clear(); announce(plural(n, 'page', 'pages') + ' removed.'); }
  if (what === 'restoreSel') { pageState.forEach(p => { if (sel(p)) p.removed = false; }); pageSel.clear(); }
  if (what === 'selectAll') pageState.forEach(p => pageSel.add(p.key));
  if (what === 'clearSel') pageSel.clear();
  if (what === 'reset') { pageState = pageState.slice().sort((a, b) => a.src - b.src).map(p => ({ key: p.key, src: p.src, rot: 0, removed: false })); pageSel.clear(); }
  pageLastClick = null;
  clearResult('organize'); renderPageGrid();
}

async function doOrganize(btn) {
  const files = requireFile('organize', btn); if (!files) return;
  if (!pageState) { showInlineError(btn, 'The pages are still loading.'); return; }
  const kept = pageState.filter(p => !p.removed);
  if (!kept.length) { showInlineError(btn, 'Keep at least one page.'); return; }
  setBusy(btn, true, 'Applying...');
  clearResult('organize');
  try {
    const f = files[0];
    progress('organize', 10, 'Reading the file');
    const src = await loadForEdit(f);
    const doc = await PDFLib.PDFDocument.create();
    progress('organize', 40, 'Arranging pages');
    const copied = await doc.copyPages(src, kept.map(p => p.src));
    copied.forEach((page, i) => {
      if (kept[i].rot) page.setRotation(PDFLib.degrees((page.getRotation().angle + kept[i].rot) % 360));
      doc.addPage(page);
    });
    progress('organize', 80, 'Saving');
    const bytes = await doc.save();
    const name = outputName(f.name, 'organized');
    const key = keepOutput('organize', new Blob([bytes], { type: 'application/pdf' }));
    const removed = pageState.length - kept.length;
    const rotated = kept.filter(p => p.rot).length;
    const notes = [plural(kept.length, 'page', 'pages') + ' in the order shown'];
    if (removed) notes.push(plural(removed, 'page removed', 'pages removed'));
    if (rotated) notes.push(plural(rotated, 'page rotated', 'pages rotated'));
    showResult('organize', resultPanel('Reorganized PDF', downloadBtn(key, name, 'Download PDF') + startOverBtn('organize'),
      `<p class="muted small">${notes.join(', ')}, ${fmtSize(bytes.length)}.</p>`), { file: pdfFile(bytes, name) });
  } catch (e) { showError('organize', friendlyError(e)); }
  finally { setBusy(btn, false); progressDone('organize'); }
}

/* =====================================================================
   Compress
   ===================================================================== */
const COMPRESS_LEVELS = { high: { scale: 150 / 72, quality: 0.82 }, medium: { scale: 110 / 72, quality: 0.72 }, low: { scale: 1, quality: 0.55 } };
const CMP_HINTS = {
  smart: 'Shrinks the large pictures inside the file and leaves text and drawings untouched, so text stays selectable.',
  lossless: 'Tidies the file structure only, every detail stays exactly as it is. Gains depend on how the file was made.',
  high: 'Text will no longer be selectable. Each page is redrawn as a 150 dpi picture that stays crisp on screen and in print.',
  medium: 'Text will no longer be selectable. Each page is redrawn at about 110 dpi, a good fit for email.',
  low: 'Text will no longer be selectable. Each page is redrawn at 72 dpi with strong compression, for previews and drafts.',
};
/* Smart: pictures larger than this on their longest side are scaled down, then re-saved as JPEG. */
const SMART = { maxSide: 1800, quality: 0.72, minBytes: 20 * 1024, maxPixels: 40e6 };

function updateCompressHint() {
  const v = radioValue('cmpLevel') || 'smart';
  const h = $('cmpHint'); if (h) h.textContent = CMP_HINTS[v];
}

async function doCompress(btn) {
  const files = requireFile('compress', btn); if (!files) return;
  const level = radioValue('cmpLevel') || 'smart';
  const locked = files.length === 1 && files[0].encrypted;
  if (locked) { showInlineError(btn, 'This PDF is password protected. Unlock it first, then come back.'); return; }
  await runBatch('compress', btn, files, {
    busy: 'Compressing...', job: 'Compressing PDFs', suffix: 'compressed', title: 'Compressed PDF', titleMany: 'Compressed PDFs',
    work: async (f, onP) => {
      const r = await compressOne(f, level, onP);
      const smaller = r.bytes.length < f.size;
      /* In a batch, a file that did not get smaller goes into the ZIP as it was. */
      if (!smaller && files.length > 1) return { bytes: f.bytes, name: f.name, short: 'kept original, already smaller', note: r.note };
      const pct = Math.round((1 - r.bytes.length / f.size) * 100);
      return { ...r, short: `${fmtSize(f.size)} to ${fmtSize(r.bytes.length)}, ${pct}% smaller` };
    },
    single: (f, out, name) => finishCompress(f, out, name, level),
  });
}

async function compressOne(f, level, onP) {
  if (f.encrypted) throw new UserError('This PDF is password protected. Unlock it first, then come back.');
  if (level === 'lossless') {
    const doc = await loadForEdit(f);
    onP && onP(50, 'Tidying the file');
    return { bytes: await doc.save({ useObjectStreams: true, addDefaultPage: false }), note: 'Text stays selectable and nothing was redrawn.' };
  }
  if (level === 'smart') {
    const r = await smartCompress(f, onP);
    const note = r.replaced
      ? `${plural(r.replaced, 'picture was', 'pictures were')} made smaller. Text and drawings are untouched, so text stays selectable.`
      : r.total ? 'No picture in this file could be made smaller safely, so only the file structure was tidied. Text stays selectable.'
      : 'This file has no pictures to shrink, so only the file structure was tidied. Text stays selectable.';
    return { bytes: r.bytes, note };
  }
  const { scale, quality } = COMPRESS_LEVELS[level];
  const pdf = await openPdfjs(f.bytes);
  try {
    const out = await PDFLib.PDFDocument.create();
    for (let i = 1; i <= pdf.numPages; i++) {
      onP && onP(((i - 1) / pdf.numPages) * 100, `Redrawing page ${i} of ${pdf.numPages}`);
      const page = await pdf.getPage(i);
      const base = page.getViewport({ scale: 1 });
      const canvas = await renderPageToCanvas(page, scale);
      const img = await out.embedJpg(await canvasToBytes(canvas, 'image/jpeg', quality));
      canvas.width = canvas.height = 0;
      const p = out.addPage([base.width, base.height]);
      p.drawImage(img, { x: 0, y: 0, width: base.width, height: base.height });
    }
    onP && onP(100, 'Saving');
    const bytes = await out.save();
    return { bytes, note: `Every page was redrawn as a ${Math.round(scale * 72)} dpi JPEG, so text is no longer selectable.` };
  } finally { pdf.destroy(); }
}

/* ---------- Smart compression: shrink image XObjects, keep everything else ---------- */
async function smartCompress(entry, onP) {
  const L = PDFLib, N = n => L.PDFName.of(n);
  const doc = await loadForEdit(entry);
  const ctx = doc.context;
  const images = [];
  for (const [, obj] of ctx.enumerateIndirectObjects()) {
    if (obj instanceof L.PDFRawStream && obj.dict.lookup(N('Subtype')) === N('Image')) images.push(obj);
  }
  let replaced = 0;
  for (let i = 0; i < images.length; i++) {
    onP && onP((i / Math.max(1, images.length)) * 90, `Checking picture ${i + 1} of ${images.length}`);
    try { if (await shrinkImageStream(images[i], ctx)) replaced++; } catch (e) { /* this picture stays as it was */ }
  }
  onP && onP(95, 'Saving');
  const bytes = await doc.save({ useObjectStreams: true, addDefaultPage: false });
  return { bytes, replaced, total: images.length };
}

async function shrinkImageStream(obj, ctx) {
  const L = PDFLib, N = n => L.PDFName.of(n), d = obj.dict;
  const num = (dict, k) => { const v = dict.lookup(N(k)); return v instanceof L.PDFNumber ? v.asNumber() : null; };
  /* Leave anything with transparency, masks or an unusual decode alone. */
  if (d.has(N('SMask')) || d.has(N('Mask')) || d.has(N('Decode')) || d.has(N('SMaskInData'))) return false;
  const im = d.lookup(N('ImageMask')); if (im && im.asBoolean && im.asBoolean()) return false;
  const w = num(d, 'Width'), h = num(d, 'Height'), bpc = num(d, 'BitsPerComponent');
  if (!w || !h || w * h > SMART.maxPixels) return false;
  const orig = obj.contents.length;
  if (orig < SMART.minBytes) return false;
  const f = d.lookup(N('Filter'));
  const filters = f instanceof L.PDFName ? [f] : f instanceof L.PDFArray ? f.asArray().map(x => ctx.lookup(x)) : [];
  if (filters.length !== 1) return false;

  const cs = d.lookup(N('ColorSpace'));
  let comps = 0, keepCs = false;
  if (cs === N('DeviceRGB')) { comps = 3; keepCs = true; }
  else if (cs === N('DeviceGray')) comps = 1;
  else if (cs instanceof L.PDFArray && cs.lookup(0) === N('ICCBased')) {
    const icc = cs.lookup(1);
    const n = icc && icc.dict ? icc.dict.lookup(N('N')) : null;
    comps = n instanceof L.PDFNumber ? n.asNumber() : 0;
    keepCs = comps === 3;
  }
  if (comps !== 1 && comps !== 3) return false;

  let source;
  if (filters[0] === N('DCTDecode')) {
    const blob = new Blob([obj.contents], { type: 'image/jpeg' });
    try { source = await createImageBitmap(blob, { colorSpaceConversion: 'none', imageOrientation: 'none', premultiplyAlpha: 'none' }); }
    catch (e) { return false; }
    if (source.width !== w || source.height !== h) { source.close(); return false; }
  } else if (filters[0] === N('FlateDecode')) {
    if (bpc !== 8) return false;
    let raw = L.decodePDFRawStream(obj).decode();
    const parms = d.lookup(N('DecodeParms'));
    let pred = 1;
    if (parms instanceof L.PDFDict) {
      pred = num(parms, 'Predictor') || 1;
      const colors = num(parms, 'Colors') || 1, cols = num(parms, 'Columns') || 1, pb = num(parms, 'BitsPerComponent') || 8;
      if (pred > 1 && (colors !== comps || cols !== w || pb !== 8)) return false;
    }
    if (pred >= 10) raw = pngUnpredict(raw, w, h, comps);
    else if (pred !== 1) return false;
    if (!raw || raw.length < w * h * comps) return false;
    const idata = new ImageData(w, h); const px = idata.data;
    for (let i = 0, j = 0; i < w * h; i++, j += 4) {
      if (comps === 3) { px[j] = raw[i * 3]; px[j + 1] = raw[i * 3 + 1]; px[j + 2] = raw[i * 3 + 2]; }
      else { px[j] = px[j + 1] = px[j + 2] = raw[i]; }
      px[j + 3] = 255;
    }
    source = await createImageBitmap(idata);
  } else return false;

  const s = Math.min(1, SMART.maxSide / Math.max(w, h));
  const nw = Math.max(1, Math.round(w * s)), nh = Math.max(1, Math.round(h * s));
  const c = document.createElement('canvas'); c.width = nw; c.height = nh;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(source, 0, 0, nw, nh);
  if (source.close) source.close();
  const out = await canvasToBytes(c, 'image/jpeg', SMART.quality);
  c.width = c.height = 0;
  if (out.length >= orig * 0.9) return false;
  obj.updateContents(out);
  d.set(N('Width'), L.PDFNumber.of(nw));
  d.set(N('Height'), L.PDFNumber.of(nh));
  d.set(N('Filter'), N('DCTDecode'));
  d.set(N('BitsPerComponent'), L.PDFNumber.of(8));
  d.delete(N('DecodeParms'));
  if (!keepCs) d.set(N('ColorSpace'), N('DeviceRGB'));
  return true;
}

/* Undo PNG row filters (FlateDecode with /Predictor 10 to 15). */
function pngUnpredict(data, w, h, bpp) {
  const rowLen = w * bpp;
  const out = new Uint8Array(rowLen * h);
  let prev = new Uint8Array(rowLen), p = 0;
  for (let y = 0; y < h; y++) {
    if (p + 1 + rowLen > data.length) return null;
    const type = data[p++];
    const row = out.subarray(y * rowLen, (y + 1) * rowLen);
    for (let x = 0; x < rowLen; x++) {
      const raw = data[p + x];
      const a = x >= bpp ? row[x - bpp] : 0, b = prev[x], c = x >= bpp ? prev[x - bpp] : 0;
      let v;
      if (type === 0) v = raw;
      else if (type === 1) v = raw + a;
      else if (type === 2) v = raw + b;
      else if (type === 3) v = raw + ((a + b) >> 1);
      else if (type === 4) { const pp = a + b - c, pa = Math.abs(pp - a), pb = Math.abs(pp - b), pc = Math.abs(pp - c); v = raw + (pa <= pb && pa <= pc ? a : pb <= pc ? b : c); }
      else return null;
      row[x] = v & 255;
    }
    p += rowLen; prev = row;
  }
  return out;
}

function finishCompress(f, out, name, level) {
  const before = f.size, after = out.bytes.length;
  const saved = before - after;
  const pct = before ? Math.round((saved / before) * 100) : 0;
  if (saved <= 0) {
    /* Never push a bigger file: offer the original instead. */
    const key = keepOutput('compress-orig', new Blob([f.bytes], { type: 'application/pdf' }));
    const tip = level === 'lossless' || level === 'smart'
      ? 'Try Balanced or Smallest for scans and picture-heavy files. Those redraw each page, so text will no longer be selectable.'
      : 'Redrawing pays off for scans and files full of large pictures, not for text-only documents.';
    showResult('compress', resultPanel('Your original is already smaller', downloadBtn(key, f.name, 'Keep original') + startOverBtn('compress'),
      `<div class="compare">
        <div><div class="stat-label">Original</div><div class="stat-value">${fmtSize(before)}</div></div>
        <div><div class="stat-label">Compressed</div><div class="stat-value">${fmtSize(after)}</div></div></div>
      <p class="muted small">${out.note} ${tip}</p>`), { file: pdfFile(f.bytes, f.name) });
    return;
  }
  const key = keepOutput('compress', new Blob([out.bytes], { type: 'application/pdf' }));
  const body = `<div class="compare">
      <div><div class="stat-label">Before</div><div class="stat-value">${fmtSize(before)}</div></div>
      <div><div class="stat-label">After</div><div class="stat-value good">${fmtSize(after)}</div></div>
      <div><div class="stat-label">Saved</div><div class="stat-value good">${pct}%</div></div>
    </div><p class="muted small">${out.note}</p><div id="cmpViewerHost"></div>`;
  showResult('compress', resultPanel('Compressed PDF', downloadBtn(key, name, 'Download PDF') + startOverBtn('compress'), body), { file: pdfFile(out.bytes, name) });
  showCompareViewer($('cmpViewerHost'), f.bytes, out.bytes);
}

/* ---------- Before and after viewer with a draggable divider ---------- */
async function showCompareViewer(host, beforeBytes, afterBytes) {
  if (!host) return;
  host.innerHTML = '<p class="muted small"><span class="spinner" aria-hidden="true"></span> Drawing page 1 before and after</p>';
  let a, b;
  try {
    [a, b] = await Promise.all([openPdfjs(beforeBytes), openPdfjs(afterBytes)]);
    const pa = await a.getPage(1), pb = await b.getPage(1);
    const va = pa.getViewport({ scale: 1 }), vb = pb.getViewport({ scale: 1 });
    const cssW = Math.min(host.clientWidth || 600, 720);
    const scale = (cssW / va.width) * Math.min(2, window.devicePixelRatio || 1) * 1.5;
    const ca = await renderPageToCanvas(pa, scale);
    const cb = await renderPageToCanvas(pb, scale * (va.width / vb.width));
    if (!host.isConnected) return;
    host.innerHTML = `<div class="cmp-viewer" id="cmpViewer">
        <div class="cmp-after"></div><div class="cmp-before"></div>
        <span class="cmp-tag left">Before</span><span class="cmp-tag right">After</span>
        <div class="cmp-divider" role="slider" tabindex="0" aria-label="Before and after divider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="knob"><i class="ph ph-arrows-left-right" aria-hidden="true"></i></span></div>
      </div><p class="muted small cmp-help">Page 1 at the same scale. Drag the divider, or use the arrow keys on it, to compare.</p>`;
    const v = $('cmpViewer');
    v.querySelector('.cmp-after').appendChild(cb);
    v.querySelector('.cmp-before').appendChild(ca);
    initCompareSlider(v);
  } catch (e) { host.innerHTML = ''; }
  finally { if (a) a.destroy(); if (b) b.destroy(); }
}

function initCompareSlider(viewer) {
  const before = viewer.querySelector('.cmp-before'), handle = viewer.querySelector('.cmp-divider');
  let pos = 50, dragging = false;
  const set = p => {
    pos = clamp(p, 0, 100);
    before.style.clipPath = `inset(0 ${100 - pos}% 0 0)`;
    handle.style.left = pos + '%';
    handle.setAttribute('aria-valuenow', String(Math.round(pos)));
    handle.setAttribute('aria-valuetext', `${Math.round(pos)}% showing the original`);
  };
  const fromEvent = e => { const r = viewer.getBoundingClientRect(); set(((e.clientX - r.left) / r.width) * 100); };
  viewer.addEventListener('pointerdown', e => { dragging = true; try { viewer.setPointerCapture(e.pointerId); } catch (x) {} fromEvent(e); handle.focus({ preventScroll: true }); });
  viewer.addEventListener('pointermove', e => { if (dragging) fromEvent(e); });
  const stop = () => { dragging = false; };
  viewer.addEventListener('pointerup', stop); viewer.addEventListener('pointercancel', stop);
  handle.addEventListener('keydown', e => {
    const step = e.shiftKey ? 10 : 2;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') set(pos - step);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') set(pos + step);
    else if (e.key === 'Home') set(0);
    else if (e.key === 'End') set(100);
    else if (e.key === 'PageDown') set(pos - 25);
    else if (e.key === 'PageUp') set(pos + 25);
    else return;
    e.preventDefault();
  });
  set(50);
}


/* =====================================================================
   Extract text
   ===================================================================== */
function textFromContent(content) {
  let text = '', lastY = null;
  for (const item of content.items) {
    if (typeof item.str !== 'string') continue;
    if (lastY !== null && Math.abs(item.transform[5] - lastY) > 2) text += '\n';
    else if (text && !text.endsWith('\n') && !text.endsWith(' ') && item.str && !item.str.startsWith(' ')) text += ' ';
    text += item.str; lastY = item.transform[5];
  }
  return text.trim();
}

        `<div class="text-output" tabindex="0">${escapeHTML(allText)}</div><p class="muted small">${plural(pdf.numPages, 'page', 'pages')} read.</p>`));

}

async function doPdfToImages(btn) {
  const files = requireFile('pdf_to_images', btn); if (!files) return;
  const f = files[0];
  if (f.encrypted) { showInlineError(btn, 'This PDF is password protected. Unlock it first, then come back.'); return; }
