  try { pages = pagesFromBox($('p2iPages').value, f.pages || 0); } catch (e) { showInlineError(btn, e.message); return; }
  setBusy(btn, true, 'Converting...');
  clearResult('pdf_to_images');
  const done = startJob('Converting pages to images');
  try {
    const scale = parseFloat($('p2iScale').value);
    const format = $('p2iFormat').value;
    const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
    const ext = format === 'jpeg' ? 'jpg' : 'png';
    const pdf = await openPdfjs(f.bytes);
    try {
      const base = baseName(f.name);
      const pad = String(pdf.numPages).length;
      const items = [];
      for (let k = 0; k < pages.length; k++) {
        const i = pages[k] + 1;
        progress('pdf_to_images', (k / pages.length) * 100, `Rendering page ${i}, ${k + 1} of ${pages.length}`);
        const page = await pdf.getPage(i);
        const canvas = await renderPageToCanvas(page, scale);
        const blob = await new Promise(r => canvas.toBlob(r, mime, 0.9));
        const pc = document.createElement('canvas');
        const pw = 240, ph = Math.round(canvas.height * (pw / canvas.width));
        pc.width = pw; pc.height = ph; pc.getContext('2d').drawImage(canvas, 0, 0, pw, ph);
        const thumb = URL.createObjectURL(await new Promise(r => pc.toBlob(r, 'image/jpeg', 0.8)));
        canvas.width = canvas.height = 0;
        const name = `${base}-page-${String(i).padStart(pad, '0')}.${ext}`;
        items.push({ i, name, blob, thumb, key: keepOutput(`p2i-${i}`, blob), w: Math.round(page.getViewport({ scale }).width), h: Math.round(page.getViewport({ scale }).height) });
        await nextFrame();
      }
      const grid = '<div class="preview-grid">' + items.map(it => `<div class="pv-item"><img src="${it.thumb}" alt="Page ${it.i}" loading="lazy" width="240"><div class="preview-caption">Page ${it.i}</div>${downloadBtn(it.key, it.name, 'Download')}</div>`).join('') + '</div>';
      if (items.length === 1) {
        const it = items[0];
        showResult('pdf_to_images', resultPanel('Page image', downloadBtn(it.key, it.name, `Download ${ext.toUpperCase()}`) + startOverBtn('pdf_to_images'),
          `<p class="muted small">Page ${it.i} as ${format.toUpperCase()}, ${it.w} by ${it.h} pixels, ${fmtSize(it.blob.size)}.</p><div class="preview-grid"><div class="pv-item"><img src="${it.thumb}" alt="Page ${it.i}"></div></div>`),
          { file: new File([it.blob], it.name, { type: mime }) });
        return;
      }
      progress('pdf_to_images', 100, 'Zipping');
      const zip = new JSZip();
      items.forEach(it => zip.file(it.name, it.blob));
      const blob = await zip.generateAsync({ type: 'blob' });
      const key = keepOutput('pdf_to_images', blob);
      showResult('pdf_to_images', resultPanel('Page images', downloadBtn(key, `${base}-images.zip`, 'Download ZIP') + startOverBtn('pdf_to_images'),
        `<p class="muted small">${plural(items.length, 'page', 'pages')} as ${format.toUpperCase()} at ${scale}x, ${fmtSize(blob.size)} zipped. Each page can also be saved on its own below.</p>${grid}`));
    } finally { pdf.destroy(); }
  } catch (e) { showError('pdf_to_images', friendlyError(e)); }
  finally { setBusy(btn, false); progressDone('pdf_to_images'); done(); }
}

/* =====================================================================
   Images to PDF
   ===================================================================== */
const PAGE_SIZES = { a4: [595.28, 841.89], letter: [612, 792] };

async function embedImage(doc, f) {
  try {
    if (f.type === 'image/png') return await doc.embedPng(f.bytes);
    if (f.type === 'image/jpeg') return await doc.embedJpg(f.bytes);
  } catch (e) { /* fall through to re-encode, for CMYK JPEGs and odd PNGs */ }
  const bmp = await createImageBitmap(new Blob([f.bytes], { type: f.type }));
  const canvas = document.createElement('canvas'); canvas.width = bmp.width; canvas.height = bmp.height;
  canvas.getContext('2d').drawImage(bmp, 0, 0);
  return doc.embedPng(await canvasToBytes(canvas, 'image/png'));
}

async function doImagesToPdf(btn) {
  const files = requireFile('images_to_pdf', btn, 'Choose at least one image first.'); if (!files) return;
  setBusy(btn, true, 'Building...');
  clearResult('images_to_pdf');
  const done = startJob('Building a PDF from images');
  try {
    const sizeMode = $('i2pSize').value;
    const margin = parseFloat($('i2pMargin').value) || 0;
    const doc = await PDFLib.PDFDocument.create();
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      progress('images_to_pdf', (i / files.length) * 100, `Placing ${f.name}`);
      let img;
      try { img = await embedImage(doc, f); }
      catch (e) { throw new UserError(`"${f.name}" could not be read as an image.`); }
      let pw, ph;
      if (sizeMode === 'fit') { pw = img.width + margin * 2; ph = img.height + margin * 2; }
      else { const [a, b] = PAGE_SIZES[sizeMode]; const landscape = img.width > img.height; pw = landscape ? b : a; ph = landscape ? a : b; }
      const page = doc.addPage([pw, ph]);
      const maxW = pw - margin * 2, maxH = ph - margin * 2;
      const s = Math.min(maxW / img.width, maxH / img.height);
      const w = img.width * s, h = img.height * s;
      page.drawImage(img, { x: (pw - w) / 2, y: (ph - h) / 2, width: w, height: h });
    }
    progress('images_to_pdf', 100, 'Saving');
    const bytes = await doc.save();
    const name = baseName(files[0].name) + '.pdf';
    const key = keepOutput('images_to_pdf', new Blob([bytes], { type: 'application/pdf' }));
    showResult('images_to_pdf', resultPanel('Your PDF', downloadBtn(key, name, 'Download PDF') + startOverBtn('images_to_pdf'),
      `<p class="muted small">${plural(files.length, 'page', 'pages')}, one per image in the order shown above, ${fmtSize(bytes.length)}.</p>`), { file: pdfFile(bytes, name) });
  } catch (e) { showError('images_to_pdf', friendlyError(e)); }
  finally { setBusy(btn, false); progressDone('images_to_pdf'); done(); }
}

const WM_FONT = '"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans Arabic", "Noto Naskh Arabic", "Noto Nastaliq Urdu", "Noto Sans Devanagari", "Nirmala UI", "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Hiragino Sans", "Malgun Gothic", "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';

const stampCache = new Map();

/* Draws the text onto a canvas with the page's own fonts, so any script works
   (Arabic, Urdu, Chinese, emoji). The canvas is embedded as a transparent PNG. */
function getTextStamp(o) {
  const key = `${o.text}|${o.size}|${o.color}`;
  if (stampCache.has(key)) return stampCache.get(key);
  const probe = document.createElement('canvas').getContext('2d');
  const fontAt = px => `700 ${px}px ${WM_FONT}`;
  probe.font = fontAt(o.size);
  const approxW = probe.measureText(o.text).width || o.size;
  const ppp = Math.max(1, Math.min(4, 7000 / (approxW + o.size)));   /* pixels per point, kept under canvas limits */
  const px = o.size * ppp;
  probe.font = fontAt(px);
  const m = probe.measureText(o.text);
  const asc = m.actualBoundingBoxAscent || px * 0.8, desc = m.actualBoundingBoxDescent || px * 0.2;
  const inkW = Math.max(m.width, (m.actualBoundingBoxLeft || 0) + (m.actualBoundingBoxRight || m.width));
  const pad = Math.ceil(px * 0.08);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(inkW) + pad * 2); c.height = Math.max(1, Math.ceil(asc + desc) + pad * 2);
  const g = c.getContext('2d');
  g.font = fontAt(px); g.fillStyle = o.color; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.direction = /[֐-ࣿיִ-ﻼ]/.test(o.text) ? 'rtl' : 'ltr';
  g.fillText(o.text, c.width / 2, pad + asc);
  const stamp = { canvas: c, wPt: c.width / ppp, hPt: c.height / ppp };
  if (stampCache.size > 20) stampCache.clear();
  stampCache.set(key, stamp);
  return stamp;
}

/* Where the watermark goes on a W x H page (points, origin bottom-left).
   Returns centres, sizes and angles; the same list drives the preview and the PDF. */
function wmPlacements(W, H, o, w, h) {
  const bbox = (ww, hh, a) => { const r = a * Math.PI / 180; return [Math.abs(ww * Math.cos(r)) + Math.abs(hh * Math.sin(r)), Math.abs(ww * Math.sin(r)) + Math.abs(hh * Math.cos(r))]; };
  if (o.layout === 'tiled') {
    const tw = w * 0.5, th = h * 0.5, a = 30;
    const [bw, bh] = bbox(tw, th, a);
    const sx = bw + Math.max(24, th * 1.5), sy = bh + Math.max(24, th * 2);
    const out = [];
    let row = 0;
    for (let cy = sy / 2; cy < H + sy; cy += sy, row++)
      for (let cx = row % 2 ? sx / 2 : 0; cx < W + sx; cx += sx) out.push({ cx, cy, w: tw, h: th, angle: a });
    return out;
  }
  const a = o.layout === 'diagonal' ? 45 : 0;
  let [bw, bh] = bbox(w, h, a);
  const m = Math.min(36, W * 0.06, H * 0.06);
  const fit = Math.min(1, (W - 2 * m) / bw, (H - 2 * m) / bh);
  bw *= fit; bh *= fit;
  const row = o.pos[0], col = o.pos[1];
  const cx = col === 'l' ? m + bw / 2 : col === 'r' ? W - m - bw / 2 : W / 2;
  const cy = row === 't' ? H - m - bh / 2 : row === 'b' ? m + bh / 2 : H / 2;
  return [{ cx, cy, w: w * fit, h: h * fit, angle: a }];
}
/* Bottom-left corner of a rotated placement, which is where pdf-lib anchors it. */
function cornerOf(p) {
  const r = p.angle * Math.PI / 180, dx = -p.w / 2, dy = -p.h / 2;
  return { x: p.cx + dx * Math.cos(r) - dy * Math.sin(r), y: p.cy + dx * Math.sin(r) + dy * Math.cos(r) };
}

async function doWatermark(btn) {
  const files = requireFile('watermark', btn); if (!files) return;
  const o = readWmOptions();
  if (o.type === 'image' && !wmImage) { showInlineError(btn, 'Choose a logo or picture for the watermark first.'); return; }
  const stamp = o.type === 'text' ? getTextStamp(o) : null;
  const stampPng = stamp ? await canvasToBytes(stamp.canvas, 'image/png') : null;
  await runBatch('watermark', btn, files, {
    busy: 'Adding...', job: 'Adding watermarks', suffix: 'watermarked', title: 'Watermarked PDF', titleMany: 'Watermarked PDFs',
    work: async (f, onP) => {
      const doc = await loadForEdit(f);
      const img = stamp ? await doc.embedPng(stampPng) : await embedImage(doc, wmImage);
      const total = doc.getPageCount();
      const pages = pagesFromBox(o.pages, total);
      pages.forEach((i, k) => {
        if (k % 20 === 0) onP((k / pages.length) * 90, `Page ${i + 1}`);
        const page = doc.getPage(i); const g = pageGeom(page);
        let w, h;
        if (stamp) { w = stamp.wPt; h = stamp.hPt; } else { w = g.W * o.scale; h = w * img.height / img.width; }
        for (const p of wmPlacements(g.W, g.H, o, w, h)) {
          const c = cornerOf(p); const u = g.toUser(c.x, c.y);
          page.drawImage(img, { x: u.x, y: u.y, width: p.w, height: p.h, rotate: PDFLib.degrees(p.angle + g.R), opacity: o.opacity });
        }
      });
      onP(95, 'Saving');
      const bytes = await doc.save();
      const what = stamp ? `"${escapeHTML(o.text)}"` : 'Your picture';
      return { bytes, note: `${what} added to ${pages.length === total ? 'all ' : ''}${plural(pages.length, 'page', 'pages')}.`, short: plural(pages.length, 'page', 'pages') };
    },
  });
}

/* ---------- Live preview (watermark and page numbers) ---------- */
const pv = { toolId: null, uid: null, pdf: null, W: 0, H: 0, scale: 1, pageIdx: 0, total: 0, token: 0, timer: null, overlay: null };
let pvPageTimer = null;
function closePreviewPdf() {
  pv.token++;
  if (pv.pdf) { try { pv.pdf.destroy(); } catch (e) {} }
  pv.pdf = null; pv.uid = null; pv.overlay = null;
}
function schedulePreview() { clearTimeout(pv.timer); pv.timer = setTimeout(drawPreviewOverlay, 60); }
function schedulePreviewPage() { clearTimeout(pvPageTimer); pvPageTimer = setTimeout(() => loadPreview(currentTool), 250); }

async function loadPreview(toolId) {
  const box = $('pv-' + toolId); if (!box) return;
  const f = readyFiles(toolId)[0];
  if (!f) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const stage = box.querySelector('.pv-stage'), note = box.querySelector('.pv-note');
  if (f.encrypted) { stage.innerHTML = ''; note.textContent = 'This PDF is password protected. Unlock it first to see a preview.'; return; }
  const token = ++pv.token;
  try {
    if (!pv.pdf || pv.uid !== f.uid) {
      if (pv.pdf) { try { pv.pdf.destroy(); } catch (e) {} pv.pdf = null; }
      const pdf = await openPdfjs(f.bytes);
      if (token !== pv.token) { pdf.destroy(); return; }
      pv.pdf = pdf; pv.uid = f.uid;
      onTeardown(closePreviewPdf);
    }
    const picker = $(toolId === 'watermark' ? 'wmPvPage' : 'pnPvPage');
    picker.max = pv.pdf.numPages;
    const n = clamp(parseInt(picker.value) || 1, 1, pv.pdf.numPages);
    const page = await pv.pdf.getPage(n);
    const vp1 = page.getViewport({ scale: 1 });
    const cssW = Math.max(200, Math.min(stage.clientWidth || 480, 640));
    const scale = (cssW / vp1.width) * Math.min(2, window.devicePixelRatio || 1);
    const canvas = await renderPageToCanvas(page, scale);
    if (token !== pv.token) return;
    const over = document.createElement('canvas');
    over.className = 'pv-over'; over.width = canvas.width; over.height = canvas.height;
    canvas.className = 'pv-base';
    const frame = document.createElement('div'); frame.className = 'pv-frame';
    frame.append(canvas, over);
    stage.replaceChildren(frame);
    Object.assign(pv, { toolId, W: vp1.width, H: vp1.height, scale, pageIdx: n - 1, total: pv.pdf.numPages, overlay: over });
    await drawPreviewOverlay();
  } catch (e) {
    if (token === pv.token) { stage.innerHTML = ''; note.textContent = 'The preview could not be drawn for this page.'; }
  }
}

async function drawPreviewOverlay() {
  const over = pv.overlay;
  if (!over || !over.isConnected || pv.toolId !== currentTool) return;
  const toolId = currentTool;
  const note = document.querySelector(`#pv-${toolId} .pv-note`);
  const g = over.getContext('2d');
  g.clearRect(0, 0, over.width, over.height);
  const s = pv.scale, pageNo = pv.pageIdx + 1;
  try {
    if (toolId === 'watermark') {
      const o = readWmOptions();
      const pages = pagesFromBox(o.pages, pv.total);
      if (!pages.includes(pv.pageIdx)) { note.textContent = `Page ${pageNo} is not in the chosen pages, so it stays as it is.`; return; }
      let src, w, h;
      if (o.type === 'image') {
        if (!wmImage) { note.textContent = 'Choose a logo or picture to see it here.'; return; }
        src = wmImage.bitmap; w = pv.W * o.scale; h = w * wmImage.h / wmImage.w;
      } else { const st = getTextStamp(o); src = st.canvas; w = st.wPt; h = st.hPt; }
      g.save(); g.globalAlpha = o.opacity;
      for (const p of wmPlacements(pv.W, pv.H, o, w, h)) {
        g.save();
        g.translate(p.cx * s, (pv.H - p.cy) * s);
        g.rotate(-p.angle * Math.PI / 180);
        g.drawImage(src, (-p.w / 2) * s, (-p.h / 2) * s, p.w * s, p.h * s);
        g.restore();
      }
      g.restore();
      note.textContent = `Page ${pageNo} of ${pv.total}.`;
    } else {
      const o = readPnOptions();
      const plan = pnPlan(pv.total, o);
      const n = plan.map.get(pv.pageIdx);
      if (n === undefined) { note.textContent = `Page ${pageNo} gets no number with these settings.`; return; }
      const font = await getHelvetica();
      const txt = pnText(o.fmt, n, plan.last);
      const pt = pnAnchor(pv.W, pv.H, o, font.widthOfTextAtSize(txt, o.size));
      g.fillStyle = o.color; g.font = `${o.size * s}px Helvetica, Arial, sans-serif`; g.textBaseline = 'alphabetic';
      g.fillText(txt, pt.x * s, (pv.H - pt.y) * s);
      note.textContent = `Page ${pageNo} shows "${txt}".`;
    }
  } catch (e) { if (note) note.textContent = friendlyError(e); }
}

/* =====================================================================
   Page numbers
   ===================================================================== */
let helvPromise = null;
function getHelvetica() {
  return helvPromise || (helvPromise = PDFLib.PDFDocument.create().then(d => d.embedFont(PDFLib.StandardFonts.Helvetica)));
}
function readPnOptions() {
  const start = parseInt($('pnStart').value);
  return {
    pos: $('pnPos').value, fmt: $('pnFmt').value,
    first: isNaN(start) ? 1 : start,
    size: clamp(parseInt($('pnSize').value) || 10, 4, 72),
    color: $('pnColor').value || '#666666',
    margin: clamp(isNaN(parseFloat($('pnMargin').value)) ? 30 : parseFloat($('pnMargin').value), 0, 500),
    skipFirst: $('pnSkipFirst').checked,
    pages: $('pnPages').value,
  };
}
/* Which pages get which number. Numbers count up across the numbered pages only. */
function pnPlan(total, o) {
  let pages = pagesFromBox(o.pages, total).slice().sort((a, b) => a - b);
  if (o.skipFirst) pages = pages.filter(i => i !== 0);
  if (!pages.length) throw new UserError('No pages are left to number with these settings.');
  const map = new Map();
  pages.forEach((p, k) => map.set(p, o.first + k));
  return { pages, map, last: o.first + pages.length - 1 };
}
function pnText(fmt, n, last) {
  if (fmt === 'num') return String(n);
  if (fmt === 'page') return `Page ${n}`;
  if (fmt === 'of') return `${n} of ${last}`;
  return `Page ${n} of ${last}`;
}
/* Baseline start of the number in visual page space. */
function pnAnchor(W, H, o, tw) {
  const y = o.pos.startsWith('bottom') ? o.margin : H - o.margin - o.size * 0.72;
  const x = o.pos.endsWith('center') ? (W - tw) / 2 : o.pos.endsWith('right') ? W - o.margin - tw : o.margin;
  return { x, y };
}

async function doPageNumbers(btn) {
  const files = requireFile('page_numbers', btn); if (!files) return;
  const o = readPnOptions();
  const [r, g, b] = hexToRgb01(o.color);
  await runBatch('page_numbers', btn, files, {
    busy: 'Numbering...', suffix: 'numbered', title: 'Numbered PDF', titleMany: 'Numbered PDFs',
    work: async (f, onP) => {
      const doc = await loadForEdit(f);
      const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
      const plan = pnPlan(doc.getPageCount(), o);
      plan.pages.forEach((i, k) => {
        if (k % 25 === 0) onP((k / plan.pages.length) * 90, `Page ${i + 1}`);
        const page = doc.getPage(i); const geo = pageGeom(page);
        const txt = pnText(o.fmt, plan.map.get(i), plan.last);
        const a = pnAnchor(geo.W, geo.H, o, font.widthOfTextAtSize(txt, o.size));
        const u = geo.toUser(a.x, a.y);
        page.drawText(txt, { x: u.x, y: u.y, size: o.size, font, color: PDFLib.rgb(r, g, b), rotate: PDFLib.degrees(geo.R) });
      });
      onP(95, 'Saving');
      const bytes = await doc.save();
      const first = o.first, last = plan.last;
      return { bytes, note: `Numbers ${first} to ${last} added to ${plural(plan.pages.length, 'page', 'pages')}${o.skipFirst ? ', the cover left blank' : ''}.`, short: `${first} to ${last}` };
    },
  });
}

/* =====================================================================
   Protect
   ===================================================================== */
/* A long random owner password when none is given, so the restrictions hold:
   reusing the open password would hand every reader owner rights. */
function randomPassword(len) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789-_';
  const out = [];
  while (out.length < len) {
    const buf = new Uint8Array(len * 2);
    crypto.getRandomValues(buf);
    for (const v of buf) { if (v < 256 - (256 % chars.length) && out.length < len) out.push(chars[v % chars.length]); }
  }
  return out.join('');
}
let lastProtect = null;

async function doProtect(btn) {
  const files = requireFile('protect', btn); if (!files) return;
  clearInlineErrors();
  const pwEl = $('protectPw'), pw2El = $('protectPw2'), ownEl = $('protectOwnerPw');
  const pw = pwEl.value, pw2 = pw2El.value, ownerIn = ownEl.value;
  if (!pw) { showInlineError(pwEl.closest('.pw-field'), 'Enter a password first.'); pwEl.focus(); return; }
  if (pw !== pw2) { showInlineError(pw2El.closest('.pw-field'), pw2 ? 'The two passwords do not match.' : 'Type the password again to confirm it.'); pw2El.focus(); return; }
  if (ownerIn && ownerIn === pw) { showInlineError(ownEl.closest('.pw-field'), 'Use a different owner password, or leave it empty. The same one would let every reader lift the restrictions.'); ownEl.focus(); return; }
  if (files.length === 1 && files[0].encrypted) { showInlineError(btn, 'This PDF is already password protected. Unlock it first if you want to change the password.'); return; }
  const generated = !ownerIn;
  const ownerPw = ownerIn || randomPassword(32);
  const algorithm = $('protectAlgo').value;
  const permissions = {
    printing: $('permPrint').checked ? 'highResolution' : false,
    copying: $('permCopy').checked,
    modifying: $('permModify').checked,
    annotating: $('permAnnotate').checked,
    fillingForms: $('permAnnotate').checked,
    contentAccessibility: true,
    documentAssembly: $('permModify').checked,
  };
  const allowed = [];
  if (permissions.printing) allowed.push('print'); if (permissions.copying) allowed.push('copy'); if (permissions.modifying) allowed.push('edit'); if (permissions.annotating) allowed.push('annotate');
  const restricted = allowed.length < 4;
  lastProtect = { ownerPw, generated };
  const lock = restricted
    ? (generated ? ' The restrictions are locked with a long random owner password, so they hold even for people who know the open password.'
                 : ' Your owner password is needed to lift the restrictions.')
    : '';
  const note = `Encrypted with ${algorithm}. It asks for the password before it opens. Readers may ${allowed.length ? allowed.join(', ') : 'only read'}.${lock} Keep the password safe, it cannot be recovered.`;
  await runBatch('protect', btn, files, {
    busy: 'Encrypting...', job: 'Encrypting PDFs', suffix: 'protected', title: 'Protected PDF', titleMany: 'Protected PDFs', manyNote: note,
    work: async (f, onP) => {
      if (f.encrypted) throw new UserError('Already password protected. Unlock it first to change the password.');
      const doc = await loadForEdit(f);
      onP(30, 'Encrypting');
      doc.encrypt({ userPassword: pw, ownerPassword: ownerPw, permissions, algorithm });
      const bytes = await doc.save();
      /* Never claim success without proof: the result must refuse to open without the password. */
      let refused = false;
      try { const t = await openPdfjs(bytes); t.destroy(); } catch (e) { refused = e && e.name === 'PasswordException'; }
      if (!refused) throw new UserError('Encryption did not take. The file was not saved.');
      return { bytes, note, short: 'encrypted' };
    },
  });
}

/* =====================================================================
   Unlock
   ===================================================================== */
async function doUnlock(btn) {
  const files = requireFile('unlock', btn); if (!files) return;
  clearInlineErrors();
  const pw = $('unlockPw').value;
  if (files.length === 1 && !files[0].encrypted) { showInlineError(btn, 'This PDF is not password protected, there is nothing to unlock.'); return; }
  await runBatch('unlock', btn, files, {
    busy: 'Unlocking...', suffix: 'unlocked', title: 'Unlocked PDF', titleMany: 'Unlocked PDFs',
    work: async (f, onP) => {
      if (!f.encrypted) throw new UserError('Not password protected, nothing to unlock.');
      let doc;
      try { doc = await PDFLib.PDFDocument.load(f.bytes, { password: pw }); }
      catch (e) {
        const m = (e && e.message) || '';
        if (/password|decrypt|encrypt/i.test(m)) throw new UserError(pw ? 'That password is not right for this file.' : 'This file needs a password. Type it above and try again.');
        throw e;
      }
      onP(50, 'Saving');
      const bytes = await doc.save();
      /* Verify the copy really opens without a password before offering it. */
      const check = await openPdfjs(bytes);
      check.destroy();
      return { bytes, note: `The password has been removed from this copy. It opens without asking, ${plural(doc.getPageCount(), 'page', 'pages')}, ${fmtSize(bytes.length)}.`, short: 'unlocked' };
    },
  });
}


/* =====================================================================
   Page viewer shared by Sign and Redact. Pages render lazily as they scroll
   into view; each has an overlay that holds placements or boxes, positioned
   in fractions of the page so they survive any display size.
   ===================================================================== */
const dv = { uid: null, pdf: null, pages: [], io: null, token: 0, mode: null };

function closeDocView() {
  dv.token++;
  if (dv.io) dv.io.disconnect();
  if (dv.pdf) { try { dv.pdf.destroy(); } catch (e) {} }
  dv.io = null; dv.pdf = null; dv.uid = null; dv.pages = []; dv.mode = null;
}

async function openDocView(mode, entry) {
  const host = $('docView'); if (!host) return false;
  if (dv.pdf && dv.uid === entry.uid && dv.mode === mode && host.querySelector('#docPages')) return true;
  closeDocView();
  const token = dv.token;
  dv.mode = mode; dv.uid = entry.uid;
  host.innerHTML = '<p class="muted small"><span class="spinner" aria-hidden="true"></span> Loading pages</p>';
  let pdf;
  try { pdf = await openPdfjs(entry.bytes); }
  catch (e) { if (token === dv.token) host.innerHTML = `<div class="error-msg" role="alert"><i class="ph ph-warning-circle" aria-hidden="true"></i> <span>${escapeHTML(friendlyError(e))}</span></div>`; return false; }
  if (token !== dv.token) { pdf.destroy(); return false; }
  dv.pdf = pdf;
  onTeardown(closeDocView);
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const vp = (await pdf.getPage(i)).getViewport({ scale: 1 });
    if (token !== dv.token) return false;
    pages.push({ W: vp.width, H: vp.height });
  }
  dv.pages = pages;
  host.innerHTML = `<div class="doc-view ${mode}${mode === 'redact' && redState.drawing ? ' drawing' : ''}" id="docPages">` + pages.map((p, i) =>
    `<div class="doc-page" data-page="${i}" style="aspect-ratio:${p.W} / ${p.H}"><div class="doc-canvas"><span class="spinner" aria-hidden="true"></span></div><div class="doc-overlay" data-page="${i}"></div></div><div class="doc-page-label">Page ${i + 1} of ${pages.length}</div>`).join('') + '</div>';
  dv.io = new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting) renderDocPage(+en.target.dataset.page, token); }), { rootMargin: '600px 0px' });
  host.querySelectorAll('.doc-page').forEach(el => dv.io.observe(el));
  return true;
}

async function renderDocPage(i, token) {
  const el = document.querySelector(`#docPages .doc-page[data-page="${i}"]`);
  if (!el || el.dataset.rendered || !dv.pdf) return;
  el.dataset.rendered = '1';
  try {
    const page = await dv.pdf.getPage(i + 1);
    const cssW = el.clientWidth || 600;
    const scale = Math.min(3, (cssW / dv.pages[i].W) * Math.min(2, window.devicePixelRatio || 1));
    const canvas = await renderPageToCanvas(page, scale);
    if (token !== dv.token) return;
    el.querySelector('.doc-canvas').replaceChildren(canvas);
  } catch (e) { if (token === dv.token) el.dataset.rendered = ''; }
}

    <div class="form-row" style="margin-top:12px">
      ${radioGroup('Ink', 'sigInk', [['black', 'Black'], ['blue', 'Blue']], 'black')}
      <div class="form-group"><label for="sigInitials">Initials</label><input type="text" id="sigInitials" placeholder="From your name" maxlength="6" data-no-remember autocomplete="off"></div>
    </div>
  </div>`;
}

function inkColor() { return INK[radioValue('sigInk') || 'black'] || INK.black; }
function activeSigTab() { const t = document.querySelector('#sigMaker [role="tab"][aria-selected="true"]'); return t ? t.dataset.tab : 'draw'; }

function setupSignControls() {
  const tabs = [...document.querySelectorAll('#sigMaker [role="tab"]')];
  const select = tab => {
    tabs.forEach(t => {
      const on = t === tab;
      t.classList.toggle('active', on); t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1;
      $(t.getAttribute('aria-controls')).hidden = !on;
    });
    if (tab.dataset.tab === 'draw') sizePad();
    if (tab.dataset.tab === 'type') renderTypedPreview();
  };
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => select(t));
    t.addEventListener('keydown', e => {
      let j = null;
      if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
      if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
      if (e.key === 'Home') j = 0;
      if (e.key === 'End') j = tabs.length - 1;
      if (j !== null) { e.preventDefault(); select(tabs[j]); tabs[j].focus(); }
    });
  });
  initSigPad();
  $('sigName').addEventListener('input', () => { renderTypedPreview(); $('sigInitials').placeholder = initialsFrom($('sigName').value) || 'From your name'; });
  $('sigFont').addEventListener('change', renderTypedPreview);
  document.querySelectorAll('input[name="sigInk"]').forEach(r => r.addEventListener('change', () => { redrawPad(); renderTypedPreview(); }));
  $('sigFile').addEventListener('change', () => loadSigUpload($('sigFile').files[0]));
  $('sigWhite').addEventListener('change', () => { if (signState.upload && signState.upload.file) loadSigUpload(signState.upload.file); });
  $('sigRemember').addEventListener('change', rememberSignature);
  document.querySelectorAll('input[name="signStamp"]').forEach(r => r.addEventListener('change', updateSignHint));
  const d = $('signDate'); if (d && !d.value) d.value = new Date().toISOString().slice(0, 10);
  if (signState.upload) showUploadPreview();
}

function updateSignHint() {
  const what = { signature: 'your signature', initials: 'your initials', date: 'the date' }[radioValue('signStamp') || 'signature'];
  const h = $('signHint'); if (h) h.textContent = `Click a page to place ${what}. Drag it to move, pull the corner to resize, or press Delete to remove it.`;
}

/* ---------- Drawing pad: pointer events, smoothed with quadratic curves ---------- */
function initSigPad() {
  const c = $('sigCanvas'); if (!c) return;
  if (pad.ro) pad.ro.disconnect();
  pad.cur = null;
  const pt = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pressure || 0.5 }; };
  c.addEventListener('pointerdown', e => {
    if (e.button && e.button !== 0) return;
    e.preventDefault();
    try { c.setPointerCapture(e.pointerId); } catch (x) {}
    pad.cur = { color: inkColor(), w: e.pointerType === 'pen' ? 1.6 + (e.pressure || 0.5) * 2 : 2.6, pts: [pt(e)] };
    pad.strokes.push(pad.cur);
    redrawPad();
  });
  c.addEventListener('pointermove', e => {
    if (!pad.cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    (evs.length ? evs : [e]).forEach(ev => pad.cur.pts.push(pt(ev)));
    redrawPad();
  });
  const end = () => { if (!pad.cur) return; pad.cur = null; onPadChanged(); };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  $('sigClear').addEventListener('click', () => { pad.strokes = []; pad.bg = null; redrawPad(); try { if ($('sigRemember').checked) localStorage.removeItem(SIG_KEY); } catch (e) {} });
  $('sigUndo').addEventListener('click', () => { if (pad.strokes.length) pad.strokes.pop(); else pad.bg = null; redrawPad(); onPadChanged(); });
  pad.ro = new ResizeObserver(() => sizePad());
  pad.ro.observe(c);
  onTeardown(() => { if (pad.ro) pad.ro.disconnect(); pad.ro = null; });
  /* A signature remembered earlier comes back only if it was saved on purpose. */
  let stored = null;
  try { stored = localStorage.getItem(SIG_KEY); } catch (e) {}
  if (stored && !pad.strokes.length && !pad.bg) {
    const img = new Image();
    img.onload = () => { pad.bg = img; redrawPad(); };
    img.src = stored;
  }
  if (stored) $('sigRemember').checked = true;
  sizePad();
}

function sizePad() {
  const c = $('sigCanvas'); if (!c) return;
  const r = c.getBoundingClientRect();
  if (!r.width) return;
  pad.dpr = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.round(r.width * pad.dpr), h = Math.round(r.height * pad.dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  redrawPad();
}

function drawStroke(g, s) {
  const p = s.pts;
  g.strokeStyle = s.color; g.fillStyle = s.color; g.lineWidth = s.w; g.lineCap = 'round'; g.lineJoin = 'round';
  if (p.length === 1) { g.beginPath(); g.arc(p[0].x, p[0].y, s.w / 2, 0, Math.PI * 2); g.fill(); return; }
  g.beginPath(); g.moveTo(p[0].x, p[0].y);
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (p[i].x + p[i + 1].x) / 2, my = (p[i].y + p[i + 1].y) / 2;
    g.quadraticCurveTo(p[i].x, p[i].y, mx, my);
  }
  g.lineTo(p[p.length - 1].x, p[p.length - 1].y);
  g.stroke();
}

function paintPad(g, cssW, cssH) {
  if (pad.bg) {
    const s = Math.min(cssW / pad.bg.width, cssH / pad.bg.height, 1);
    const w = pad.bg.width * s, h = pad.bg.height * s;
    g.drawImage(pad.bg, (cssW - w) / 2, (cssH - h) / 2, w, h);
  }
  pad.strokes.forEach(s => drawStroke(g, s));
}

function redrawPad() {
  const c = $('sigCanvas'); if (!c || !c.width) return;
  const g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
  g.setTransform(pad.dpr, 0, 0, pad.dpr, 0, 0);
  paintPad(g, c.width / pad.dpr, c.height / pad.dpr);
  const empty = $('sigEmpty'); if (empty) empty.classList.toggle('hidden', !!(pad.strokes.length || pad.bg));
}

/* Crops a canvas to its visible ink and returns a PNG. */
function cropToInk(canvas, padPx) {
  const g = canvas.getContext('2d');
  const { width: w, height: h } = canvas;
  if (!w || !h) return null;
  const d = g.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[(y * w + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  const p = padPx || 6;
  x0 = Math.max(0, x0 - p); y0 = Math.max(0, y0 - p); x1 = Math.min(w - 1, x1 + p); y1 = Math.min(h - 1, y1 + p);
  const out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext('2d').drawImage(canvas, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return { src: out.toDataURL('image/png'), w: out.width, h: out.height };
}

function exportPad() {
  const c = $('sigCanvas');
  if (!c || !(pad.strokes.length || pad.bg)) return null;
  const cssW = c.width / pad.dpr, cssH = c.height / pad.dpr, k = 3;
  const off = document.createElement('canvas'); off.width = Math.round(cssW * k); off.height = Math.round(cssH * k);
  const g = off.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0);
  paintPad(g, cssW, cssH);
  return cropToInk(off, 10);
}

function onPadChanged() {
  clearResult('sign');
  rememberSignature();
}
function rememberSignature() {
  const box = $('sigRemember'); if (!box) return;
  try {
    if (!box.checked) { localStorage.removeItem(SIG_KEY); return; }
    const sig = exportPad();
    if (sig) localStorage.setItem(SIG_KEY, sig.src);
  } catch (e) { /* storage may be full or blocked; the signature still works for this visit */ }
}

/* ---------- Typed signature ---------- */
let scriptFontP = null;
function ensureScriptFont() {
  if (!scriptFontP) scriptFontP = (async () => {
    try { const ff = new FontFace('TFE Script', `url(${LIB.scriptFont}) format("woff2")`); await ff.load(); document.fonts.add(ff); return true; }
    catch (e) { return false; }
  })();
  return scriptFontP;
}
function initialsFrom(name) { return String(name || '').trim().split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 4).toUpperCase(); }

async function textStamp(text, font, px, color) {
  const c = document.createElement('canvas'); const g = c.getContext('2d');
  g.font = `${px}px ${font}`;
  const m = g.measureText(text);
  c.width = Math.ceil(m.width + px * 1.2); c.height = Math.ceil(px * 1.8);
  g.font = `${px}px ${font}`; g.fillStyle = color; g.textBaseline = 'alphabetic';
  g.fillText(text, px * 0.6, px * 1.25);
  return cropToInk(c, Math.round(px * 0.08));
}

async function typedSignature() {
  const name = ($('sigName') && $('sigName').value || '').trim();
  if (!name) return null;
  const script = $('sigFont').value === 'script';
  if (script) await ensureScriptFont();
  return textStamp(name, script ? SCRIPT_FONT : SYSTEM_SCRIPT, 110, inkColor());
}
let typedTimer = null;
function renderTypedPreview() {
  clearTimeout(typedTimer);
  typedTimer = setTimeout(async () => {
    const host = $('sigTypePreview'); if (!host) return;
    const sig = await typedSignature();
    host.innerHTML = sig ? `<img src="${sig.src}" alt="Typed signature preview">` : '<span class="muted small">Your typed signature appears here.</span>';
  }, 120);
}

/* ---------- Uploaded signature ---------- */
async function loadSigUpload(file) {
  if (!file) return;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    const g = c.getContext('2d'); g.drawImage(bmp, 0, 0, c.width, c.height);
    if ($('sigWhite').checked) {
      const id = g.getImageData(0, 0, c.width, c.height), d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const light = Math.min(d[i], d[i + 1], d[i + 2]);
        if (light > 235) d[i + 3] = 0;
        else if (light > 190) d[i + 3] = Math.round(d[i + 3] * (235 - light) / 45);
      }
      g.putImageData(id, 0, 0);
    }
    const sig = cropToInk(c, 4);
    if (!sig) throw new Error('empty');
    signState.upload = { ...sig, file };
  } catch (e) { signState.upload = null; toast('That picture could not be read. Choose a PNG or JPG.', 'error'); }
  showUploadPreview();
}
function showUploadPreview() {
  const host = $('sigUploadPreview'); if (!host) return;
  host.innerHTML = signState.upload ? `<img src="${signState.upload.src}" alt="Uploaded signature preview">` : '<span class="muted small">No picture chosen yet.</span>';
}

async function currentSignature() {
  const tab = activeSigTab();
  if (tab === 'type') return typedSignature();
  if (tab === 'upload') return signState.upload;
  return exportPad();
}

async function stampFor(kind) {
  if (kind === 'signature') {
    const s = await currentSignature();
    if (!s) throw new UserError(activeSigTab() === 'type' ? 'Type your name first.' : activeSigTab() === 'upload' ? 'Choose a picture of your signature first.' : 'Draw your signature first.');
    return s;
  }
  if (kind === 'initials') {
    const t = ($('sigInitials').value || '').trim() || initialsFrom($('sigName').value);
    if (!t) throw new UserError('Type your initials first, next to Ink.');
    await ensureScriptFont();
    return textStamp(t, SCRIPT_FONT, 110, inkColor());
  }
  const v = $('signDate').value;
  const d = v ? new Date(v + 'T12:00:00') : new Date();
  const text = d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  return textStamp(text, '500 ' + 'system-ui, "Segoe UI", Roboto, Arial, sans-serif', 64, inkColor());
}

/* ---------- Placing, moving and resizing ---------- */
async function loadSignView() {
  const f = readyFiles('sign')[0];
  if (!f) return;
  updateActionBar('sign');
  if (f.encrypted) { const h = $('docView'); if (h) h.innerHTML = ''; return; }
  if (signState.uid !== f.uid) { signState.uid = f.uid; signState.placements = []; }
  const ok = await openDocView('sign', f);
  if (!ok) return;
  bindSignEvents($('docView'));
  renderPlacements();
  updateSignHint();
}

function bindSignEvents(host) {
  if (!host || host.dataset.bound === 'sign') return;
  host.dataset.bound = 'sign';
  host.addEventListener('click', async e => {
    const del = e.target.closest('.pl-del');
    if (del) { removePlacement(+del.closest('.placement').dataset.id); return; }
    const ov = e.target.closest('.doc-overlay');
    if (!ov || e.target !== ov) return;
    const r = ov.getBoundingClientRect();
    await placeStamp(+ov.dataset.page, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, ov);
  });
  host.addEventListener('pointerdown', onPlacementPointerDown);
  host.addEventListener('keydown', onPlacementKey);
}

async function placeStamp(pageIdx, cx, cy, anchorEl) {
  const kind = radioValue('signStamp') || 'signature';
  let st;
  try { st = await stampFor(kind); }
  catch (e) { toast(friendlyError(e), 'error'); const m = $('sigMaker'); if (m) m.scrollIntoView({ block: 'nearest' }); return; }
  const P = dv.pages[pageIdx]; if (!P) return;
  const aspect = st.w / st.h;
  let wPt, hPt;
  if (kind === 'signature') { wPt = Math.min(170, P.W * 0.32); hPt = wPt / aspect; if (hPt > 70) { hPt = 70; wPt = hPt * aspect; } }
  else if (kind === 'initials') { hPt = 28; wPt = Math.min(hPt * aspect, P.W * 0.2); hPt = wPt / aspect; }
  else { hPt = 13; wPt = Math.min(hPt * aspect, P.W * 0.6); hPt = wPt / aspect; }
  const fw = wPt / P.W, fh = hPt / P.H;
  const item = { id: signState.nextId++, page: pageIdx, kind, src: st.src, aspect, fw, fh, fx: clamp(cx - fw / 2, 0, 1 - fw), fy: clamp(cy - fh / 2, 0, 1 - fh) };
  signState.placements.push(item);
  clearResult('sign');
  renderPlacements();
  const el = document.querySelector(`.placement[data-id="${item.id}"]`); if (el) el.focus({ preventScroll: true });
  announce(`${kindLabel(kind)} placed on page ${pageIdx + 1}.`);
}
function kindLabel(k) { return { signature: 'Signature', initials: 'Initials', date: 'Date' }[k] || 'Item'; }

function positionPlacement(el, p) {
  el.style.left = (p.fx * 100) + '%'; el.style.top = (p.fy * 100) + '%';
  el.style.width = (p.fw * 100) + '%'; el.style.height = (p.fh * 100) + '%';
}

function renderPlacements() {
  document.querySelectorAll('#docPages .doc-overlay').forEach(ov => {
    const i = +ov.dataset.page;
    ov.replaceChildren(...signState.placements.filter(p => p.page === i).map(p => {
      const el = document.createElement('div');
      el.className = 'placement'; el.dataset.id = p.id; el.tabIndex = 0;
      el.setAttribute('role', 'group');
      el.setAttribute('aria-label', `${kindLabel(p.kind)} on page ${i + 1}. Arrow keys move it, plus and minus resize, Delete removes it.`);
      el.innerHTML = `<img src="${p.src}" alt=""><button class="pl-del" type="button" aria-label="Remove this ${kindLabel(p.kind).toLowerCase()}"><i class="ph ph-x" aria-hidden="true"></i></button><span class="pl-resize" aria-hidden="true"></span>`;
      positionPlacement(el, p);
      return el;
    }));
  });
  const n = signState.placements.length;
  const btn = $('go-sign');
  if (btn && btn.getAttribute('aria-busy') !== 'true') { const l = btn.querySelector('.go-label'); if (l) l.textContent = n ? `Save signed PDF (${plural(n, 'item', 'items')})` : 'Save signed PDF'; }
}

function removePlacement(id) {
  signState.placements = signState.placements.filter(p => p.id !== id);
  clearResult('sign'); renderPlacements();
  announce('Removed.');
}

function onPlacementPointerDown(e) {
  if (dv.mode !== 'sign') return;
  const el = e.target.closest('.placement');
  if (!el || e.target.closest('.pl-del')) return;
  const item = signState.placements.find(p => p.id === +el.dataset.id); if (!item) return;
  e.preventDefault();
  const r = el.parentElement.getBoundingClientRect();
  const resize = !!e.target.closest('.pl-resize');
  const start = { x: e.clientX, y: e.clientY, fx: item.fx, fy: item.fy, fw: item.fw };
  try { el.setPointerCapture(e.pointerId); } catch (x) {}
  el.focus({ preventScroll: true });
  el.classList.add('active');
  const move = ev => {
    const dx = (ev.clientX - start.x) / r.width, dy = (ev.clientY - start.y) / r.height;
    if (resize) {
      let fw = clamp(start.fw + dx, 0.02, 1 - item.fx);
      let fh = fw * r.width / item.aspect / r.height;
      if (item.fy + fh > 1) { fh = 1 - item.fy; fw = fh * r.height * item.aspect / r.width; }
      item.fw = fw; item.fh = fh;
    } else {
      item.fx = clamp(start.fx + dx, 0, 1 - item.fw);
      item.fy = clamp(start.fy + dy, 0, 1 - item.fh);
    }
    positionPlacement(el, item);
  };
  const up = () => {
    el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
    el.classList.remove('active'); clearResult('sign');
  };
  el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}

function onPlacementKey(e) {
  if (dv.mode !== 'sign') return;
  const el = e.target.closest('.placement'); if (!el || e.target !== el) return;
  const item = signState.placements.find(p => p.id === +el.dataset.id); if (!item) return;
  const step = e.shiftKey ? 0.05 : 0.01;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removePlacement(item.id); return; }
  if (e.key === 'ArrowLeft') item.fx -= step; else if (e.key === 'ArrowRight') item.fx += step;
  else if (e.key === 'ArrowUp') item.fy -= step; else if (e.key === 'ArrowDown') item.fy += step;
  else if (e.key === '+' || e.key === '=' || e.key === '-') {
    const k = e.key === '-' ? 0.9 : 1.1;
    const P = dv.pages[item.page];
    item.fw = clamp(item.fw * k, 0.02, 1); item.fh = item.fw * P.W / item.aspect / P.H;
  } else return;
  e.preventDefault();
  item.fw = Math.min(item.fw, 1); item.fh = Math.min(item.fh, 1);
  item.fx = clamp(item.fx, 0, 1 - item.fw); item.fy = clamp(item.fy, 0, 1 - item.fh);
  positionPlacement(el, item);
  clearResult('sign');
}

async function doSign(btn) {
  const files = requireFile('sign', btn); if (!files) return;
  const f = files[0];
  if (f.encrypted) { showInlineError(btn, 'This PDF is password protected. Unlock it first, then come back.'); return; }
  if (!signState.placements.length) { showInlineError(btn, 'Place your signature on a page first. Click the spot where it should go.'); return; }
  setBusy(btn, true, 'Saving...');
  clearResult('sign');
  const done = startJob('Signing a PDF');
  try {
    const doc = await loadForEdit(f);
    const cache = new Map();
    const list = signState.placements;
    for (let k = 0; k < list.length; k++) {
      const p = list[k];
      progress('sign', (k / list.length) * 90, `Placing ${kindLabel(p.kind).toLowerCase()} on page ${p.page + 1}`);
      let img = cache.get(p.src);
      if (!img) { img = await doc.embedPng(dataUrlToBytes(p.src)); cache.set(p.src, img); }
      const page = doc.getPage(p.page); const g = pageGeom(page);
      const w = p.fw * g.W, h = p.fh * g.H;
      const u = g.toUser(p.fx * g.W, g.H - p.fy * g.H - h);
      page.drawImage(img, { x: u.x, y: u.y, width: w, height: h, rotate: PDFLib.degrees(g.R) });
    }
    progress('sign', 95, 'Saving');
    const bytes = await doc.save();
    const name = outputName(f.name, 'signed');
    const key = keepOutput('sign', new Blob([bytes], { type: 'application/pdf' }));
    const pagesUsed = new Set(list.map(p => p.page)).size;
    showResult('sign', resultPanel('Signed PDF', downloadBtn(key, name, 'Download signed PDF') + startOverBtn('sign'),
      `<p class="muted small">${plural(list.length, 'item', 'items')} placed on ${plural(pagesUsed, 'page', 'pages')}, ${fmtSize(bytes.length)}. This is a visible signature, not a certificate-based digital signature.</p>`),
      { file: pdfFile(bytes, name) });
  } catch (e) { showError('sign', friendlyError(e)); }
  finally { setBusy(btn, false); progressDone('sign'); renderPlacements(); done(); }
}

/* =====================================================================
   Redact
   ===================================================================== */
const redState = { uid: null, boxes: [], nextId: 1, drawing: true };

function setupRedactControls() {
  $('redFindBtn').addEventListener('click', markMatches);
  $('redFind').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); markMatches(); } });
  const draw = $('redDrawBtn');
  const paint = () => {
    draw.setAttribute('aria-pressed', redState.drawing ? 'true' : 'false');
    draw.innerHTML = `<i class="ph ${redState.drawing ? 'ph-selection' : 'ph-hand-grabbing'}" aria-hidden="true"></i> ${redState.drawing ? 'Drawing boxes' : 'Scrolling'}`;
    const v = $('docPages'); if (v) v.classList.toggle('drawing', redState.drawing);
  };
  draw.addEventListener('click', () => { redState.drawing = !redState.drawing; paint(); });
  paint();
  $('redClearBtn').addEventListener('click', () => { redState.boxes = []; clearResult('redact'); renderBoxes(); });
}

async function loadRedactView() {
  const f = readyFiles('redact')[0];
  if (!f) return;
  updateActionBar('redact');
  if (f.encrypted) { const h = $('docView'); if (h) h.innerHTML = ''; return; }
  if (redState.uid !== f.uid) { redState.uid = f.uid; redState.boxes = []; }
  const ok = await openDocView('redact', f);
  if (!ok) return;
  bindRedactEvents($('docView'));
  renderBoxes();
}

function bindRedactEvents(host) {
  if (!host || host.dataset.bound === 'redact') return;
  host.dataset.bound = 'redact';
  host.addEventListener('click', e => {
    const del = e.target.closest('.rb-del');
    if (del) { const id = +del.closest('.rbox').dataset.id; redState.boxes = redState.boxes.filter(b => b.id !== id); clearResult('redact'); renderBoxes(); }
  });
  host.addEventListener('pointerdown', e => {
    if (dv.mode !== 'redact' || !redState.drawing) return;
    const ov = e.target.closest('.doc-overlay');
    if (!ov || e.target !== ov || (e.button && e.button !== 0)) return;
    e.preventDefault();
    const r = ov.getBoundingClientRect();
    const sx = (e.clientX - r.left) / r.width, sy = (e.clientY - r.top) / r.height;
    const box = document.createElement('div'); box.className = 'rbox pending'; ov.appendChild(box);
    let cur = { fx: sx, fy: sy, fw: 0, fh: 0 };
    try { ov.setPointerCapture(e.pointerId); } catch (x) {}
    const move = ev => {
      const x = clamp((ev.clientX - r.left) / r.width, 0, 1), y = clamp((ev.clientY - r.top) / r.height, 0, 1);
      cur = { fx: Math.min(sx, x), fy: Math.min(sy, y), fw: Math.abs(x - sx), fh: Math.abs(y - sy) };
      positionPlacement(box, cur);
    };
    const up = () => {
      ov.removeEventListener('pointermove', move); ov.removeEventListener('pointerup', up); ov.removeEventListener('pointercancel', up);
      box.remove();
      if (cur.fw > 0.004 && cur.fh > 0.004) { redState.boxes.push({ id: redState.nextId++, page: +ov.dataset.page, ...cur }); clearResult('redact'); }
      renderBoxes();
    };
    ov.addEventListener('pointermove', move); ov.addEventListener('pointerup', up); ov.addEventListener('pointercancel', up);
  });
}

function renderBoxes() {
  document.querySelectorAll('#docPages .doc-overlay').forEach(ov => {
    const i = +ov.dataset.page;
    ov.replaceChildren(...redState.boxes.filter(b => b.page === i).map(b => {
      const el = document.createElement('div');
      el.className = 'rbox'; el.dataset.id = b.id;
      el.innerHTML = `<button class="rb-del" type="button" aria-label="Remove this box on page ${i + 1}"><i class="ph ph-x" aria-hidden="true"></i></button>`;
      positionPlacement(el, b);
      return el;
    }));
  });
  const n = redState.boxes.length, pages = new Set(redState.boxes.map(b => b.page)).size;
  const s = $('redSummary');
  if (s) s.textContent = n ? `${plural(n, 'box', 'boxes')} on ${plural(pages, 'page', 'pages')}. Those pages become images when you save.` : 'Drag on a page to draw a box.';
  const btn = $('go-redact');
  if (btn && btn.getAttribute('aria-busy') !== 'true') { const l = btn.querySelector('.go-label'); if (l) l.textContent = n ? `Redact ${plural(pages, 'page', 'pages')} and save` : 'Redact and save'; }
}

/* Box around characters start..start+len of a pdf.js text item, as page fractions. */
function textItemBox(item, vp, start, len) {
  const total = item.str.length || 1;
  const tx = pdfjsLib.Util.transform(vp.transform, item.transform);
  const ul = Math.hypot(tx[0], tx[1]) || 1, fh = Math.hypot(tx[2], tx[3]) || 1;
  const dir = [tx[0] / ul, tx[1] / ul], up = [tx[2] / fh, tx[3] / fh];
  const width = (item.width || 0) * vp.scale;
  if (!width) return null;
  const a = width * start / total - fh * 0.08, b = width * (start + len) / total + fh * 0.08;
  const asc = fh * 0.95, desc = fh * 0.3;
  const xs = [], ys = [];
  for (const t of [a, b]) for (const h of [asc, -desc]) { xs.push(tx[4] + dir[0] * t + up[0] * h); ys.push(tx[5] + dir[1] * t + up[1] * h); }
  const x0 = Math.max(0, Math.min(...xs)), x1 = Math.min(vp.width, Math.max(...xs));
  const y0 = Math.max(0, Math.min(...ys)), y1 = Math.min(vp.height, Math.max(...ys));
  if (x1 <= x0 || y1 <= y0) return null;
  return { fx: x0 / vp.width, fy: y0 / vp.height, fw: (x1 - x0) / vp.width, fh: (y1 - y0) / vp.height };
}

async function markMatches() {
  const btn = $('redFindBtn');
  const q = ($('redFind').value || '').trim();
  if (!q) { showInlineError(btn, 'Type the text to look for.'); return; }
  if (!dv.pdf || dv.mode !== 'redact') return;
  clearInlineErrors();
  setBusy(btn, true, 'Searching...');
  const ql = q.toLocaleLowerCase();
  let count = 0; const hit = new Set();
  try {
    for (let i = 0; i < dv.pdf.numPages; i++) {
      const page = await dv.pdf.getPage(i + 1);
      const vp = page.getViewport({ scale: 1 });
      const tc = await page.getTextContent();
      for (const it of tc.items) {
        if (!it.str) continue;
        const sl = it.str.toLocaleLowerCase();
        for (let idx = sl.indexOf(ql); idx !== -1; idx = sl.indexOf(ql, idx + ql.length)) {
          const b = textItemBox(it, vp, idx, ql.length);
          if (!b) continue;
          const dup = redState.boxes.some(o => o.page === i && Math.abs(o.fx - b.fx) < 0.002 && Math.abs(o.fy - b.fy) < 0.002);
          if (!dup) redState.boxes.push({ id: redState.nextId++, page: i, auto: true, ...b });
          count++; hit.add(i);
        }
      }
    }
  } catch (e) { toast(friendlyError(e), 'error'); }
  finally { setBusy(btn, false); }
  clearResult('redact');
  renderBoxes();
  const msg = count
    ? `Boxed ${plural(count, 'match', 'matches')} for "${q}" on ${plural(hit.size, 'page', 'pages')}. Check them, then save.`
    : `No matches for "${q}". Scanned pages have no text to search, so draw boxes over them by hand.`;
  toast(msg, count ? 'success' : 'info', { duration: 6000 });
  const s = $('redSummary'); if (s && !count) s.textContent = msg;
  if (count) { const first = document.querySelector(`#docPages .doc-page[data-page="${[...hit][0]}"]`); if (first) first.scrollIntoView({ block: 'nearest' }); }
}

async function doRedact(btn) {
  const files = requireFile('redact', btn); if (!files) return;
  const f = files[0];
  if (f.encrypted) { showInlineError(btn, 'This PDF is password protected. Unlock it first, then come back.'); return; }
  if (!redState.boxes.length) { showInlineError(btn, 'Draw at least one box, or use Box every match.'); return; }
  setBusy(btn, true, 'Redacting...');
  clearResult('redact');
  const done = startJob('Redacting a PDF');
  let pdf = null;
  try {
    const src = await loadForEdit(f);
    pdf = await openPdfjs(f.bytes);
    const byPage = new Map();
    redState.boxes.forEach(b => { if (!byPage.has(b.page)) byPage.set(b.page, []); byPage.get(b.page).push(b); });
    const total = src.getPageCount();
    /* A fresh document: untouched pages are copied, redacted pages are rebuilt
       from a picture. Nothing from a redacted page's content stream is carried
       over, not even as an unused object in the file. */
    const out = await PDFLib.PDFDocument.create();
    try { out.setTitle(src.getTitle() || ''); out.setAuthor(src.getAuthor() || ''); out.setSubject(src.getSubject() || ''); } catch (e) {}
    let done2 = 0;
    for (let i = 0; i < total; i++) {
      if (!byPage.has(i)) { const [p] = await out.copyPages(src, [i]); out.addPage(p); continue; }
      progress('redact', (done2 / byPage.size) * 90, `Flattening page ${i + 1}`);
      const page = await pdf.getPage(i + 1);
      const vp1 = page.getViewport({ scale: 1 });
      const scale = Math.min(200 / 72, 4200 / Math.max(vp1.width, vp1.height));
      const canvas = await renderPageToCanvas(page, scale);
      const g = canvas.getContext('2d');
      g.fillStyle = '#000';
      for (const b of byPage.get(i)) {
        const x = Math.floor(b.fx * canvas.width) - 1, y = Math.floor(b.fy * canvas.height) - 1;
        g.fillRect(x, y, Math.ceil(b.fw * canvas.width) + 3, Math.ceil(b.fh * canvas.height) + 3);
      }
      const img = await out.embedJpg(await canvasToBytes(canvas, 'image/jpeg', 0.9));
      canvas.width = canvas.height = 0;
      const geo = pageGeom(src.getPage(i));
      const np = out.addPage([geo.W, geo.H]);
      np.drawImage(img, { x: 0, y: 0, width: geo.W, height: geo.H });
      done2++;
      await nextFrame();
    }
    progress('redact', 95, 'Saving and checking');
    const bytes = await out.save({ useObjectStreams: true });
    /* Prove it: redacted pages must have no text left at all. */
    const check = await openPdfjs(bytes);
    let leftover = 0;
    try {
      for (const i of byPage.keys()) {
        const tc = await (await check.getPage(i + 1)).getTextContent();
        leftover += tc.items.filter(it => it.str && it.str.trim()).length;
      }
    } finally { check.destroy(); }
    if (leftover) throw new UserError('Some text survived on a redacted page, so the file was not saved.');
    const name = outputName(f.name, 'redacted');
    const key = keepOutput('redact', new Blob([bytes], { type: 'application/pdf' }));
    showResult('redact', resultPanel('Redacted PDF', downloadBtn(key, name, 'Download redacted PDF') + startOverBtn('redact'),
      `<p class="muted small">${plural(redState.boxes.length, 'box', 'boxes')} blacked out on ${plural(byPage.size, 'page', 'pages')}. Checked: those pages hold no selectable text any more, only the picture of the page. Other pages are unchanged. ${fmtSize(bytes.length)}.</p>`),
      { file: pdfFile(bytes, name) });
  } catch (e) { showError('redact', friendlyError(e)); }
  finally { if (pdf) pdf.destroy(); setBusy(btn, false); progressDone('redact'); renderBoxes(); done(); }
}

/* =====================================================================
   OCR
   ===================================================================== */
const OCR_LATIN = ['eng', 'deu', 'fra', 'spa'];
const OCR_NAMES = { eng: 'English', deu: 'German', fra: 'French', spa: 'Spanish', ara: 'Arabic', urd: 'Urdu', hin: 'Hindi', chi_sim: 'Chinese' };
let lastOcrText = '';

/* A font for the invisible text layer. Latin languages use the built-in
   Helvetica. Other scripts get no layer: embedding their fonts through fontkit
   failed in testing (broken subsets, garbled extraction), so those languages
   return the recognised text instead of a PDF that searches wrongly. */
async function ocrFont(doc, lang) {
  if (OCR_LATIN.includes(lang)) {
    const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    const ok = new Map();
    return { font, filter: t => { let out = ''; for (const ch of t) { let v = ok.get(ch); if (v === undefined) { try { font.encodeText(ch); v = true; } catch (e) { v = false; } ok.set(ch, v); } if (v) out += ch; } return out; } };
  }
  return null;
}

function ocrWords(data) {
  if (Array.isArray(data.words) && data.words.length) return data.words;
  const out = [];
  (data.blocks || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => (l.words || []).forEach(w => out.push(w)))));
  return out;
}

/* Writes each recognised word as invisible text (rendering mode 3) exactly over
   the word on the page, stretched to the word's width. */
function addTextLayer(page, data, scale, fi) {
  const L = PDFLib;
  const g = pageGeom(page);
  const key = page.node.newFontDictionary(fi.font.name, fi.font.ref);
  const r = g.R * Math.PI / 180, cos = Math.cos(r), sin = Math.sin(r);
  const ops = [L.pushGraphicsState(), L.beginText(), L.setTextRenderingMode(L.TextRenderingMode.Invisible)];
  let n = 0;
  for (const w of ocrWords(data)) {
    if (w.confidence !== undefined && w.confidence < 10) continue;
    const text = fi.filter(String(w.text || '').trim());
    if (!text || !w.bbox) continue;
    const x0 = w.bbox.x0 / scale, x1 = w.bbox.x1 / scale, y0 = w.bbox.y0 / scale, y1 = w.bbox.y1 / scale;
    const size = Math.max(1, y1 - y0);
    let tw;
    try { tw = fi.font.widthOfTextAtSize(text, size); } catch (e) { continue; }
    if (!(tw > 0)) continue;
    const sx = (x1 - x0) / tw;
    const base = g.toUser(x0, g.H - y1 + size * 0.2);
    let encoded;
    try { encoded = fi.font.encodeText(text + ' '); } catch (e) { continue; }
    ops.push(L.setFontAndSize(key, size), L.setTextMatrix(sx * cos, sx * sin, -sin, cos, base.x, base.y), L.showText(encoded));
    n++;
  }
  ops.push(L.endText(), L.popGraphicsState());
  if (n) page.pushOperators(...ops);
  return n;
}

async function doOcr(btn) {
  const files = requireFile('ocr', btn); if (!files) return;
  const f = files[0];
  if (f.encrypted) { showInlineError(btn, 'This PDF is password protected. Unlock it first, then come back.'); return; }
  let pages;
  try { pages = pagesFromBox($('ocrPages').value, f.pages || 0); } catch (e) { showInlineError(btn, e.message); return; }
  const lang = $('ocrLang').value;
  setBusy(btn, true, 'Recognising...');
  clearResult('ocr');
  const done = startJob('Recognising text');
  let worker = null, pdf = null;
  try {
    progress('ocr', 0, 'Loading the recognition engine');
    await loadScript(LIB.tesseract);
    if (!window.Tesseract) throw new UserError('The recognition engine could not be loaded. Check your connection and try again.');
    let cur = 0;
    const logger = m => {
      const st = String(m.status || '');
      if (st === 'recognizing text') progress('ocr', ((cur + (m.progress || 0)) / pages.length) * 100, `Reading page ${pages[cur] + 1}, ${cur + 1} of ${pages.length}`);
      else if (/language/i.test(st)) progress('ocr', (m.progress || 0) * 5, `Downloading ${OCR_NAMES[lang]} language data`);
      else if (/core|initializ/i.test(st)) progress('ocr', 0, 'Loading the recognition engine');
    };
    try {
      worker = await Tesseract.createWorker(lang, 1, { workerPath: LIB.tesseractWorker, corePath: LIB.tesseractCore, langPath: LIB.tessdata(lang), logger });
    } catch (e) { throw new UserError('The recognition engine or its language data could not be downloaded. Check your connection and try again.'); }
    const doc = await loadForEdit(f);
    const fi = await ocrFont(doc, lang);
    pdf = await openPdfjs(f.bytes);
    let text = '', words = 0;
    for (cur = 0; cur < pages.length; cur++) {
      const i = pages[cur];
      progress('ocr', (cur / pages.length) * 100, `Reading page ${i + 1}, ${cur + 1} of ${pages.length}`);
      const page = await pdf.getPage(i + 1);
      const vp1 = page.getViewport({ scale: 1 });
      const scale = clamp(2600 / Math.max(vp1.width, vp1.height), 1.5, 4.2);
      const canvas = await renderPageToCanvas(page, scale);
      const { data } = await worker.recognize(canvas);
      canvas.width = canvas.height = 0;
      text += `Page ${i + 1}\n${String(data.text || '').trim()}\n\n`;
      if (fi) words += addTextLayer(doc.getPage(i), data, scale, fi);
    }
    lastOcrText = text;
    const txtKey = keepOutput('ocr-txt', new Blob([text], { type: 'text/plain' }));
    const empty = !text.replace(/Page \d+\n/g, '').trim();
    const copyBtn = `<button class="btn btn-sm" type="button" onclick="copyOcrText(this)"><i class="ph ph-copy" aria-hidden="true"></i> Copy text</button>`;
    const txtBtn = downloadBtn(txtKey, outputName(f.name, 'text', 'txt'), 'Download TXT');
    if (fi && words) {
      progress('ocr', 100, 'Saving');
      const bytes = await doc.save({ useObjectStreams: true });
      const name = outputName(f.name, 'searchable');
      const key = keepOutput('ocr', new Blob([bytes], { type: 'application/pdf' }));
      showResult('ocr', resultPanel('Searchable PDF', downloadBtn(key, name, 'Download PDF') + copyBtn + txtBtn + startOverBtn('ocr'),
        `<p class="muted small">${plural(words, 'word', 'words')} on ${plural(pages.length, 'page', 'pages')} can now be searched, selected and copied. The pages look exactly as before, ${fmtSize(bytes.length)}.</p><div class="text-output" tabindex="0">${escapeHTML(text)}</div>`),
        { file: pdfFile(bytes, name) });
    } else {
      const why = empty ? 'No text could be recognised on these pages. Check the language, or try a sharper scan.'
        : `The ${OCR_NAMES[lang]} text was recognised. A searchable layer can only be added for English, German, French and Spanish so far, so there is no new PDF. Copy the text or save it as TXT.`;
      showResult('ocr', resultPanel('Recognised text', (empty ? '' : copyBtn + txtBtn) + startOverBtn('ocr'),
        `<div class="warning-msg"><i class="ph ph-warning" aria-hidden="true"></i> <span>${why}</span></div>${empty ? '' : `<div class="text-output" tabindex="0">${escapeHTML(text)}</div>`}`));
    }
  } catch (e) { showError('ocr', friendlyError(e)); }
  finally {
    if (worker) { try { await worker.terminate(); } catch (e) {} }
    if (pdf) pdf.destroy();
    setBusy(btn, false); progressDone('ocr'); done();
  }
}

function copyOcrText(btn) {
  const t = lastOcrText;
  const ok = () => toast('Text copied.', 'success');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => toast('Copying was blocked. Use Download TXT instead.', 'error'));
  else toast('Copying is not available here. Use Download TXT instead.', 'error');
}

/* =====================================================================
   Start-up
   ===================================================================== */
initToolList();
renderTool();

document.addEventListener('DOMContentLoaded', () => {
  setSubtoolMeta(currentTool);
  bindPrefs();
  const T = tfe();
  try {
    if (T && T.subtool && T.subtool.onChange) T.subtool.onChange(id => { if (TOOL_BY_ID[id] && id !== currentTool) selectTool(id); });
    else window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TOOL_BY_ID[h] && h !== currentTool) selectTool(h); });
  } catch (e) {}
  try {
    if (T && T.handoff && T.handoff.take) {
      T.handoff.take().then(files => { if (files && files.length) addFiles(currentTool, files); }).catch(() => {});
    }
  } catch (e) {}
});
