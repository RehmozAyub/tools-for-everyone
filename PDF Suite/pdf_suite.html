let currentTool = 'merge';

function initToolList() {
  const list = document.getElementById('toolList');
  list.innerHTML = TOOLS.map(t =>
    `<button class="tool-item${t.id===currentTool?' active':''}" type="button" onclick="selectTool('${t.id}',this)"><i class="ph ph-${t.icon}" aria-hidden="true"></i> ${t.name}</button>`
  ).join('');
}

function selectTool(id, el) {
  currentTool = id;
  document.querySelectorAll('.tool-item').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  renderTool();
}

  return `<div class="drop-zone" id="dz-${id}" role="button" tabindex="0" aria-label="${label}" onclick="document.getElementById('fi-${id}').click()">
    <i class="ph ph-upload-simple" aria-hidden="true"></i>
    <p class="dz-title">Drop ${multiple ? 'files' : 'a file'} here or browse</p>
    <p class="dz-hint">${hint}</p>
    <input type="file" id="fi-${id}" ${accept?'accept="'+accept+'"':''} ${multiple?'multiple':''}>
  </div><div id="info-${id}"></div>`;
}

      <button class="btn btn-primary" type="button" onclick="doPageNumbers(this)"><i class="ph ph-hash" aria-hidden="true"></i> Add page numbers</button><div id="pnResult"></div>`; break;
    case 'metadata': c.innerHTML = `<h2>Edit metadata</h2><p class="tool-info"><i class="ph ph-info" aria-hidden="true"></i> <span>See and change the properties stored inside a PDF.</span></p>
      ${dropZoneHTML('meta','.pdf',false,'Choose a PDF to edit','PDF, one file')}<div id="metaFields"></div>
      <button class="btn btn-primary" type="button" onclick="doMetadata(this)"><i class="ph ph-tag" aria-hidden="true"></i> Save metadata</button><div id="metaResult"></div>`; break;
    case 'protect': c.innerHTML = `<h2>Protect a PDF</h2><p class="tool-info"><i class="ph ph-info" aria-hidden="true"></i> <span>Lock a PDF so it asks for a password before it opens.</span></p>
      ${dropZoneHTML('protect','.pdf',false,'Choose a PDF to protect','PDF, one file')}<div class="form-group"><label for="protectPw">Password to open the file</label>
      <input type="password" id="protectPw" placeholder="Choose a password"></div>

      <button class="btn btn-primary" type="button" onclick="doProtect(this)"><i class="ph ph-lock" aria-hidden="true"></i> Protect</button><div id="protectResult"></div>`; break;
    case 'unlock': c.innerHTML = `<h2>Unlock a PDF</h2><p class="tool-info"><i class="ph ph-info" aria-hidden="true"></i> <span>Remove the password from a PDF you already know the password for.</span></p>
      ${dropZoneHTML('unlock','.pdf',false,'Choose a protected PDF','PDF, one file')}<div class="form-group"><label for="unlockPw">Password</label>
      <input type="password" id="unlockPw" placeholder="The password the file uses now"></div>
      <button class="btn btn-primary" type="button" onclick="doUnlock(this)"><i class="ph ph-lock-open" aria-hidden="true"></i> Unlock</button><div id="unlockResult"></div>`; break;
    default: c.innerHTML = '<p>Pick a tool from the list.</p>';
  }
  setupDropZones();
}

let storedFiles = {};
function setupDropZones() {
  document.querySelectorAll('.drop-zone').forEach(dz => {
    const id = dz.id.replace('dz-','');
    const fi = document.getElementById('fi-'+id);
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); fi.files = e.dataTransfer.files; fi.dispatchEvent(new Event('change')); });
    fi.addEventListener('change', async () => {
      const files = Array.from(fi.files);
      if (!files.length) return;
      storedFiles[id] = [];
      for (const f of files) {
        const buf = await f.arrayBuffer();
        storedFiles[id].push({ name: f.name, bytes: new Uint8Array(buf), type: f.type });
      }
      let rows = '<div class="file-list">';
      for (const f of files) {
        rows += `<div class="file-row"><span class="file-name">${escapeHTML(f.name)}</span><span class="file-size">${fmtSize(f.size)}</span></div>`;
      }
      rows += '</div>';
      document.getElementById('info-'+id).innerHTML = rows;
      if (id === 'meta') loadMetadataFields();
    });
  });
  const p2iScale = document.getElementById('p2iScale');
  if (p2iScale) p2iScale.addEventListener('input', function(){ document.getElementById('p2iScaleVal').textContent = this.value+'x'; });
  const wmOp = document.getElementById('wmOpacity');
  if (wmOp) wmOp.addEventListener('input', function(){ document.getElementById('wmOpVal').textContent = this.value; });
}

function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

function showResult(elId, html) { document.getElementById(elId).innerHTML = html; }

function resultPanel(title, downloadBtn, body) {
  return `<div class="result">
    <div class="result-head"><h2>${title}</h2>${downloadBtn || ''}</div>
    ${body ? `<div class="result-body">${body}</div>` : ''}
  </div>`;
}

function downloadBtn(varName, fileName, label) {
  return `<button class="btn btn-sm btn-download" type="button" onclick="downloadBlob(window.${varName},'${fileName}')"><i class="ph ph-download-simple" aria-hidden="true"></i> ${label}</button>`;
}

function showError(elId, message) {
  showResult(elId, `<div class="error-msg"><i class="ph ph-warning-circle" aria-hidden="true"></i> <span>${escapeHTML(message)}</span></div>`);
}

// Merge
async function doMerge(btn) {
  const files = storedFiles['merge'];
  if (!files || files.length < 2) { showInlineError(btn, 'Choose at least two PDFs first.'); return; }
  setBusy(btn, true, 'Merging...');
  showResult('mergeResult', '');
  try {
    const merged = await PDFLib.PDFDocument.create();
    for (const f of files) {
      const src = await PDFLib.PDFDocument.load(f.bytes);
      const pages = await merged.copyPages(src, src.getPageIndices());
      pages.forEach(p => merged.addPage(p));
    }
    const bytes = await merged.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    window._mergedBlob = blob;
    showResult('mergeResult', resultPanel('Merged PDF', downloadBtn('_mergedBlob', 'merged.pdf', 'Download merged PDF'),
      `<p class="muted small">${files.length} files, ${fmtSize(bytes.length)} in total.</p>`));
  } catch(e) { showError('mergeResult', e.message); }
  finally { setBusy(btn, false); }
}

// Split
async function doSplit(btn) {
  const files = storedFiles['split'];
  if (!files || !files.length) { showInlineError(btn, 'Choose a PDF first.'); return; }
  setBusy(btn, true, 'Splitting...');
  showResult('splitResult', '');
  try {
    const src = await PDFLib.PDFDocument.load(files[0].bytes);
    const total = src.getPageCount();
    const mode = document.querySelector('input[name="splitMode"]:checked').value;
    let pageNums = [];
    if (mode === 'all') { for (let i = 0; i < total; i++) pageNums.push(i); }
    else {
      const rangeStr = document.getElementById('splitRange').value;
      pageNums = parsePageRange(rangeStr, total);
    }
    if (!pageNums.length) { showError('splitResult', 'That range does not match any page in this file.'); return; }
    const zip = new JSZip();
    for (let i = 0; i < pageNums.length; i++) {
      const doc = await PDFLib.PDFDocument.create();
      const [page] = await doc.copyPages(src, [pageNums[i]]);
      doc.addPage(page);
      zip.file(`page_${pageNums[i]+1}.pdf`, await doc.save());
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    window._splitBlob = blob;
    showResult('splitResult', resultPanel('Split pages', downloadBtn('_splitBlob', 'split_pages.zip', 'Download ZIP'),
      `<p class="muted small">${plural(pageNums.length, 'separate PDF', 'separate PDFs')}, one per page.</p>`));
  } catch(e) { showError('splitResult', e.message); }
  finally { setBusy(btn, false); }
}

function parsePageRange(str, total) {
  const pages = new Set();
  for (const part of str.split(',')) {
    const trimmed = part.trim();
    if (trimmed.includes('-')) {
      const [a, b] = trimmed.split('-').map(Number);
      for (let i = Math.max(1,a); i <= Math.min(total,b); i++) pages.add(i-1);
    } else { const n = parseInt(trimmed); if (n >= 1 && n <= total) pages.add(n-1); }
  }
  return Array.from(pages).sort((a,b)=>a-b);
}

// Organize
async function doOrganize(btn) {
  const files = storedFiles['organize'];
  if (!files || !files.length) { showInlineError(btn, 'Choose a PDF first.'); return; }
  setBusy(btn, true, 'Reorganizing...');
  showResult('orgResult', '');
  try {
    const src = await PDFLib.PDFDocument.load(files[0].bytes);
    const order = document.getElementById('orgOrder').value.split(',').map(s => parseInt(s.trim()) - 1).filter(n => !isNaN(n) && n >= 0 && n < src.getPageCount());
    if (!order.length) { showError('orgResult', 'That page order does not match any page in this file.'); return; }
    const doc = await PDFLib.PDFDocument.create();
    const pages = await doc.copyPages(src, order);
    pages.forEach(p => doc.addPage(p));
    const bytes = await doc.save();
    window._orgBlob = new Blob([bytes], { type: 'application/pdf' });
    showResult('orgResult', resultPanel('Reorganized PDF', downloadBtn('_orgBlob', 'reorganized.pdf', 'Download PDF'),
      `<p class="muted small">${plural(order.length, 'page', 'pages')}, in the order you asked for.</p>`));
  } catch(e) { showError('orgResult', e.message); }
  finally { setBusy(btn, false); }
}

// Extract text
async function doExtractText(btn) {
  const files = storedFiles['text'];
  if (!files || !files.length) { showInlineError(btn, 'Choose a PDF first.'); return; }
  setBusy(btn, true, 'Reading...');
  showResult('textResult', '');
  try {
    const pdf = await pdfjsLib.getDocument({ data: files[0].bytes }).promise;
    let allText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const text = content.items.map(item => item.str).join(' ');
      allText += `Page ${i}\n${text}\n\n`;
    }
    window._extractedText = allText;
    showResult('textResult', resultPanel('Text from this PDF',
      `<button class="btn btn-sm btn-download" type="button" onclick="downloadBlob(new Blob([window._extractedText]),'extracted_text.txt')"><i class="ph ph-download-simple" aria-hidden="true"></i> Download TXT</button>`,
      `<div class="text-output">${escapeHTML(allText)}</div><p class="muted small">${plural(pdf.numPages, 'page', 'pages')} read.</p>`));
  } catch(e) { showError('textResult', e.message); }
  finally { setBusy(btn, false); }
}

// PDF to images
async function doPdfToImages(btn) {
  const files = storedFiles['p2i'];
  if (!files || !files.length) { showInlineError(btn, 'Choose a PDF first.'); return; }
  setBusy(btn, true, 'Converting...');
  showResult('p2iResult', '');
  try {
    const scale = parseFloat(document.getElementById('p2iScale').value);
    const pdf = await pdfjsLib.getDocument({ data: files[0].bytes }).promise;
    const zip = new JSZip();
    let previewHtml = '<div class="preview-grid">';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      const dataUrl = canvas.toDataURL('image/png');
      const base64 = dataUrl.split(',')[1];
      zip.file(`page_${String(i).padStart(3,'0')}.png`, base64, { base64: true });
      if (i <= 8) previewHtml += `<div><canvas width="${Math.min(vp.width,200)}" height="${Math.min(vp.height,280)}" id="prev-${i}"></canvas><div class="preview-caption">Page ${i}</div></div>`;
    }
    previewHtml += '</div>';
    window._p2iBlob = await zip.generateAsync({ type: 'blob' });
    showResult('p2iResult', resultPanel('Page images', downloadBtn('_p2iBlob', 'pdf_images.zip', 'Download ZIP'),
      `<p class="muted small">${plural(pdf.numPages, 'page', 'pages')} turned into PNG images.</p>${previewHtml}`));
  } catch(e) { showError('p2iResult', e.message); }
  finally { setBusy(btn, false); }
}

// Images to PDF
async function doImagesToPdf(btn) {
  const files = storedFiles['i2p'];
  if (!files || !files.length) { showInlineError(btn, 'Choose at least one image first.'); return; }
  setBusy(btn, true, 'Building...');
  showResult('i2pResult', '');
  try {
    const doc = await PDFLib.PDFDocument.create();
    for (const f of files) {
      let img;
      if (f.type === 'image/png') img = await doc.embedPng(f.bytes);
      else img = await doc.embedJpg(f.bytes);
      const page = doc.addPage([img.width, img.height]);
      page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
    }
    const bytes = await doc.save();
    window._i2pBlob = new Blob([bytes], { type: 'application/pdf' });
    showResult('i2pResult', resultPanel('Your PDF', downloadBtn('_i2pBlob', 'images.pdf', 'Download PDF'),
      `<p class="muted small">${plural(files.length, 'page', 'pages')}, one per image.</p>`));
  } catch(e) { showError('i2pResult', e.message); }
  finally { setBusy(btn, false); }
}

// Rotate
async function doRotate(btn) {
  const files = storedFiles['rotate'];
  if (!files || !files.length) { showInlineError(btn, 'Choose a PDF first.'); return; }
  setBusy(btn, true, 'Rotating...');
  showResult('rotResult', '');
  try {
    const doc = await PDFLib.PDFDocument.load(files[0].bytes);
    const deg = parseInt(document.querySelector('input[name="rotDeg"]:checked').value);
    const pagesInput = document.getElementById('rotPages').value.trim();
    let indices;
    if (pagesInput) indices = pagesInput.split(',').map(s => parseInt(s.trim()) - 1).filter(n => !isNaN(n) && n >= 0 && n < doc.getPageCount());
    else { indices = []; for (let i = 0; i < doc.getPageCount(); i++) indices.push(i); }
    for (const i of indices) { const page = doc.getPage(i); page.setRotation(PDFLib.degrees((page.getRotation().angle + deg) % 360)); }
    const bytes = await doc.save();
    window._rotBlob = new Blob([bytes], { type: 'application/pdf' });
    showResult('rotResult', resultPanel('Rotated PDF', downloadBtn('_rotBlob', 'rotated.pdf', 'Download PDF'),
      `<p class="muted small">${plural(indices.length, 'page', 'pages')} turned by ${deg} degrees.</p>`));
  } catch(e) { showError('rotResult', e.message); }
  finally { setBusy(btn, false); }
}

// Watermark
async function doWatermark(btn) {
  const files = storedFiles['wm'];
  if (!files || !files.length) { showInlineError(btn, 'Choose a PDF first.'); return; }
  setBusy(btn, true, 'Adding...');
  showResult('wmResult', '');
  try {
    const doc = await PDFLib.PDFDocument.load(files[0].bytes);
    const text = document.getElementById('wmText').value || 'DRAFT';
    const fontSize = parseInt(document.getElementById('wmSize').value) || 60;
    const opacity = parseFloat(document.getElementById('wmOpacity').value) || 0.15;
    const colorHex = document.getElementById('wmColor').value;
    const r = parseInt(colorHex.slice(1,3),16)/255, g = parseInt(colorHex.slice(3,5),16)/255, b = parseInt(colorHex.slice(5,7),16)/255;
    const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    for (let i = 0; i < doc.getPageCount(); i++) {
      const page = doc.getPage(i);
      const { width, height } = page.getSize();
      const tw = font.widthOfTextAtSize(text, fontSize);
      page.drawText(text, { x: width/2 - tw/2, y: height/2, size: fontSize, font, color: PDFLib.rgb(r,g,b), opacity, rotate: PDFLib.degrees(-45) });
    }
    const bytes = await doc.save();
    window._wmBlob = new Blob([bytes], { type: 'application/pdf' });
    showResult('wmResult', resultPanel('Watermarked PDF', downloadBtn('_wmBlob', 'watermarked.pdf', 'Download PDF'),
      `<p class="muted small">Added to all ${plural(doc.getPageCount(), 'page', 'pages')}.</p>`));
  } catch(e) { showError('wmResult', e.message); }
  finally { setBusy(btn, false); }
}

// Page numbers
async function doPageNumbers(btn) {
  const files = storedFiles['pn'];
  if (!files || !files.length) { showInlineError(btn, 'Choose a PDF first.'); return; }
  setBusy(btn, true, 'Numbering...');
  showResult('pnResult', '');
  try {
    const doc = await PDFLib.PDFDocument.load(files[0].bytes);
    const pos = document.getElementById('pnPos').value;
    const fmt = document.getElementById('pnFmt').value;
    const fontSize = parseInt(document.getElementById('pnSize').value) || 10;
    const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    const total = doc.getPageCount();
    for (let i = 0; i < total; i++) {
      const page = doc.getPage(i);
      const { width, height } = page.getSize();
      let txt;
      if (fmt === 'num') txt = String(i+1);
      else if (fmt === 'page') txt = `Page ${i+1}`;
      else txt = `${i+1} of ${total}`;
      const tw = font.widthOfTextAtSize(txt, fontSize);
      let x, y;
      if (pos.startsWith('bottom')) y = 30; else y = height - 30;
      if (pos.endsWith('center')) x = width/2 - tw/2;
      else if (pos.endsWith('right')) x = width - tw - 40;
      else x = 40;
      page.drawText(txt, { x, y, size: fontSize, font, color: PDFLib.rgb(0.4,0.4,0.4) });
    }
    const bytes = await doc.save();
    window._pnBlob = new Blob([bytes], { type: 'application/pdf' });
    showResult('pnResult', resultPanel('Numbered PDF', downloadBtn('_pnBlob', 'numbered.pdf', 'Download PDF'),
      `<p class="muted small">Numbers added to all ${plural(total, 'page', 'pages')}.</p>`));
  } catch(e) { showError('pnResult', e.message); }
  finally { setBusy(btn, false); }
}

// Metadata
async function loadMetadataFields() {
  const files = storedFiles['meta'];
  if (!files || !files.length) return;
  try {
    const doc = await PDFLib.PDFDocument.load(files[0].bytes, { ignoreEncryption: true });
    const fields = [
      { id:'metaTitle', label:'Title', val: doc.getTitle()||'' },
      { id:'metaAuthor', label:'Author', val: doc.getAuthor()||'' },
      { id:'metaSubject', label:'Subject', val: doc.getSubject()||'' },
      { id:'metaCreator', label:'Creator', val: doc.getCreator()||'' },
      { id:'metaProducer', label:'Producer', val: doc.getProducer()||'' },
      { id:'metaKeywords', label:'Keywords', val: doc.getKeywords()||'' },
    ];
    let html = '';
    for (const f of fields) html += `<div class="form-group"><label for="${f.id}">${f.label}</label><input type="text" id="${f.id}" value="${escapeHTML(f.val)}"></div>`;
    document.getElementById('metaFields').innerHTML = html;
  } catch(e) { showError('metaFields', e.message); }
}

async function doMetadata(btn) {
  const files = storedFiles['meta'];
  if (!files || !files.length) { showInlineError(btn, 'Choose a PDF first.'); return; }
  setBusy(btn, true, 'Saving...');
  showResult('metaResult', '');
  try {
    const doc = await PDFLib.PDFDocument.load(files[0].bytes);
    doc.setTitle(document.getElementById('metaTitle').value);
    doc.setAuthor(document.getElementById('metaAuthor').value);
    doc.setSubject(document.getElementById('metaSubject').value);
    doc.setCreator(document.getElementById('metaCreator').value);
    doc.setProducer(document.getElementById('metaProducer').value);
    doc.setKeywords([document.getElementById('metaKeywords').value]);
    const bytes = await doc.save();
    window._metaBlob = new Blob([bytes], { type: 'application/pdf' });
    showResult('metaResult', resultPanel('Updated PDF', downloadBtn('_metaBlob', 'metadata_updated.pdf', 'Download PDF'),
      `<p class="muted small">The properties you entered are now stored in the file.</p>`));
  } catch(e) { showError('metaResult', e.message); }
  finally { setBusy(btn, false); }
}

// Protect
async function doProtect(btn) {
  const files = storedFiles['protect'];
  if (!files || !files.length) { showInlineError(btn, 'Choose a PDF first.'); return; }
  const pw = document.getElementById('protectPw').value;
  if (!pw) { showInlineError(btn, 'Enter a password first.'); return; }
  setBusy(btn, true, 'Protecting...');
  showResult('protectResult', '');
  try {
    const ownerPw = document.getElementById('protectOwnerPw').value || pw;
    const doc = await PDFLib.PDFDocument.load(files[0].bytes);
    const bytes = await doc.save({ userPassword: pw, ownerPassword: ownerPw, permissions: { printing: 'lowResolution', modifying: false, copying: false } });
    window._protBlob = new Blob([bytes], { type: 'application/pdf' });
    showResult('protectResult', resultPanel('Protected PDF', downloadBtn('_protBlob', 'protected.pdf', 'Download PDF'),
      `<p class="muted small">The file now asks for your password before it opens.</p>`));
  } catch(e) { showError('protectResult', e.message); }
  finally { setBusy(btn, false); }
}
