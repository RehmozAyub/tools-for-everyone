<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Suite</title>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<style>
  :root { --bg:#0e1117; --surface:#1a1a2e; --text:#e0e0e0; --text-muted:#888; --accent:#667eea; --accent2:#764ba2; --green:#27ae60; --red:#e74c3c; --radius:12px; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .app{display:flex;min-height:100vh}
  .sidebar{width:260px;min-width:260px;background:var(--bg);border-right:1px solid #222;padding:20px;overflow-y:auto}
  .main{flex:1;padding:32px 40px;overflow-y:auto}
  .main-header{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:.2rem}
  .sub-header{text-align:center;color:#888;margin-bottom:2rem;font-size:1.05rem}
  h2{font-size:1.1rem;margin-bottom:12px}h3{font-size:1rem;color:var(--text-muted);margin-bottom:8px}
  .divider{border:none;border-top:1px solid #333;margin:16px 0}
  label{display:block;font-size:.85rem;color:var(--text-muted);margin-bottom:4px}
  input[type="text"],input[type="number"],input[type="password"],select,textarea{width:100%;padding:10px 12px;background:var(--surface);border:1px solid #333;border-radius:8px;color:var(--text);font-size:.95rem;outline:none;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  input[type="range"]{width:100%;accent-color:var(--accent)}
  input[type="color"]{width:60px;height:36px;border:1px solid #333;border-radius:6px;background:var(--surface);cursor:pointer}
  .form-group{margin-bottom:12px}.form-row{display:flex;gap:12px}.form-row>*{flex:1}
  .slider-value{text-align:right;font-size:.85rem;color:var(--accent);margin-top:2px}
  .btn{padding:10px 16px;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .2s}.btn:hover{opacity:.85}
  .btn-primary{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;padding:12px;font-size:1rem;margin-top:8px}
  .btn-download{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;padding:10px 20px;margin-top:8px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .tool-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.85rem;margin-bottom:3px;transition:background .2s;white-space:nowrap}
  .tool-item:hover{background:#1a1a2e}.tool-item.active{background:var(--accent);color:white}
  .drop-zone{border:2px dashed #444;border-radius:12px;padding:32px;text-align:center;color:var(--text-muted);cursor:pointer;transition:border-color .2s;margin-bottom:16px}
  .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent)}
  .drop-zone input{display:none}
  .info-msg{background:#1a2a3a;border-left:4px solid var(--accent);padding:10px 16px;border-radius:0 8px 8px 0;font-size:.9rem;color:var(--text-muted);margin:12px 0}
  .success-msg{background:#1a2a1a;border-left:4px solid #27ae60;padding:10px 16px;border-radius:0 8px 8px 0;font-size:.9rem;color:#95d5b2;margin:12px 0}
  .error-msg{background:#2a1a1a;border-left:4px solid #e74c3c;padding:10px 16px;border-radius:0 8px 8px 0;font-size:.9rem;color:#e88;margin:12px 0}
  .tool-info{padding:.8rem 1rem;border-radius:8px;background:#1a1a2e;border-left:4px solid #667eea;margin-bottom:1rem;font-size:.9rem;color:var(--text-muted)}
  .checkbox-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.9rem;color:var(--text);margin-bottom:8px}
  .checkbox-label input{accent-color:var(--accent);width:16px;height:16px}
  .radio-group{display:flex;gap:0;margin-bottom:4px;flex-wrap:wrap}
  .radio-group label{display:flex;align-items:center;padding:8px 14px;background:var(--surface);border:1px solid #333;cursor:pointer;font-size:.85rem;color:var(--text);margin-bottom:0;white-space:nowrap}
  .radio-group label:first-child{border-radius:8px 0 0 8px}.radio-group label:last-child{border-radius:0 8px 8px 0}
  .radio-group input[type="radio"]{display:none}.radio-group input[type="radio"]:checked+span{color:var(--accent);font-weight:700}
  .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:16px 0}
  .preview-grid canvas{width:100%;border-radius:4px;border:1px solid #333}
  .text-output{background:var(--surface);border:1px solid #333;border-radius:8px;padding:16px;font-family:monospace;font-size:.9rem;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-wrap:break-word;margin:12px 0}
  .footer{text-align:center;color:#666;font-size:.85rem;margin-top:40px}.footer a{color:var(--accent);text-decoration:none}
  .spinner{display:inline-block;width:20px;height:20px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:900px){.app{flex-direction:column}.sidebar{width:100%;min-width:0;border-right:none;border-bottom:1px solid #222}.main{padding:20px}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h2>🧰 Select Tool</h2>
    <div id="toolList"></div>
    <hr class="divider">
    <h3>ℹ️ About</h3>
    <p style="font-size:.85rem;color:var(--text-muted);">Free, open-source PDF toolkit. No file uploads to external servers — <b>everything runs locally in your browser.</b></p>
    <hr class="divider">
    <p style="font-size:.85rem;">Made with ❤️ by <a href="https://github.com/RehmozAyub" style="color:var(--accent);text-decoration:none;">RehmozAyub</a></p>
  </div>
  <div class="main">
    <div class="main-header">📄 PDF Suite</div>
    <div class="sub-header">Your all-in-one PDF toolkit — merge, split, compress, extract & more</div>
    <div id="toolContent"></div>
    <div class="footer">PDF Suite v2.0 · Built with HTML + JavaScript · <a href="https://github.com/RehmozAyub/tools-for-everyone">GitHub</a></div>
  </div>
</div>
<script>
const TOOLS = [
  { id:'merge', icon:'🔗', name:'Merge PDFs' },
  { id:'split', icon:'✂️', name:'Split PDF' },
  { id:'organize', icon:'📑', name:'Organize Pages' },
  { id:'extract_text', icon:'📝', name:'Extract Text' },
  { id:'pdf_to_images', icon:'🖼️', name:'PDF → Images' },
  { id:'images_to_pdf', icon:'📄', name:'Images → PDF' },
  { id:'rotate', icon:'🔄', name:'Rotate Pages' },
  { id:'watermark', icon:'💧', name:'Add Watermark' },
  { id:'page_numbers', icon:'🔢', name:'Page Numbers' },
  { id:'metadata', icon:'📋', name:'Edit Metadata' },
  { id:'protect', icon:'🔒', name:'Protect PDF' },
  { id:'unlock', icon:'🔓', name:'Unlock PDF' },
];

let currentTool = 'merge';

function initToolList() {
  const list = document.getElementById('toolList');
  list.innerHTML = TOOLS.map(t =>
    `<div class="tool-item${t.id===currentTool?' active':''}" onclick="selectTool('${t.id}',this)">${t.icon} ${t.name}</div>`
  ).join('');
}

function selectTool(id, el) {
  currentTool = id;
  document.querySelectorAll('.tool-item').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  renderTool();
}

function dropZoneHTML(id, accept, multiple, label) {
  return `<div class="drop-zone" id="dz-${id}" onclick="document.getElementById('fi-${id}').click()">
    <p>📁 ${label || 'Drag & drop or click to browse'}</p>
    <input type="file" id="fi-${id}" ${accept?'accept="'+accept+'"':''} ${multiple?'multiple':''}>
  </div><div id="info-${id}"></div>`;
}

function renderTool() {
  const c = document.getElementById('toolContent');
  switch (currentTool) {
    case 'merge': c.innerHTML = `<h2>🔗 Merge PDFs</h2><p class="tool-info">Combine multiple PDF files into a single document.</p>
      ${dropZoneHTML('merge','.pdf',true,'Upload PDFs to merge (order matters)')}<div id="mergeList"></div>
      <button class="btn btn-primary" onclick="doMerge()">🔗 Merge Now</button><div id="mergeResult"></div>`; break;
    case 'split': c.innerHTML = `<h2>✂️ Split PDF</h2><p class="tool-info">Split a PDF into individual pages or custom ranges.</p>
      ${dropZoneHTML('split','.pdf',false,'Upload PDF to split')}<div class="form-group"><label>Mode</label>
      <div class="radio-group"><label><input type="radio" name="splitMode" value="all" checked><span>All pages</span></label>
      <label><input type="radio" name="splitMode" value="range"><span>Page range</span></label></div></div>
      <div class="form-group"><label>Page range (e.g. 1-3,5,7-9)</label><input type="text" id="splitRange" placeholder="1-3,5,7-9"></div>
      <button class="btn btn-primary" onclick="doSplit()">✂️ Split Now</button><div id="splitResult"></div>`; break;
    case 'organize': c.innerHTML = `<h2>📑 Organize Pages</h2><p class="tool-info">Reorder or remove pages from a PDF.</p>
      ${dropZoneHTML('organize','.pdf',false,'Upload PDF')}<div class="form-group"><label>New page order (comma-separated, e.g. 3,1,2,5)</label>
      <input type="text" id="orgOrder" placeholder="3,1,2,5"></div>
      <button class="btn btn-primary" onclick="doOrganize()">📑 Reorganize</button><div id="orgResult"></div>`; break;
    case 'extract_text': c.innerHTML = `<h2>📝 Extract Text</h2><p class="tool-info">Extract all text content from a PDF.</p>
      ${dropZoneHTML('text','.pdf',false,'Upload PDF')}<button class="btn btn-primary" onclick="doExtractText()">📝 Extract Text</button><div id="textResult"></div>`; break;
    case 'pdf_to_images': c.innerHTML = `<h2>🖼️ PDF → Images</h2><p class="tool-info">Convert each page to a PNG image.</p>
      ${dropZoneHTML('p2i','.pdf',false,'Upload PDF')}<div class="form-group"><label>Scale</label>
      <input type="range" id="p2iScale" min="1" max="4" value="2" step="0.5"><div class="slider-value" id="p2iScaleVal">2x</div></div>
      <button class="btn btn-primary" onclick="doPdfToImages()">🖼️ Convert to Images</button><div id="p2iResult"></div>`; break;
    case 'images_to_pdf': c.innerHTML = `<h2>📄 Images → PDF</h2><p class="tool-info">Convert images into a PDF document.</p>
      ${dropZoneHTML('i2p','image/*',true,'Upload images (PNG, JPG)')}<button class="btn btn-primary" onclick="doImagesToPdf()">📄 Create PDF</button><div id="i2pResult"></div>`; break;
    case 'rotate': c.innerHTML = `<h2>🔄 Rotate Pages</h2><p class="tool-info">Rotate all or specific pages.</p>
      ${dropZoneHTML('rotate','.pdf',false,'Upload PDF')}<div class="form-group"><label>Rotation</label>
      <div class="radio-group"><label><input type="radio" name="rotDeg" value="90" checked><span>90° CW</span></label>
      <label><input type="radio" name="rotDeg" value="180"><span>180°</span></label>
      <label><input type="radio" name="rotDeg" value="270"><span>90° CCW</span></label></div></div>
      <div class="form-group"><label>Pages (blank = all, or e.g. 1,3,5)</label><input type="text" id="rotPages" placeholder="All pages"></div>
      <button class="btn btn-primary" onclick="doRotate()">🔄 Rotate</button><div id="rotResult"></div>`; break;
    case 'watermark': c.innerHTML = `<h2>💧 Add Watermark</h2><p class="tool-info">Add a text watermark to every page.</p>
      ${dropZoneHTML('wm','.pdf',false,'Upload PDF')}<div class="form-row">
      <div class="form-group"><label>Watermark text</label><input type="text" id="wmText" value="DRAFT" placeholder="DRAFT"></div>
      <div class="form-group"><label>Font size</label><input type="number" id="wmSize" value="60" min="10" max="200"></div></div>
      <div class="form-row"><div class="form-group"><label>Opacity</label><input type="range" id="wmOpacity" min="0.05" max="1" value="0.15" step="0.05">
      <div class="slider-value" id="wmOpVal">0.15</div></div>
      <div class="form-group"><label>Color</label><input type="color" id="wmColor" value="#888888"></div></div>
      <button class="btn btn-primary" onclick="doWatermark()">💧 Add Watermark</button><div id="wmResult"></div>`; break;
    case 'page_numbers': c.innerHTML = `<h2>🔢 Page Numbers</h2><p class="tool-info">Add page numbers to every page.</p>
      ${dropZoneHTML('pn','.pdf',false,'Upload PDF')}<div class="form-row">
      <div class="form-group"><label>Position</label><select id="pnPos"><option value="bottom-center">Bottom Center</option>
      <option value="bottom-right">Bottom Right</option><option value="bottom-left">Bottom Left</option>
      <option value="top-center">Top Center</option><option value="top-right">Top Right</option></select></div>
      <div class="form-group"><label>Format</label><select id="pnFmt"><option value="num">1, 2, 3…</option>
      <option value="page">Page 1, Page 2…</option><option value="of">1 of N, 2 of N…</option></select></div></div>
      <div class="form-group"><label>Font size</label><input type="number" id="pnSize" value="10" min="6" max="24"></div>
      <button class="btn btn-primary" onclick="doPageNumbers()">🔢 Add Page Numbers</button><div id="pnResult"></div>`; break;
    case 'metadata': c.innerHTML = `<h2>📋 Edit Metadata</h2><p class="tool-info">View and edit PDF properties.</p>
      ${dropZoneHTML('meta','.pdf',false,'Upload PDF')}<div id="metaFields"></div>
      <button class="btn btn-primary" onclick="doMetadata()">📋 Save Metadata</button><div id="metaResult"></div>`; break;
    case 'protect': c.innerHTML = `<h2>🔒 Protect PDF</h2><p class="tool-info">Add password protection to a PDF.</p>
      ${dropZoneHTML('protect','.pdf',false,'Upload PDF')}<div class="form-group"><label>User password</label>
      <input type="password" id="protectPw" placeholder="Enter password"></div>
      <div class="form-group"><label>Owner password (optional)</label><input type="password" id="protectOwnerPw" placeholder="Owner password"></div>
      <button class="btn btn-primary" onclick="doProtect()">🔒 Protect</button><div id="protectResult"></div>`; break;
    case 'unlock': c.innerHTML = `<h2>🔓 Unlock PDF</h2><p class="tool-info">Remove password from a PDF (you must know the password).</p>
      ${dropZoneHTML('unlock','.pdf',false,'Upload protected PDF')}<div class="form-group"><label>Password</label>
      <input type="password" id="unlockPw" placeholder="Enter password"></div>
      <button class="btn btn-primary" onclick="doUnlock()">🔓 Unlock</button><div id="unlockResult"></div>`; break;
    default: c.innerHTML = '<p>Select a tool from the sidebar.</p>';
  }
  setupDropZones();
}

let storedFiles = {};
function setupDropZones() {
  document.querySelectorAll('.drop-zone').forEach(dz => {
    const id = dz.id.replace('dz-','');
    const fi = document.getElementById('fi-'+id);
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); fi.files = e.dataTransfer.files; fi.dispatchEvent(new Event('change')); });
    fi.addEventListener('change', async () => {
      const files = Array.from(fi.files);
      if (!files.length) return;
      storedFiles[id] = [];
      for (const f of files) {
        const buf = await f.arrayBuffer();
        storedFiles[id].push({ name: f.name, bytes: new Uint8Array(buf), type: f.type });
      }
      const infoEl = document.getElementById('info-'+id);
      if (files.length === 1) infoEl.innerHTML = `<div class="success-msg">${files[0].name} (${(files[0].size/1024).toFixed(1)} KB)</div>`;
      else infoEl.innerHTML = `<div class="success-msg">${files.length} files uploaded</div>`;
      if (id === 'meta') loadMetadataFields();
    });
  });
  const p2iScale = document.getElementById('p2iScale');
  if (p2iScale) p2iScale.addEventListener('input', function(){ document.getElementById('p2iScaleVal').textContent = this.value+'x'; });
  const wmOp = document.getElementById('wmOpacity');
  if (wmOp) wmOp.addEventListener('input', function(){ document.getElementById('wmOpVal').textContent = this.value; });
}

function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

function showResult(elId, html) { document.getElementById(elId).innerHTML = html; }
function showLoading(elId) { showResult(elId, '<p><span class="spinner"></span> Processing…</p>'); }

// ─── MERGE ───
async function doMerge() {
  const files = storedFiles['merge'];
  if (!files || files.length < 2) { alert('Upload at least 2 PDFs.'); return; }
  showLoading('mergeResult');
  try {
    const merged = await PDFLib.PDFDocument.create();
    for (const f of files) {
      const src = await PDFLib.PDFDocument.load(f.bytes);
      const pages = await merged.copyPages(src, src.getPageIndices());
      pages.forEach(p => merged.addPage(p));
    }
    const bytes = await merged.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    showResult('mergeResult', `<div class="success-msg">Merged ${files.length} PDFs (${(bytes.length/1024).toFixed(1)} KB)</div>
      <button class="btn btn-download" onclick="downloadBlob(window._mergedBlob,'merged.pdf')">⬇️ Download Merged PDF</button>`);
    window._mergedBlob = blob;
  } catch(e) { showResult('mergeResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}

// ─── SPLIT ───
async function doSplit() {
  const files = storedFiles['split'];
  if (!files || !files.length) { alert('Upload a PDF.'); return; }
  showLoading('splitResult');
  try {
    const src = await PDFLib.PDFDocument.load(files[0].bytes);
    const total = src.getPageCount();
    const mode = document.querySelector('input[name="splitMode"]:checked').value;
    let pageNums = [];
    if (mode === 'all') { for (let i = 0; i < total; i++) pageNums.push(i); }
    else {
      const rangeStr = document.getElementById('splitRange').value;
      pageNums = parsePageRange(rangeStr, total);
    }
    const zip = new JSZip();
    for (let i = 0; i < pageNums.length; i++) {
      const doc = await PDFLib.PDFDocument.create();
      const [page] = await doc.copyPages(src, [pageNums[i]]);
      doc.addPage(page);
      zip.file(`page_${pageNums[i]+1}.pdf`, await doc.save());
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    showResult('splitResult', `<div class="success-msg">Split into ${pageNums.length} page(s)</div>
      <button class="btn btn-download" onclick="downloadBlob(window._splitBlob,'split_pages.zip')">⬇️ Download ZIP</button>`);
    window._splitBlob = blob;
  } catch(e) { showResult('splitResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}

function parsePageRange(str, total) {
  const pages = new Set();
  for (const part of str.split(',')) {
    const trimmed = part.trim();
    if (trimmed.includes('-')) {
      const [a, b] = trimmed.split('-').map(Number);
      for (let i = Math.max(1,a); i <= Math.min(total,b); i++) pages.add(i-1);
    } else { const n = parseInt(trimmed); if (n >= 1 && n <= total) pages.add(n-1); }
  }
  return Array.from(pages).sort((a,b)=>a-b);
}

// ─── ORGANIZE ───
async function doOrganize() {
  const files = storedFiles['organize'];
  if (!files || !files.length) { alert('Upload a PDF.'); return; }
  showLoading('orgResult');
  try {
    const src = await PDFLib.PDFDocument.load(files[0].bytes);
    const order = document.getElementById('orgOrder').value.split(',').map(s => parseInt(s.trim()) - 1).filter(n => !isNaN(n) && n >= 0 && n < src.getPageCount());
    if (!order.length) { showResult('orgResult', '<div class="error-msg">Invalid page order.</div>'); return; }
    const doc = await PDFLib.PDFDocument.create();
    const pages = await doc.copyPages(src, order);
    pages.forEach(p => doc.addPage(p));
    const bytes = await doc.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    showResult('orgResult', `<div class="success-msg">Reorganized ${order.length} pages</div>
      <button class="btn btn-download" onclick="downloadBlob(window._orgBlob,'reorganized.pdf')">⬇️ Download</button>`);
    window._orgBlob = blob;
  } catch(e) { showResult('orgResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}

// ─── EXTRACT TEXT ───
async function doExtractText() {
  const files = storedFiles['text'];
  if (!files || !files.length) { alert('Upload a PDF.'); return; }
  showLoading('textResult');
  try {
    const pdf = await pdfjsLib.getDocument({ data: files[0].bytes }).promise;
    let allText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const text = content.items.map(item => item.str).join(' ');
      allText += `--- Page ${i} ---\n${text}\n\n`;
    }
    showResult('textResult', `<div class="success-msg">Extracted text from ${pdf.numPages} pages</div>
      <div class="text-output">${escapeHTML(allText)}</div>
      <button class="btn btn-download" onclick="downloadBlob(new Blob([window._extractedText]),'extracted_text.txt')">⬇️ Download TXT</button>`);
    window._extractedText = allText;
  } catch(e) { showResult('textResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}

// ─── PDF → IMAGES ───
async function doPdfToImages() {
  const files = storedFiles['p2i'];
  if (!files || !files.length) { alert('Upload a PDF.'); return; }
  showLoading('p2iResult');
  try {
    const scale = parseFloat(document.getElementById('p2iScale').value);
    const pdf = await pdfjsLib.getDocument({ data: files[0].bytes }).promise;
    const zip = new JSZip();
    let previewHtml = '<div class="preview-grid">';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      const dataUrl = canvas.toDataURL('image/png');
      const base64 = dataUrl.split(',')[1];
      zip.file(`page_${String(i).padStart(3,'0')}.png`, base64, { base64: true });
      if (i <= 8) previewHtml += `<div><canvas width="${Math.min(vp.width,200)}" height="${Math.min(vp.height,280)}" id="prev-${i}"></canvas><div style="text-align:center;font-size:.75rem;color:var(--text-muted);">Page ${i}</div></div>`;
    }
    previewHtml += '</div>';
    const blob = await zip.generateAsync({ type: 'blob' });
    showResult('p2iResult', `<div class="success-msg">Converted ${pdf.numPages} pages to images</div>${previewHtml}
      <button class="btn btn-download" onclick="downloadBlob(window._p2iBlob,'pdf_images.zip')">⬇️ Download ZIP</button>`);
    window._p2iBlob = blob;
  } catch(e) { showResult('p2iResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}

// ─── IMAGES → PDF ───
async function doImagesToPdf() {
  const files = storedFiles['i2p'];
  if (!files || !files.length) { alert('Upload images.'); return; }
  showLoading('i2pResult');
  try {
    const doc = await PDFLib.PDFDocument.create();
    for (const f of files) {
      let img;
      if (f.type === 'image/png') img = await doc.embedPng(f.bytes);
      else img = await doc.embedJpg(f.bytes);
      const page = doc.addPage([img.width, img.height]);
      page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
    }
    const bytes = await doc.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    showResult('i2pResult', `<div class="success-msg">Created PDF with ${files.length} page(s)</div>
      <button class="btn btn-download" onclick="downloadBlob(window._i2pBlob,'images.pdf')">⬇️ Download PDF</button>`);
    window._i2pBlob = blob;
  } catch(e) { showResult('i2pResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}

// ─── ROTATE ───
async function doRotate() {
  const files = storedFiles['rotate'];
  if (!files || !files.length) { alert('Upload a PDF.'); return; }
  showLoading('rotResult');
  try {
    const doc = await PDFLib.PDFDocument.load(files[0].bytes);
    const deg = parseInt(document.querySelector('input[name="rotDeg"]:checked').value);
    const pagesInput = document.getElementById('rotPages').value.trim();
    let indices;
    if (pagesInput) indices = pagesInput.split(',').map(s => parseInt(s.trim()) - 1).filter(n => !isNaN(n) && n >= 0 && n < doc.getPageCount());
    else { indices = []; for (let i = 0; i < doc.getPageCount(); i++) indices.push(i); }
    for (const i of indices) { const page = doc.getPage(i); page.setRotation(PDFLib.degrees((page.getRotation().angle + deg) % 360)); }
    const bytes = await doc.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    showResult('rotResult', `<div class="success-msg">Rotated ${indices.length} page(s) by ${deg}°</div>
      <button class="btn btn-download" onclick="downloadBlob(window._rotBlob,'rotated.pdf')">⬇️ Download</button>`);
    window._rotBlob = blob;
  } catch(e) { showResult('rotResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}

// ─── WATERMARK ───
async function doWatermark() {
  const files = storedFiles['wm'];
  if (!files || !files.length) { alert('Upload a PDF.'); return; }
  showLoading('wmResult');
  try {
    const doc = await PDFLib.PDFDocument.load(files[0].bytes);
    const text = document.getElementById('wmText').value || 'DRAFT';
    const fontSize = parseInt(document.getElementById('wmSize').value) || 60;
    const opacity = parseFloat(document.getElementById('wmOpacity').value) || 0.15;
    const colorHex = document.getElementById('wmColor').value;
    const r = parseInt(colorHex.slice(1,3),16)/255, g = parseInt(colorHex.slice(3,5),16)/255, b = parseInt(colorHex.slice(5,7),16)/255;
    const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    for (let i = 0; i < doc.getPageCount(); i++) {
      const page = doc.getPage(i);
      const { width, height } = page.getSize();
      const tw = font.widthOfTextAtSize(text, fontSize);
      page.drawText(text, { x: width/2 - tw/2, y: height/2, size: fontSize, font, color: PDFLib.rgb(r,g,b), opacity, rotate: PDFLib.degrees(-45) });
    }
    const bytes = await doc.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    showResult('wmResult', `<div class="success-msg">Watermark added to ${doc.getPageCount()} page(s)</div>
      <button class="btn btn-download" onclick="downloadBlob(window._wmBlob,'watermarked.pdf')">⬇️ Download</button>`);
    window._wmBlob = blob;
  } catch(e) { showResult('wmResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}

// ─── PAGE NUMBERS ───
async function doPageNumbers() {
  const files = storedFiles['pn'];
  if (!files || !files.length) { alert('Upload a PDF.'); return; }
  showLoading('pnResult');
  try {
    const doc = await PDFLib.PDFDocument.load(files[0].bytes);
    const pos = document.getElementById('pnPos').value;
    const fmt = document.getElementById('pnFmt').value;
    const fontSize = parseInt(document.getElementById('pnSize').value) || 10;
    const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    const total = doc.getPageCount();
    for (let i = 0; i < total; i++) {
      const page = doc.getPage(i);
      const { width, height } = page.getSize();
      let txt;
      if (fmt === 'num') txt = String(i+1);
      else if (fmt === 'page') txt = `Page ${i+1}`;
      else txt = `${i+1} of ${total}`;
      const tw = font.widthOfTextAtSize(txt, fontSize);
      let x, y;
      if (pos.startsWith('bottom')) y = 30; else y = height - 30;
      if (pos.endsWith('center')) x = width/2 - tw/2;
      else if (pos.endsWith('right')) x = width - tw - 40;
      else x = 40;
      page.drawText(txt, { x, y, size: fontSize, font, color: PDFLib.rgb(0.4,0.4,0.4) });
    }
    const bytes = await doc.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    showResult('pnResult', `<div class="success-msg">Added page numbers to ${total} page(s)</div>
      <button class="btn btn-download" onclick="downloadBlob(window._pnBlob,'numbered.pdf')">⬇️ Download</button>`);
    window._pnBlob = blob;
  } catch(e) { showResult('pnResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}

// ─── METADATA ───
async function loadMetadataFields() {
  const files = storedFiles['meta'];
  if (!files || !files.length) return;
  try {
    const doc = await PDFLib.PDFDocument.load(files[0].bytes, { ignoreEncryption: true });
    const fields = [
      { id:'metaTitle', label:'Title', val: doc.getTitle()||'' },
      { id:'metaAuthor', label:'Author', val: doc.getAuthor()||'' },
      { id:'metaSubject', label:'Subject', val: doc.getSubject()||'' },
      { id:'metaCreator', label:'Creator', val: doc.getCreator()||'' },
      { id:'metaProducer', label:'Producer', val: doc.getProducer()||'' },
      { id:'metaKeywords', label:'Keywords', val: doc.getKeywords()||'' },
    ];
    let html = '';
    for (const f of fields) html += `<div class="form-group"><label>${f.label}</label><input type="text" id="${f.id}" value="${escapeHTML(f.val)}"></div>`;
    document.getElementById('metaFields').innerHTML = html;
  } catch(e) { document.getElementById('metaFields').innerHTML = `<div class="error-msg">Error: ${e.message}</div>`; }
}

async function doMetadata() {
  const files = storedFiles['meta'];

  } catch(e) { showResult('metaResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}

// ─── PROTECT ───
async function doProtect() {
  const files = storedFiles['protect'];
  if (!files || !files.length) { alert('Upload a PDF.'); return; }
  const pw = document.getElementById('protectPw').value;
  if (!pw) { alert('Enter a password.'); return; }
  showLoading('protectResult');
  try {
    const ownerPw = document.getElementById('protectOwnerPw').value || pw;
    const doc = await PDFLib.PDFDocument.load(files[0].bytes);
    const bytes = await doc.save({ userPassword: pw, ownerPassword: ownerPw, permissions: { printing: 'lowResolution', modifying: false, copying: false } });
    const blob = new Blob([bytes], { type: 'application/pdf' });
    showResult('protectResult', `<div class="success-msg">PDF protected with password</div>
      <button class="btn btn-download" onclick="downloadBlob(window._protBlob,'protected.pdf')">⬇️ Download</button>`);
    window._protBlob = blob;
  } catch(e) { showResult('protectResult', `<div class="error-msg">Error: ${e.message}</div>`); }
}
