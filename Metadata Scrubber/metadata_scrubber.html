<style>
  .file-header {

  }
  .file-title {

  }
  .file-title .name {

    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch;
  }
  .file-count {
    color: var(--text-muted); font-size: 0.8125rem;

<body data-sw-path="../sw.js">

  <button class="link-btn" type="button" onclick="sharePage()">Share</button>

<script>
const SENSITIVE_IMAGE_TAGS = new Set([
  'GPSLatitude', 'GPSLongitude', 'GPSLatitudeRef', 'GPSLongitudeRef',
  'GPSAltitude', 'GPSTimeStamp', 'GPSDateStamp', 'latitude', 'longitude',
  'BodySerialNumber', 'CameraSerialNumber', 'SerialNumber',
  'LensSerialNumber', 'ImageUniqueID',
  'CameraOwnerName', 'OwnerName', 'Artist', 'Copyright',
  'XPAuthor', 'XPComment',
]);
const SENSITIVE_DOC_PROPS = new Set(['author', 'last_modified_by', 'creator', 'producer', 'company', 'manager', 'category', 'dc:creator', 'cp:lastModifiedBy']);
const IMAGE_EXTS = new Set(['jpg', 'jpeg', 'png', 'webp', 'tiff', 'bmp']);
const DOC_EXTS = new Set(['docx', 'pdf', 'xlsx', 'pptx']);
const FORMAT_ICONS = { docx: 'file-doc', pdf: 'file-pdf', xlsx: 'file-xls', pptx: 'file-ppt', jpg: 'file-image', jpeg: 'file-image', png: 'file-image', webp: 'file-image', tiff: 'file-image', bmp: 'file-image' };

let fileEntries = [];

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e => handleFiles(e.target.files));

function getExt(name) { const p = name.lastIndexOf('.'); return p > 0 ? name.slice(p + 1).toLowerCase() : ''; }

async function handleFiles(files) {
  fileEntries = [];
  for (const file of files) {
    const ext = getExt(file.name);
    if (!IMAGE_EXTS.has(ext) && !DOC_EXTS.has(ext)) continue;
    const bytes = await file.arrayBuffer();
    fileEntries.push({ name: file.name, ext, bytes: new Uint8Array(bytes), type: file.type, metadata: null, risks: [], stripped: null });
  }
  if (!fileEntries.length) {
    showToast('None of those files are a supported type', 'error');
    return;
  }

  for (let i = 0; i < fileEntries.length; i++) {
    await inspectFile(fileEntries[i]);
  }
  render();
}

async function inspectFile(entry) {
  const ext = entry.ext;
  entry.metadata = {};
  entry.risks = [];

  if (IMAGE_EXTS.has(ext)) {
    try {
      const exif = await exifr.parse(entry.bytes.buffer, { gps: true, ifd0: true, exif: true, iptc: true, xmp: true, tiff: true });
      if (exif) {
        entry.metadata = {};
        for (const [k, v] of Object.entries(exif)) {
          if (v === undefined || v === null) continue;
          const strVal = typeof v === 'object' && !Array.isArray(v) ? JSON.stringify(v) : String(v);
          entry.metadata[k] = strVal;
          if (SENSITIVE_IMAGE_TAGS.has(k)) entry.risks.push([k, strVal]);
        }
      }
    } catch (e) { entry.metadata = { error: 'Could not parse metadata' }; }
  } else if (ext === 'pdf') {
    try {
      const pdfDoc = await PDFLib.PDFDocument.load(entry.bytes, { ignoreEncryption: true });
      const fields = ['Title', 'Author', 'Subject', 'Creator', 'Producer', 'Keywords', 'CreationDate', 'ModificationDate'];
      for (const f of fields) {
        const getter = 'get' + f;
        try {
          const v = pdfDoc[getter]?.();
          if (v) {
            const sv = v instanceof Date ? v.toISOString() : String(v);
            entry.metadata[f] = sv;
            if (['Author', 'Creator', 'Producer'].includes(f)) entry.risks.push([f, sv]);
          }
        } catch {}
      }
      entry.metadata['Pages'] = String(pdfDoc.getPageCount());
    } catch (e) { entry.metadata = { error: 'Could not parse PDF: ' + e.message }; }
  } else if (ext === 'docx' || ext === 'xlsx' || ext === 'pptx') {
    try {
      const zip = await JSZip.loadAsync(entry.bytes);
      const coreXmlFile = zip.file('docProps/core.xml');
      if (coreXmlFile) {
        const coreXml = await coreXmlFile.async('string');
        const parser = new DOMParser();
        const doc = parser.parseFromString(coreXml, 'text/xml');
        const tags = ['dc:title', 'dc:subject', 'dc:creator', 'cp:lastModifiedBy', 'cp:keywords', 'cp:category', 'dcterms:created', 'dcterms:modified', 'cp:revision', 'dc:description'];
        for (const tag of tags) {
          const el = doc.getElementsByTagName(tag)[0];
          if (el && el.textContent.trim()) {
            entry.metadata[tag] = el.textContent.trim();
            if (SENSITIVE_DOC_PROPS.has(tag)) entry.risks.push([tag, el.textContent.trim()]);
          }
        }
      }
      const appXmlFile = zip.file('docProps/app.xml');
      if (appXmlFile) {
        const appXml = await appXmlFile.async('string');
        const parser = new DOMParser();
        const doc = parser.parseFromString(appXml, 'text/xml');
        for (const tag of ['Company', 'Manager', 'Application', 'AppVersion', 'Template']) {
          const el = doc.getElementsByTagName(tag)[0];
          if (el && el.textContent.trim()) {
            entry.metadata[tag] = el.textContent.trim();
            if (['Company', 'Manager'].includes(tag)) entry.risks.push([tag, el.textContent.trim()]);
          }
        }
      }
    } catch (e) { entry.metadata = { error: 'Could not parse document: ' + e.message }; }
  }
}

async function stripFileMetadata(idx, btn) {
  const entry = fileEntries[idx];
  const ext = entry.ext;
  setBusy(btn, true, 'Stripping...');

  if (IMAGE_EXTS.has(ext)) {
    const blob = new Blob([entry.bytes], { type: entry.type });
    const img = await createImageBitmap(blob);
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const mimeMap = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', bmp: 'image/png', tiff: 'image/png' };
    const mime = mimeMap[ext] || 'image/png';
    const quality = mime === 'image/jpeg' ? 0.95 : undefined;
    const dataUrl = canvas.toDataURL(mime, quality);
    const res = await fetch(dataUrl);
    entry.stripped = new Uint8Array(await res.arrayBuffer());
    entry.strippedExt = (ext === 'bmp' || ext === 'tiff') ? 'png' : ext;
  } else if (ext === 'pdf') {
    try {
      const pdfDoc = await PDFLib.PDFDocument.load(entry.bytes);
      pdfDoc.setTitle(''); pdfDoc.setAuthor(''); pdfDoc.setSubject('');
      pdfDoc.setCreator(''); pdfDoc.setProducer(''); pdfDoc.setKeywords([]);
      const saved = await pdfDoc.save();
      entry.stripped = new Uint8Array(saved);
      entry.strippedExt = 'pdf';
    } catch { entry.stripped = null; }
  } else if (ext === 'docx' || ext === 'xlsx' || ext === 'pptx') {
    try {
      const zip = await JSZip.loadAsync(entry.bytes);
      const coreFile = zip.file('docProps/core.xml');
      if (coreFile) {
        let xml = await coreFile.async('string');
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'text/xml');
        const clearTags = ['dc:creator', 'cp:lastModifiedBy', 'dc:title', 'dc:subject', 'cp:keywords', 'cp:category', 'dc:description', 'cp:contentStatus'];
        for (const tag of clearTags) {
          const el = doc.getElementsByTagName(tag)[0];
          if (el) el.textContent = '';
        }
        const revEl = doc.getElementsByTagName('cp:revision')[0];
        if (revEl) revEl.textContent = '1';
        const ser = new XMLSerializer();
        zip.file('docProps/core.xml', ser.serializeToString(doc));
      }
      const appFile = zip.file('docProps/app.xml');
      if (appFile) {
        let xml = await appFile.async('string');
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'text/xml');
        for (const tag of ['Company', 'Manager', 'Template']) {
          const el = doc.getElementsByTagName(tag)[0];
          if (el) el.textContent = '';
        }
        const ser = new XMLSerializer();
        zip.file('docProps/app.xml', ser.serializeToString(doc));
      }
      const result = await zip.generateAsync({ type: 'uint8array' });
      entry.stripped = result;
      entry.strippedExt = ext;
    } catch { entry.stripped = null; }
  }

  setBusy(btn, false);
  showToast(`Metadata stripped from ${entry.name}`, 'success');
  render();
}

async function stripAll(btn) {
  if (!fileEntries.length) {
    showInlineError(btn, 'Choose some files first.');
    return;
  }
  setBusy(btn, true, 'Stripping...');
  for (let i = 0; i < fileEntries.length; i++) {
    if (!fileEntries[i].stripped) await stripFileMetadata(i);
  }
  setBusy(btn, false);
  showToast('All files stripped', 'success');
  render();
}

function downloadFile(idx) {
  const entry = fileEntries[idx];
  const data = entry.stripped || entry.bytes;
  const ext = entry.stripped ? (entry.strippedExt || entry.ext) : entry.ext;
  const baseName = entry.name.replace(/\.[^.]+$/, '');
  const suffix = entry.stripped ? '_clean' : '';
  const name = `${baseName}${suffix}.${ext}`;
  const blob = new Blob([data]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function downloadAllZip(btn) {
  if (!fileEntries.length) {
    showInlineError(btn, 'Choose some files first.');
    return;
  }
  setBusy(btn, true, 'Packing...');
  const zip = new JSZip();
  for (const entry of fileEntries) {
    if (!entry.stripped) await stripFileMetadata(fileEntries.indexOf(entry));
    const ext = entry.strippedExt || entry.ext;
    const baseName = entry.name.replace(/\.[^.]+$/, '');
    zip.file(`${baseName}_clean.${ext}`, entry.stripped || entry.bytes);
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  setBusy(btn, false);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cleaned_files_${new Date().toISOString().slice(0, 10)}.zip`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function render() {
  if (!fileEntries.length) return;
  document.getElementById('statsRow').style.display = 'block';
  document.getElementById('statFiles').textContent = fileEntries.length;
  const withRisks = fileEntries.filter(e => e.risks.length > 0).length;
  document.getElementById('statRisks').textContent = withRisks;
  document.getElementById('statClean').textContent = fileEntries.filter(e => e.stripped).length;

  let html = '';
  for (let i = 0; i < fileEntries.length; i++) {
    const entry = fileEntries[i];
    const icon = FORMAT_ICONS[entry.ext] || 'file';
    const tagCount = Object.keys(entry.metadata).length;
    const riskBadge = entry.risks.length > 0
      ? `<span class="tag-badge warn"><i class="ph ph-warning" aria-hidden="true"></i> ${entry.risks.length} to review</span>`
      : `<span class="tag-badge ok"><i class="ph ph-check" aria-hidden="true"></i> Clean</span>`;
    const strippedBadge = entry.stripped ? '<span class="tag-badge info"><i class="ph ph-broom" aria-hidden="true"></i> Stripped</span>' : '';

    html += `<div class="result">
      <button class="file-header" type="button" onclick="toggleFile(${i})" aria-expanded="false" aria-controls="file-body-${i}">
        <span class="file-title"><i class="ph ph-${icon}" aria-hidden="true"></i> <span class="name">${escapeHTML(entry.name)}</span> ${riskBadge} ${strippedBadge}</span>
        <span class="file-count">${tagCount} properties <i class="ph ph-caret-down" aria-hidden="true"></i></span>
      </button>
      <div class="file-body" id="file-body-${i}">`;

    if (entry.risks.length > 0) {
      html += '<div class="warning-msg"><i class="ph ph-warning" aria-hidden="true"></i><div><b>Worth checking before you share</b><ul class="risk-list">';
      for (const [k, v] of entry.risks) html += `<li><b>${escapeHTML(k)}:</b> ${escapeHTML(v)}</li>`;
      html += '</ul></div></div>';
    } else {
      html += '<div class="success-msg"><i class="ph ph-check-circle" aria-hidden="true"></i> <span>No obvious privacy risks found.</span></div>';
    }

    if (Object.keys(entry.metadata).length) {
      html += '<table class="meta-table"><tr><th>Property</th><th>Value</th></tr>';
      for (const [k, v] of Object.entries(entry.metadata)) {
        const isSensitive = SENSITIVE_IMAGE_TAGS.has(k) || SENSITIVE_DOC_PROPS.has(k) || ['Company', 'Manager', 'Author', 'Creator', 'Producer'].includes(k);
        html += `<tr><td>${escapeHTML(k)}</td><td class="${isSensitive ? 'sensitive' : ''}">${escapeHTML(String(v).slice(0, 200))}</td></tr>`;
      }
      html += '</table>';
    }

    if (entry.metadata.latitude && entry.metadata.longitude) {
      const lat = parseFloat(entry.metadata.latitude);
      const lon = parseFloat(entry.metadata.longitude);
      if (!isNaN(lat) && !isNaN(lon)) {
        html += `<p class="mt-2"><a class="gps-link" href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" rel="noopener"><i class="ph ph-map-pin" aria-hidden="true"></i> View this location on Google Maps (${lat.toFixed(4)}, ${lon.toFixed(4)})</a></p>`;
      }
    }

    html += `<div class="actions-row">`;
    if (!entry.stripped) {
      html += `<button class="btn btn-sm btn-strip" type="button" onclick="stripFileMetadata(${i}, this)"><i class="ph ph-broom" aria-hidden="true"></i> Strip metadata</button>`;
    }
    html += `<button class="btn btn-sm btn-download" type="button" onclick="downloadFile(${i})"><i class="ph ph-download-simple" aria-hidden="true"></i> ${entry.stripped ? 'Download clean copy' : 'Download original'}</button>`;
    html += `</div></div></div>`;
  }
  document.getElementById('fileList').innerHTML = html;
}

function toggleFile(idx) {
  const body = document.getElementById('file-body-' + idx);
  const open = body.classList.toggle('open');
  const header = body.previousElementSibling;
  if (header) header.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
<script src="../assets/app.js" defer></script>
