    display: flex; align-items: center; gap: 14px;

  .result-card:last-child { border-bottom: none; }
  .result-thumb {
    width: 48px; height: 48px; border-radius: var(--radius);

  }

  .result-name {
    font-family: var(--font-mono); font-size: 0.8125rem;

  .result-sizes {

<body data-sw-path="../sw.js">

<header class="tool-header">
  <a class="back" href="../index.html"><i class="ph ph-arrow-left" aria-hidden="true"></i> <span>All tools</span></a>
  <h1><i class="ph ph-image" aria-hidden="true"></i> Image Compressor</h1>
  <div class="header-actions">
    <button class="icon-btn" type="button" id="themeToggle" aria-label="Toggle theme"></button>
    <a class="icon-btn" href="https://github.com/RehmozAyub/tools-for-everyone" aria-label="Source on GitHub"><i class="ph ph-github-logo" aria-hidden="true"></i></a>
  </div>
</header>

<div class="tool-layout">
  <aside class="tool-controls">
    <details class="panel" open data-mobile-collapsed>
      <summary><span>Settings</span><i class="ph ph-caret-down caret" aria-hidden="true"></i></summary>

      <div class="form-group">
        <label>Output format</label>
        <div class="radio-group">
          <label><input type="radio" name="format" value="keep" checked><span>Keep original</span></label>
          <label><input type="radio" name="format" value="jpeg"><span>JPEG</span></label>
          <label><input type="radio" name="format" value="webp"><span>WebP</span></label>
          <label><input type="radio" name="format" value="png"><span>PNG</span></label>
        </div>
      </div>

      <div class="form-group">
        <label for="quality">Quality, for JPEG and WebP only</label>
        <input type="range" id="quality" min="10" max="100" value="80">
        <div class="slider-value" id="qualityLabel">80%</div>
      </div>

      <div class="form-group">
        <label class="checkbox-label"><input type="checkbox" id="resizeEnable"><span>Resize</span></label>
      </div>
      <div class="settings-row" id="resizeFields" style="display:none;">
        <div class="form-group"><label for="maxWidth">Max width (px)</label><input type="number" id="maxWidth" value="1920" min="1"></div>
        <div class="form-group"><label for="maxHeight">Max height (px)</label><input type="number" id="maxHeight" value="1080" min="1"></div>
      </div>
      <p class="muted xsmall">Images only shrink to fit. The aspect ratio is always kept.</p>
    </details>
  </aside>

  <main class="tool-main">
    <p class="tool-intro">Compress and convert JPG, PNG, and WebP images. Nothing is uploaded.</p>

    <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Choose images to compress" onclick="document.getElementById('fileInput').click()">
      <i class="ph ph-upload-simple" aria-hidden="true"></i>
      <p class="dz-title">Drop files here or browse</p>
      <p class="dz-hint">JPG PNG WebP GIF BMP, any number of files</p>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>

    <div id="fileCount"></div>

    <div id="actionRow">
      <button class="btn btn-primary" type="button" onclick="compressAll(this)"><i class="ph ph-sliders-horizontal" aria-hidden="true"></i> Compress and convert</button>
    </div>

    <div id="resultsSection" class="result" style="display:none;">
      <div class="result-head">
        <h2>Results</h2>
        <button class="btn btn-sm btn-download" type="button" onclick="downloadAllZip()" id="zipBtn" style="display:none;"><i class="ph ph-package" aria-hidden="true"></i> Download all as ZIP</button>
      </div>
      <div class="result-body">
        <div id="totalsMsg"></div>
        <div id="resultsList" class="mt-3"></div>
      </div>
    </div>
  </main>
</div>

<footer class="tool-footer">
  <span>Made with ❤️ by <a href="https://github.com/RehmozAyub">RehmozAyub</a></span>

  <button class="link-btn" type="button" onclick="sharePage()">Share</button>

<script>
let uploadedFiles = [];
let results = [];

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e => handleFiles(e.target.files));

function handleFiles(fileList) {
  uploadedFiles = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  if (!uploadedFiles.length) return;
  let html = '<div class="file-list">';
  for (const f of uploadedFiles) {
    html += `<div class="file-row"><span class="file-name">${escapeHTML(f.name)}</span><span class="file-size">${fmtSize(f.size)}</span></div>`;
  }
  html += '</div>';
  document.getElementById('fileCount').innerHTML = html;
  document.getElementById('actionRow').style.display = 'block';
  document.getElementById('resultsSection').style.display = 'none';
}

document.getElementById('quality').addEventListener('input', function () {
  document.getElementById('qualityLabel').textContent = this.value + '%';
});
document.getElementById('resizeEnable').addEventListener('change', function () {
  document.getElementById('resizeFields').style.display = this.checked ? 'flex' : 'none';
});

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function extFromMime(mime) {
  return { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'image/bmp': 'bmp' }[mime] || 'jpg';
}

async function loadBitmap(file) {
  return await createImageBitmap(file);
}

async function processOne(file, opts) {
  const bitmap = await loadBitmap(file);
  let width = bitmap.width, height = bitmap.height;

  if (opts.resize) {
    const scale = Math.min(opts.maxWidth / width, opts.maxHeight / height, 1);
    width = Math.max(1, Math.round(width * scale));
    height = Math.max(1, Math.round(height * scale));
  }

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  let mime = opts.format === 'keep' ? (file.type || 'image/jpeg') : `image/${opts.format}`;
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(mime)) mime = 'image/jpeg';

  if (mime === 'image/jpeg') {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
  }
  ctx.drawImage(bitmap, 0, 0, width, height);
  bitmap.close();

  const quality = opts.quality / 100;
  const blob = await new Promise(resolve => canvas.toBlob(resolve, mime, quality));
  return { blob, mime, ext: extFromMime(mime), width, height };
}

async function compressAll(btn) {
  if (!uploadedFiles.length) {
    showInlineError(btn, 'Choose at least one image first.');
    return;
  }
  const opts = {
    format: document.querySelector('input[name="format"]:checked').value,
    quality: parseInt(document.getElementById('quality').value) || 80,
    resize: document.getElementById('resizeEnable').checked,
    maxWidth: parseInt(document.getElementById('maxWidth').value) || 1920,
    maxHeight: parseInt(document.getElementById('maxHeight').value) || 1080,
  };

  setBusy(btn, true, 'Compressing...');
  document.getElementById('resultsSection').style.display = 'none';
  document.getElementById('resultsList').innerHTML = '';

  results = [];
  for (const file of uploadedFiles) {
    try {
      const out = await processOne(file, opts);
      results.push({ name: file.name, origSize: file.size, ...out });
    } catch (e) {
      results.push({ name: file.name, error: e.message });
    }
  }
  setBusy(btn, false);
  document.getElementById('resultsSection').style.display = 'block';
  renderResults();
}

function renderResults() {
  const okResults = results.filter(r => !r.error);
  const totalOrig = okResults.reduce((s, r) => s + r.origSize, 0);
  const totalNew = okResults.reduce((s, r) => s + r.blob.size, 0);
  const pct = totalOrig > 0 ? Math.round((1 - totalNew / totalOrig) * 100) : 0;

  document.getElementById('totalsMsg').innerHTML = totalOrig > 0
    ? `<p class="totals-line">Total ${fmtSize(totalOrig)} <i class="ph ph-arrow-right" aria-hidden="true"></i> ${fmtSize(totalNew)} <span class="${pct >= 0 ? 'saved' : 'grew'}">(${pct >= 0 ? '-' : '+'}${Math.abs(pct)}%)</span></p>`
    : '';

  document.getElementById('zipBtn').style.display = okResults.length > 1 ? 'inline-flex' : 'none';

  let html = '';
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    if (r.error) {
      html += `<div class="result-card"><div class="result-info"><div class="result-name">${escapeHTML(r.name)}</div><div class="error-msg mt-1"><i class="ph ph-warning-circle" aria-hidden="true"></i> <span>${escapeHTML(r.error)}</span></div></div></div>`;
      continue;
    }
    const url = URL.createObjectURL(r.blob);
    const delta = Math.round((1 - r.blob.size / r.origSize) * 100);
    const outName = r.name.replace(/\.[^.]+$/, '') + '.' + r.ext;
    html += `<div class="result-card">
      <img class="result-thumb" src="${url}" alt="">
      <div class="result-info">
        <div class="result-name">${escapeHTML(outName)}</div>
        <div class="result-sizes">${fmtSize(r.origSize)} <i class="ph ph-arrow-right" aria-hidden="true"></i> ${fmtSize(r.blob.size)}
          <span class="${delta >= 0 ? 'saved' : 'grew'}">${delta >= 0 ? '-' : '+'}${Math.abs(delta)}%</span>
          <span>${r.width} by ${r.height}</span>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn btn-sm btn-download" type="button" onclick="downloadOne(${i})" aria-label="Download ${escapeHTML(outName)}"><i class="ph ph-download-simple" aria-hidden="true"></i></button>
      </div>
    </div>`;
  }
  document.getElementById('resultsList').innerHTML = html;
}

function downloadOne(idx) {
  const r = results[idx];
  if (!r || r.error) return;
  const outName = r.name.replace(/\.[^.]+$/, '') + '.' + r.ext;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(r.blob);
  a.download = outName;
  a.click();
}

async function downloadAllZip() {
  const zip = new JSZip();
  const usedNames = new Set();
  for (const r of results) {
    if (r.error) continue;
    let outName = r.name.replace(/\.[^.]+$/, '') + '.' + r.ext;
    while (usedNames.has(outName)) outName = outName.replace(/(\.[^.]+)$/, '_2$1');
    usedNames.add(outName);
    zip.file(outName, r.blob);
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `compressed_images_${new Date().toISOString().slice(0, 10)}.zip`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
