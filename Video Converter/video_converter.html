<script>
const TOOLS = [
  { id: 'to_gif', icon: 'film-strip', name: 'Video to GIF' },
  { id: 'compress', icon: 'gauge', name: 'Compress video' },
];
let currentTool = 'to_gif';

function initToolList() {
  document.getElementById('toolList').innerHTML = TOOLS.map(t =>
    `<button class="tool-item${t.id === currentTool ? ' active' : ''}" type="button" onclick="selectTool('${t.id}',this)"><i class="ph ph-${t.icon}" aria-hidden="true"></i> ${t.name}</button>`
  ).join('');
}
function selectTool(id, el) {
  currentTool = id;
  document.querySelectorAll('.tool-item').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  renderTool();
}

function dropZoneHTML(id, label, hint) {
  return `<div class="drop-zone" id="dz-${id}" role="button" tabindex="0" aria-label="${label}" onclick="document.getElementById('fi-${id}').click()">
    <i class="ph ph-upload-simple" aria-hidden="true"></i>
    <p class="dz-title">Drop a video here or browse</p>
    <p class="dz-hint">${hint}</p>
    <input type="file" id="fi-${id}" accept="video/*">
  </div><div id="info-${id}"></div>`;
}

function renderTool() {
  const c = document.getElementById('toolContent');
  if (currentTool === 'to_gif') {
    c.innerHTML = `<h2>Video to GIF</h2>
      <p class="tool-info"><i class="ph ph-info" aria-hidden="true"></i> <span>Convert a video clip into an animated GIF.</span></p>
      ${dropZoneHTML('gif', 'Choose a video to convert', 'MP4 MOV WebM AVI MKV, one file')}
      <div class="form-row">
        <div class="form-group"><label for="gifFps">Frame rate (fps)</label><input type="range" id="gifFps" min="5" max="15" value="10"><div class="slider-value" id="gifFpsVal">10 fps</div></div>
        <div class="form-group"><label for="gifWidth">Max width (px)</label><input type="number" id="gifWidth" value="480" min="64" max="1280"></div>
      </div>
      <div class="form-group"><label for="gifDuration">Seconds to convert, counted from the start</label><input type="number" id="gifDuration" value="5" min="1" max="60"></div>
      <p class="muted xsmall">GIFs get large fast. Shorter, smaller clips work best.</p>
      <button class="btn btn-primary" type="button" onclick="doVideoToGif(this)"><i class="ph ph-film-strip" aria-hidden="true"></i> Convert to GIF</button>
      <div id="gifProgress"></div>
      <div id="gifResult"></div>`;
  } else {
    c.innerHTML = `<h2>Compress video</h2>
      <p class="tool-info"><i class="ph ph-info" aria-hidden="true"></i> <span>Shrink a video's file size. The output is always MP4.</span></p>
      ${dropZoneHTML('cmp', 'Choose a video to compress', 'MP4 MOV WebM AVI MKV, one file')}
      <div class="form-group"><label>Compression</label>
        <div class="radio-group">
          <label><input type="radio" name="cmpLevel" value="23"><span>Light</span></label>
          <label><input type="radio" name="cmpLevel" value="28" checked><span>Medium</span></label>
          <label><input type="radio" name="cmpLevel" value="35"><span>Strong</span></label>
        </div>
      </div>
      <div class="form-group"><label for="cmpRes">Max resolution</label>
        <select id="cmpRes">
          <option value="0">Original</option>
          <option value="1080">1080p</option>
          <option value="720" selected>720p</option>
          <option value="480">480p</option>
        </select>
      </div>
      <button class="btn btn-primary" type="button" onclick="doCompressVideo(this)"><i class="ph ph-gauge" aria-hidden="true"></i> Compress video</button>
      <div id="cmpProgress"></div>
      <div id="cmpResult"></div>`;
  }
  setupDropZones();
}

let storedFiles = {};
function setupDropZones() {
  document.querySelectorAll('.drop-zone').forEach(dz => {
    const id = dz.id.replace('dz-', '');
    const fi = document.getElementById('fi-' + id);
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); fi.files = e.dataTransfer.files; fi.dispatchEvent(new Event('change')); });
    fi.addEventListener('change', () => {
      const file = fi.files[0];
      if (!file) return;
      storedFiles[id] = file;
      document.getElementById('info-' + id).innerHTML =
        `<div class="file-list"><div class="file-row"><span class="file-name">${escapeHTML(file.name)}</span><span class="file-size">${fmtSize(file.size)}</span></div></div>`;
    });
  });
  const fps = document.getElementById('gifFps');
  if (fps) fps.addEventListener('input', function () { document.getElementById('gifFpsVal').textContent = this.value + ' fps'; });
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}
function escapeHTML(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

// FFmpeg engine loading (single-threaded core, no COOP/COEP needed, works on plain static hosting)
let ffmpegPromise = null;
let currentProgressHandler = null;

async function fetchWithProgress(url, mimeType, onFraction) {
  const res = await fetch(url);
  const total = parseInt(res.headers.get('content-length') || '0');
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (total && onFraction) onFraction(received / total);
  }
  return URL.createObjectURL(new Blob(chunks, { type: mimeType }));
}

function getFFmpeg(onStatus) {
  if (!ffmpegPromise) {
    ffmpegPromise = (async () => {
      const { FFmpeg } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js');
      const { toBlobURL } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');

      const coreBase = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';
      const ffBase = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm';

      onStatus && onStatus('Downloading the video engine', 0);
      const [coreURL, constSrc, errorsSrc, workerSrc] = await Promise.all([
        toBlobURL(`${coreBase}/ffmpeg-core.js`, 'text/javascript'),
        fetch(`${ffBase}/const.js`).then(r => r.text()),
        fetch(`${ffBase}/errors.js`).then(r => r.text()),
        fetch(`${ffBase}/worker.js`).then(r => r.text()),
      ]);
      const wasmURL = await fetchWithProgress(`${coreBase}/ffmpeg-core.wasm`, 'application/wasm', (f) => {
        onStatus && onStatus('Downloading the video engine', Math.round(f * 90));
      });

      // worker.js statically imports ./const.js and ./errors.js by relative path, which
      // breaks once worker.js is loaded from a blob: URL (no real sibling files exist there).
      // Inlining their (tiny, dependency-free) contents into one script sidesteps that.
      const strip = (src) => src.replace(/^export\s+/gm, '').replace(/^import[^\n]*\n/gm, '');
      const merged = strip(constSrc) + '\n' + strip(errorsSrc) + '\n' + strip(workerSrc);
      const classWorkerURL = URL.createObjectURL(new Blob([merged], { type: 'text/javascript' }));

      onStatus && onStatus('Starting the video engine', 95);
      const ffmpeg = new FFmpeg();
      ffmpeg.on('progress', (data) => { if (currentProgressHandler) currentProgressHandler(data); });
      await ffmpeg.load({ coreURL, wasmURL, classWorkerURL });
      onStatus && onStatus('Ready', 100);
      return ffmpeg;
    })();
  }
  return ffmpegPromise;
}

function showProgress(elId, label, pct) {
  setProgress(document.getElementById(elId), pct == null ? 0 : pct, label);
}

async function doVideoToGif(btn) {
  const file = storedFiles['gif'];
  if (!file) { showInlineError(btn, 'Choose a video first.'); return; }
  const fps = document.getElementById('gifFps').value;
  const width = parseInt(document.getElementById('gifWidth').value) || 480;
  const duration = Math.min(parseInt(document.getElementById('gifDuration').value) || 5, 60);

  document.getElementById('gifResult').innerHTML = '';
  setBusy(btn, true, 'Converting...');
  showProgress('gifProgress', 'Loading the video engine', 0);

  try {
    const ffmpeg = await getFFmpeg((label, pct) => setSafe('gifProgress', () => showProgress('gifProgress', label, pct)));
    currentProgressHandler = ({ progress }) => setSafe('gifProgress', () => showProgress('gifProgress', 'Converting to GIF', Math.min(100, Math.round(progress * 100))));

    const { fetchFile } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');
    await ffmpeg.writeFile('in.mp4', await fetchFile(file));
    await ffmpeg.exec(['-i', 'in.mp4', '-t', String(duration), '-vf', `fps=${fps},scale=${width}:-1:flags=lanczos`, 'out.gif']);
    const data = await ffmpeg.readFile('out.gif');
    await ffmpeg.deleteFile('in.mp4');
    await ffmpeg.deleteFile('out.gif');

    const blob = new Blob([data.buffer], { type: 'image/gif' });
    const url = URL.createObjectURL(blob);
    setSafe('gifProgress', () => clearProgress(document.getElementById('gifProgress')));
    setSafe('gifResult', () => { document.getElementById('gifResult').innerHTML = `
      <div class="result">
        <div class="result-head">
          <h2>Your GIF</h2>
          <button class="btn btn-sm btn-download" type="button" onclick="downloadBlobUrl('${url}','${file.name.replace(/\.[^.]+$/, '')}.gif')"><i class="ph ph-download-simple" aria-hidden="true"></i> Download GIF</button>
        </div>
        <div class="result-body">
          <div class="size-compare">${fmtSize(file.size)} <i class="ph ph-arrow-right" aria-hidden="true"></i> ${fmtSize(blob.size)}</div>
          <img class="result-preview" src="${url}" alt="Preview of the converted GIF">
        </div>
      </div>`; });
  } catch (e) {
    setSafe('gifProgress', () => clearProgress(document.getElementById('gifProgress')));
    setSafe('gifResult', () => { document.getElementById('gifResult').innerHTML = `<div class="error-msg"><i class="ph ph-warning-circle" aria-hidden="true"></i> <span>${escapeHTML(e.message)}</span></div>`; });
  } finally {
    currentProgressHandler = null;
    setBusy(btn, false);
  }
}

function setSafe(elId, fn) {
  if (document.getElementById(elId)) fn();
}

async function doCompressVideo(btn) {
  const file = storedFiles['cmp'];
  if (!file) { showInlineError(btn, 'Choose a video first.'); return; }
  const crf = document.querySelector('input[name="cmpLevel"]:checked').value;
  const maxRes = parseInt(document.getElementById('cmpRes').value) || 0;

  document.getElementById('cmpResult').innerHTML = '';
  setBusy(btn, true, 'Compressing...');
  showProgress('cmpProgress', 'Loading the video engine', 0);

  try {
    const ffmpeg = await getFFmpeg((label, pct) => setSafe('cmpProgress', () => showProgress('cmpProgress', label, pct)));
    currentProgressHandler = ({ progress }) => setSafe('cmpProgress', () => showProgress('cmpProgress', 'Compressing', Math.min(100, Math.round(progress * 100))));

    const { fetchFile } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');
    await ffmpeg.writeFile('in.mp4', await fetchFile(file));

    const args = ['-i', 'in.mp4', '-c:v', 'libx264', '-crf', crf, '-preset', 'veryfast'];
    if (maxRes > 0) args.push('-vf', `scale='min(iw,${Math.round(maxRes * 16 / 9)})':'min(ih,${maxRes})':force_original_aspect_ratio=decrease`);
    args.push('-c:a', 'aac', '-b:a', '128k', 'out.mp4');

    await ffmpeg.exec(args);
    const data = await ffmpeg.readFile('out.mp4');
    await ffmpeg.deleteFile('in.mp4');
    await ffmpeg.deleteFile('out.mp4');

    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    const delta = Math.round((1 - blob.size / file.size) * 100);
    setSafe('cmpProgress', () => clearProgress(document.getElementById('cmpProgress')));
    setSafe('cmpResult', () => { document.getElementById('cmpResult').innerHTML = `
      <div class="result">
        <div class="result-head">
          <h2>Your compressed video</h2>
          <button class="btn btn-sm btn-download" type="button" onclick="downloadBlobUrl('${url}','${file.name.replace(/\.[^.]+$/, '')}_compressed.mp4')"><i class="ph ph-download-simple" aria-hidden="true"></i> Download MP4</button>
        </div>
        <div class="result-body">
          <div class="size-compare">${fmtSize(file.size)} <i class="ph ph-arrow-right" aria-hidden="true"></i> ${fmtSize(blob.size)} <span class="${delta >= 0 ? 'saved' : 'grew'}">${delta >= 0 ? '-' : '+'}${Math.abs(delta)}%</span></div>
          <video class="result-preview" src="${url}" controls></video>
        </div>
      </div>`; });
  } catch (e) {
    setSafe('cmpProgress', () => clearProgress(document.getElementById('cmpProgress')));
    setSafe('cmpResult', () => { document.getElementById('cmpResult').innerHTML = `<div class="error-msg"><i class="ph ph-warning-circle" aria-hidden="true"></i> <span>${escapeHTML(e.message)}</span></div>`; });
  } finally {
    currentProgressHandler = null;
    setBusy(btn, false);
  }
}

function downloadBlobUrl(url, name) {
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
}

initToolList();
renderTool();
</script>
